<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energie Cinetică/Potențială — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #f07090;
  --accent-dim: rgba(240,112,144,0.10);
  --accent-border: rgba(240,112,144,0.28);
}

.mode-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); }
.mode-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.mode-btn.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }

.fields-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--content-gap); margin-bottom: var(--content-gap); }
@media (max-width: 500px) { .fields-grid { grid-template-columns: 1fr; } }
.field-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.field-name { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text2); font-weight: 500; margin-bottom: 8px; display: block; }

.result-card {
  background: var(--bg2);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius);
  padding: 18px 20px;
  text-align: center;
  margin-bottom: var(--content-gap);
}
.result-main { font-family: var(--font-mono); font-size: 2rem; font-weight: 700; color: var(--accent); }
.result-sub { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text3); margin-top: 4px; }

.info-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: var(--content-gap); }
@media (max-width: 500px) { .info-row { grid-template-columns: 1fr; } }
.info-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; text-align: center; }
.info-val { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 600; color: var(--text); }
.info-key { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

.ref-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.72rem; }
.ref-table th { text-align: left; color: var(--text3); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 10px; border-bottom: 1px solid var(--border); }
.ref-table td { padding: 4px 10px; border-bottom: 1px solid rgba(128,128,128,0.05); color: var(--text2); cursor: pointer; }
.ref-table tr:hover td { background: var(--bg3); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Energie cinetică / potențială</h1>
    <p>Ec = ½mv², Ep = mgh — masă, viteză, înălțime → energie</p>
  </div>

  <div class="mode-row">
    <button class="mode-btn active" id="btn-kinetic" onclick="setMode('kinetic')">Cinetică (Ec)</button>
    <button class="mode-btn" id="btn-potential" onclick="setMode('potential')">Potențială (Ep)</button>
  </div>

  <div id="panel-kinetic">
    <div class="fields-grid">
      <div class="field-card">
        <span class="field-name">Masă (kg)</span>
        <input class="input-calc" id="in-mass-k" type="number" min="0" step="any" value="70"
               style="--input-color:var(--accent);font-size:1.05rem" oninput="compute()">
      </div>
      <div class="field-card">
        <span class="field-name">Viteză (m/s)</span>
        <input class="input-calc" id="in-velocity" type="number" min="0" step="any" value="5"
               style="--input-color:var(--accent);font-size:1.05rem" oninput="compute()">
      </div>
    </div>
  </div>

  <div id="panel-potential" style="display:none">
    <div class="fields-grid">
      <div class="field-card">
        <span class="field-name">Masă (kg)</span>
        <input class="input-calc" id="in-mass-p" type="number" min="0" step="any" value="70"
               style="--input-color:var(--accent);font-size:1.05rem" oninput="compute()">
      </div>
      <div class="field-card">
        <span class="field-name">Înălțime (m)</span>
        <input class="input-calc" id="in-height" type="number" min="0" step="any" value="10"
               style="--input-color:var(--accent);font-size:1.05rem" oninput="compute()">
      </div>
    </div>
  </div>

  <div class="result-card">
    <div class="result-main" id="result-main">—</div>
    <div class="result-sub" id="result-sub"></div>
  </div>

  <div class="info-row" id="info-row"></div>

  <div class="card">
    <div class="field-label" style="margin-bottom:10px">Referință energii comune (Jouli)</div>
    <table class="ref-table" id="ref-table"></table>
  </div>
</div>

<script>
let mode = 'kinetic';
const G = 9.80665; // accelerația gravitațională standard, m/s²

const REF_ENERGIES = [
  { name: 'Bătaie inimă', j: 1 },
  { name: 'Măr căzând 1m', j: 1 },
  { name: 'Minge tenis servată', j: 25 },
  { name: 'Glonț pistol (calibru 9mm)', j: 500 },
  { name: 'Automobil la 50 km/h (1000kg)', j: 96450 },
  { name: '1 kWh electricitate', j: 3600000 },
  { name: 'Bombă atomică Hiroshima', j: 6.3e13 },
];

function trim(n) {
  if (!isFinite(n)) return '—';
  return parseFloat(n.toPrecision(6)).toLocaleString('ro-RO', {maximumFractionDigits: 4});
}

function fmtJ(j) {
  if (j >= 1e9) return trim(j/1e9) + ' GJ';
  if (j >= 1e6) return trim(j/1e6) + ' MJ';
  if (j >= 1e3) return trim(j/1e3) + ' kJ';
  return trim(j) + ' J';
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-kinetic').classList.toggle('active', m==='kinetic');
  document.getElementById('btn-potential').classList.toggle('active', m==='potential');
  document.getElementById('panel-kinetic').style.display = m==='kinetic' ? 'block':'none';
  document.getElementById('panel-potential').style.display = m==='potential' ? 'block':'none';
  compute();
}

function compute() {
  const resultMain = document.getElementById('result-main');
  const resultSub = document.getElementById('result-sub');
  const infoRow = document.getElementById('info-row');

  if (mode === 'kinetic') {
    const mass = parseFloat(document.getElementById('in-mass-k').value);
    const v = parseFloat(document.getElementById('in-velocity').value);

    if (isNaN(mass) || isNaN(v) || mass<0 || v<0) {
      resultMain.textContent = '—'; resultSub.textContent = 'Completează valorile';
      infoRow.innerHTML = '';
      return;
    }

    const Ec = 0.5 * mass * v * v;
    resultMain.textContent = fmtJ(Ec);
    resultSub.textContent = `Ec = ½ × ${mass}kg × (${v}m/s)²`;

    infoRow.innerHTML = `
      <div class="info-card"><div class="info-val">${trim(v*3.6)}</div><div class="info-key">km/h</div></div>
      <div class="info-card"><div class="info-val">${trim(Ec/4184)}</div><div class="info-key">calorii</div></div>
      <div class="info-card"><div class="info-val">${trim(Ec/3600000)}</div><div class="info-key">kWh</div></div>
    `;
  } else {
    const mass = parseFloat(document.getElementById('in-mass-p').value);
    const h = parseFloat(document.getElementById('in-height').value);

    if (isNaN(mass) || isNaN(h) || mass<0) {
      resultMain.textContent = '—'; resultSub.textContent = 'Completează valorile';
      infoRow.innerHTML = '';
      return;
    }

    const Ep = mass * G * h;
    resultMain.textContent = fmtJ(Ep);
    resultSub.textContent = `Ep = ${mass}kg × 9.807m/s² × ${h}m`;

    // viteza de impact dacă ar cădea liber de la această înălțime (conversie Ep→Ec)
    const impactV = Math.sqrt(2*G*Math.abs(h));
    infoRow.innerHTML = `
      <div class="info-card"><div class="info-val">${trim(impactV)}</div><div class="info-key">m/s la impact</div></div>
      <div class="info-card"><div class="info-val">${trim(impactV*3.6)}</div><div class="info-key">km/h la impact</div></div>
      <div class="info-card"><div class="info-val">${trim(Ep/4184)}</div><div class="info-key">calorii</div></div>
    `;
  }
}

function buildRefTable() {
  const table = document.getElementById('ref-table');
  table.innerHTML = `<thead><tr><th>Context</th><th>Energie</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  REF_ENERGIES.forEach(e => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${e.name}</td><td>${fmtJ(e.j)}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

buildRefTable();
compute();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Energie cinetică/pot.</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
