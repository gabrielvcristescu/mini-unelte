<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convertor mAh ↔ Wh — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #70d0f0;
  --accent-dim: rgba(112,208,240,0.10);
  --accent-border: rgba(112,208,240,0.28);
}

.fields-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: var(--content-gap);
}
@media (max-width: 600px) { .fields-grid { grid-template-columns: 1fr; } }

.field-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.field-card.locked { opacity: 0.45; }
.field-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.field-name { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text2); font-weight: 500; }
.field-unit {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--text3);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
}

.direction-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); align-items: center; }
.dir-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.dir-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent-border);
  color: var(--accent);
}

.result-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  text-align: center;
}
.result-main {
  font-family: var(--font-mono);
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.2;
}
.result-formula { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text3); margin-top: 4px; }

/* ── Common battery reference table ── */
.ref-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 0.74rem;
}
.ref-table th {
  text-align: left;
  color: var(--text3);
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 5px 10px;
  border-bottom: 1px solid var(--border);
}
.ref-table td {
  padding: 5px 10px;
  border-bottom: 1px solid rgba(128,128,128,0.05);
  color: var(--text2);
  cursor: pointer;
}
.ref-table tr:hover td { background: var(--bg3); }
.ref-table tr:last-child td { border-bottom: none; }
.ref-name { color: var(--text); font-weight: 500; }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Convertor mAh ↔ Wh</h1>
    <p>Pentru comparații corecte de capacitate baterii — mAh singur nu spune nimic fără tensiune</p>
  </div>

  <!-- Direcție -->
  <div class="direction-row">
    <button class="dir-btn active" id="btn-fwd" onclick="setDir('fwd')">mAh → Wh</button>
    <button class="dir-btn" id="btn-rev" onclick="setDir('rev')">Wh → mAh</button>
  </div>

  <!-- Câmpuri -->
  <div class="fields-grid" style="margin-bottom:var(--content-gap)">
    <div class="field-card" id="card-mah">
      <div class="field-top"><span class="field-name">Capacitate</span><span class="field-unit">mAh</span></div>
      <input class="input-calc" id="in-mah" type="number" min="0" step="any" value="10000"
             style="--input-color:var(--accent);font-size:1.1rem" oninput="compute()">
    </div>
    <div class="field-card">
      <div class="field-top"><span class="field-name">Tensiune</span><span class="field-unit">V</span></div>
      <input class="input-calc" id="in-voltage" type="number" min="0" step="any" value="3.7"
             style="--input-color:var(--accent);font-size:1.1rem" oninput="compute()">
    </div>
    <div class="field-card" id="card-wh">
      <div class="field-top"><span class="field-name">Energie</span><span class="field-unit">Wh</span></div>
      <input class="input-calc" id="in-wh" type="number" min="0" step="any" value="37"
             style="--input-color:var(--accent);font-size:1.1rem" oninput="compute()" disabled>
    </div>
  </div>

  <!-- Rezultat -->
  <div class="result-card" style="margin-bottom:var(--content-gap)">
    <div class="result-main" id="result-main">—</div>
    <div class="result-formula" id="result-formula"></div>
  </div>

  <!-- Referință baterii comune -->
  <div class="card">
    <div class="field-name" style="margin-bottom:10px">Baterii comune (click pentru a completa)</div>
    <table class="ref-table">
      <thead><tr><th>Tip</th><th>Capacitate</th><th>Tensiune</th><th>Energie</th></tr></thead>
      <tbody id="ref-tbody"></tbody>
    </table>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
let direction = 'fwd';

const COMMON_BATTERIES = [
  { name: 'AA alcalină', mah: 2000, v: 1.5 },
  { name: 'AAA alcalină', mah: 1000, v: 1.5 },
  { name: 'Li-ion 18650', mah: 3000, v: 3.7 },
  { name: 'Li-ion 21700', mah: 5000, v: 3.7 },
  { name: 'LiPo 1S (telefon)', mah: 4000, v: 3.7 },
  { name: 'Power bank tipic', mah: 10000, v: 3.7 },
  { name: 'Baterie auto 12V', mah: 50000, v: 12 },
  { name: 'Baterie Raspberry Pi UPS', mah: 5000, v: 5 },
];

function trim(n) { return parseFloat(n.toPrecision(5)).toString(); }

function setDir(d) {
  direction = d;
  document.getElementById('btn-fwd').classList.toggle('active', d === 'fwd');
  document.getElementById('btn-rev').classList.toggle('active', d === 'rev');

  const cardMah = document.getElementById('card-mah');
  const cardWh = document.getElementById('card-wh');
  const inMah = document.getElementById('in-mah');
  const inWh = document.getElementById('in-wh');

  if (d === 'fwd') {
    cardMah.classList.remove('locked');
    cardWh.classList.add('locked');
    inMah.disabled = false;
    inWh.disabled = true;
  } else {
    cardMah.classList.add('locked');
    cardWh.classList.remove('locked');
    inMah.disabled = true;
    inWh.disabled = false;
  }
  compute();
}

function compute() {
  const voltage = parseFloat(document.getElementById('in-voltage').value);
  const main = document.getElementById('result-main');
  const formula = document.getElementById('result-formula');

  if (isNaN(voltage) || voltage <= 0) {
    main.textContent = '—';
    formula.textContent = 'Introdu o tensiune validă';
    return;
  }

  if (direction === 'fwd') {
    const mah = parseFloat(document.getElementById('in-mah').value);
    if (isNaN(mah) || mah <= 0) {
      main.textContent = '—'; formula.textContent = 'Introdu capacitatea în mAh';
      return;
    }
    const wh = (mah / 1000) * voltage;
    document.getElementById('in-wh').value = trim(wh);
    main.textContent = trim(wh) + ' Wh';
    formula.textContent = `Wh = (mAh / 1000) × V = (${mah} / 1000) × ${voltage}V`;
  } else {
    const wh = parseFloat(document.getElementById('in-wh').value);
    if (isNaN(wh) || wh <= 0) {
      main.textContent = '—'; formula.textContent = 'Introdu energia în Wh';
      return;
    }
    const mah = (wh / voltage) * 1000;
    document.getElementById('in-mah').value = trim(mah);
    main.textContent = trim(mah) + ' mAh';
    formula.textContent = `mAh = (Wh / V) × 1000 = (${wh} / ${voltage}V) × 1000`;
  }
}

function buildRefTable() {
  const tbody = document.getElementById('ref-tbody');
  COMMON_BATTERIES.forEach(b => {
    const wh = (b.mah/1000) * b.v;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="ref-name">${b.name}</td>
      <td>${b.mah.toLocaleString('ro-RO')} mAh</td>
      <td>${b.v} V</td>
      <td>${trim(wh)} Wh</td>
    `;
    tr.onclick = () => {
      document.getElementById('in-mah').value = b.mah;
      document.getElementById('in-voltage').value = b.v;
      if (direction === 'rev') setDir('fwd');
      else compute();
    };
    tbody.appendChild(tr);
  });
}

document.getElementById('in-voltage').addEventListener('input', compute);

buildRefTable();
compute();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Calculator mAh → Wh</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
