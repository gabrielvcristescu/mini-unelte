<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash Generator — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #60a0f0;
  --accent-dim: rgba(96,160,240,0.10);
  --accent-border: rgba(96,160,240,0.28);
}

.big-textarea {
  width: 100%;
  min-height: 110px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.88rem;
  color: var(--text);
  outline: none;
  resize: vertical;
  line-height: 1.6;
  margin-bottom: var(--content-gap);
}
.big-textarea:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-dim); }

.area-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.area-name { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.mini-btn {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.mini-btn:hover { border-color: var(--accent-border); color: var(--accent); }

.hash-list { display: flex; flex-direction: column; gap: 8px; }
.hash-row {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.hash-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.hash-algo { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; color: var(--accent); }
.hash-val {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text2);
  word-break: break-all;
  line-height: 1.5;
}
.copy-mini {
  background: none; border: none; cursor: pointer;
  color: var(--text3); padding: 3px 6px; border-radius: 4px;
  font-family: var(--font-mono); font-size: 0.62rem;
  transition: color 0.12s, background 0.12s;
}
.copy-mini:hover { color: var(--text2); background: var(--bg3); }

/* ── Compare mode ── */
.compare-row { display: flex; gap: 8px; align-items: center; margin-top: var(--content-gap); }
.compare-row input {
  flex: 1;
  font-size: 0.78rem !important;
}
.compare-result {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 700;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
}
.compare-result.match { background: rgba(74,240,176,0.1); color: #4af0b0; border: 1px solid rgba(74,240,176,0.25); }
.compare-result.nomatch { background: rgba(240,96,96,0.1); color: #f06060; border: 1px solid rgba(240,96,96,0.25); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Hash generator</h1>
    <p>SHA-256 / SHA-1 / SHA-512, local via Web Crypto API</p>
  </div>

  <div class="area-label">
    <span class="area-name">Text</span>
    <div style="display:flex;gap:6px">
      <button class="mini-btn" onclick="pasteInto()">Lipește</button>
      <button class="mini-btn" onclick="clearInput()">Șterge</button>
    </div>
  </div>
  <textarea class="big-textarea" id="input-area" placeholder="Scrie text aici..." oninput="compute()"></textarea>

  <div class="hash-list" id="hash-list"></div>

  <!-- Comparare hash ── -->
  <div class="card" style="margin-top:var(--content-gap)">
    <div class="field-label" style="margin-bottom:8px">Compară cu un hash existent</div>
    <div class="compare-row">
      <input class="input-calc" id="compare-input" type="text" placeholder="Lipește un hash pentru comparație..."
             style="--input-color:var(--accent)" oninput="compareHash()">
      <div class="compare-result" id="compare-result" style="display:none"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
const ALGOS = [
  { name: 'SHA-256', label: 'SHA-256' },
  { name: 'SHA-1', label: 'SHA-1' },
  { name: 'SHA-512', label: 'SHA-512' },
];

let lastHashes = {};

async function hashText(algo, text) {
  const data = new TextEncoder().encode(text);
  const hashBuffer = await crypto.subtle.digest(algo, data);
  const hashArray = [...new Uint8Array(hashBuffer)];
  return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
}

async function compute() {
  const text = document.getElementById('input-area').value;
  const list = document.getElementById('hash-list');

  if (!text) {
    list.innerHTML = '';
    lastHashes = {};
    compareHash();
    return;
  }

  list.innerHTML = ALGOS.map(a => `
    <div class="hash-row">
      <div class="hash-top">
        <span class="hash-algo">${a.label}</span>
        <button class="copy-mini" onclick="copyHash('${a.name}')">Copiază</button>
      </div>
      <div class="hash-val" id="hash-${a.name}">calculează...</div>
    </div>
  `).join('');

  for (const a of ALGOS) {
    const hash = await hashText(a.name, text);
    lastHashes[a.name] = hash;
    const el = document.getElementById('hash-' + a.name);
    if (el) el.textContent = hash;
  }

  compareHash();
}

function copyHash(algo) {
  const hash = lastHashes[algo];
  if (!hash) return;
  navigator.clipboard.writeText(hash).then(() => showToast('Copiat: ' + algo));
}

function clearInput() {
  document.getElementById('input-area').value = '';
  compute();
}

function pasteInto() {
  navigator.clipboard.readText().then(text => {
    document.getElementById('input-area').value = text;
    compute();
  }).catch(() => showToast('Nu s-a putut accesa clipboard-ul'));
}

function compareHash() {
  const compareVal = document.getElementById('compare-input').value.trim().toLowerCase();
  const resultEl = document.getElementById('compare-result');

  if (!compareVal) { resultEl.style.display = 'none'; return; }

  const allHashes = Object.values(lastHashes).map(h => h.toLowerCase());
  const matches = allHashes.includes(compareVal);

  resultEl.style.display = 'block';
  if (matches) {
    resultEl.textContent = '✓ Potrivire găsită';
    resultEl.className = 'compare-result match';
  } else {
    resultEl.textContent = '✕ Nicio potrivire';
    resultEl.className = 'compare-result nomatch';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

document.getElementById('compare-input').addEventListener('input', compareHash);

compute();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Hash generator</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
