<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greutatea pe Planete — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="astronomy.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #f07090;
  --accent-dim: rgba(240,112,144,0.10);
  --accent-border: rgba(240,112,144,0.28);
}

.field-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: var(--content-gap);
}
.field-name { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text2); font-weight: 500; margin-bottom: 8px; display: block; }

.planet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}
.planet-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  transition: all 0.15s;
}
.planet-card.earth { border-color: var(--accent-border); background: var(--accent-dim); }
.planet-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.planet-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.planet-name { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700; color: var(--text); }
.planet-weight { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 700; color: var(--text); }
.planet-card.earth .planet-weight { color: var(--accent); }
.planet-g { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text3); margin-top: 3px; }
.planet-bar-bg { height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.planet-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
.planet-preview { aspect-ratio:1.45; margin:-12px -14px 10px; display:grid; place-items:center; background:#000; border-radius:var(--radius) var(--radius) 0 0; overflow:hidden; }
.planet-preview img { display:block; width:100%; height:100%; object-fit:contain; }
.planet-preview:has(img) .planet-dot { display:none; }
.planet-scale-note { margin:0 0 10px; color:var(--text2); font-size:.8rem; }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html#astro">← Astronomie</a>
    <h1>Greutatea pe planete</h1>
    <p>Masa ta (constantă) → greutatea resimțită pe fiecare corp ceresc</p>
  </div>

  <div class="field-card">
    <span class="field-name">Masa ta pe Pământ</span>
    <input class="input-calc" id="in-mass" type="number" min="0" step="any" value="70"
           style="--input-color:var(--accent);font-size:1.1rem" oninput="compute()">
    <span style="font-family:var(--font-mono);font-size:0.62rem;color:var(--text3)">kg</span>
  </div>

  <p class="planet-scale-note">Diametre ilustrate la scară comprimată.</p>
  <div class="planet-grid" id="planet-grid"></div>
</div>

<script src="three.min.js"></script>
<script src="planet-models.js"></script>
<script src="planet-textures-small.js"></script>
<script src="planet-previews.js"></script>
<script>
// g relativ la Pământ (g_Pământ = 9.807 m/s²) — surse: NASA planetary fact sheets
const BODIES = [
  { name: 'Mercur', key: 'mercury', g: 0.378, color: '#a8a090' },
  { name: 'Venus', key: 'venus', g: 0.907, color: '#e0c080' },
  { name: 'Pământ', key: 'earth', g: 1.000, color: '#4090e0', isEarth: true },
  { name: 'Lună', key: 'moon', g: 0.166, color: '#c0c0c0' },
  { name: 'Marte', key: 'mars', g: 0.377, color: '#e07050' },
  { name: 'Jupiter', key: 'jupiter', g: 2.528, color: '#e0b080' },
  { name: 'Saturn', key: 'saturn', g: 1.065, color: '#e8d0a0' },
  { name: 'Uranus', key: 'uranus', g: 0.886, color: '#a0e0e0' },
  { name: 'Neptun', key: 'neptune', g: 1.137, color: '#6080e0' },
  { name: 'Pluto', key: 'pluto', g: 0.063, color: '#c0a080' },
  { name: 'Soare (suprafață)', key: 'sun', g: 27.94, color: '#f0c040' },
];

function trim(n) {
  return parseFloat(n.toPrecision(5)).toString();
}

function compute() {
  const massKg = parseFloat(document.getElementById('in-mass').value);
  const grid = document.getElementById('planet-grid');

  if (isNaN(massKg) || massKg <= 0) {
    grid.innerHTML = '<div style="font-family:var(--font-mono);font-size:0.8rem;color:var(--text3)">Introdu o masă validă</div>';
    return;
  }

  const maxWeight = Math.max(...BODIES.map(b => massKg * b.g));

  grid.innerHTML = BODIES.map(b => {
    const weight = massKg * b.g;
    const pct = (weight / maxWeight) * 100;
    return `
      <div class="planet-card ${b.isEarth ? 'earth' : ''}">
        <div class="planet-preview" data-planet="${b.key}">
          <span class="planet-dot" style="background:${b.color}"></span>
        </div>
        <div class="planet-header">
          <span class="planet-name">${b.name}</span>
        </div>
        <div class="planet-weight">${trim(weight)} kgf</div>
        <div class="planet-g">g = ${b.g}× Pământ</div>
        <div class="planet-bar-bg"><div class="planet-bar-fill" style="width:${pct}%;background:${b.color}"></div></div>
      </div>
    `;
  }).join('');
  paintPlanetPreviews(grid);
}

compute();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Greutatea pe planete</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
