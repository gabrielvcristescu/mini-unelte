<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #60a0f0;
  --accent-dim: rgba(96,160,240,0.10);
  --accent-border: rgba(96,160,240,0.28);
}

.mode-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); align-items: center; flex-wrap: wrap; }
.mode-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.mode-btn:hover { border-color: var(--accent-border); }
.indent-select { margin-left: auto; }

.big-textarea {
  width: 100%;
  min-height: 220px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--text);
  outline: none;
  resize: vertical;
  line-height: 1.6;
  tab-size: 2;
}
.big-textarea:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-dim); }
.big-textarea.error { border-color: #f06060; }

.area-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.area-name { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.area-actions { display: flex; gap: 6px; }
.mini-btn {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.mini-btn:hover { border-color: var(--accent-border); color: var(--accent); }

.status-bar {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: var(--content-gap);
}
.status-bar.valid { background: rgba(74,240,176,0.08); border: 1px solid rgba(74,240,176,0.2); color: #4af0b0; }
.status-bar.invalid { background: rgba(240,96,96,0.08); border: 1px solid rgba(240,96,96,0.2); color: #f06060; }
.status-bar.empty { background: var(--bg2); border: 1px solid var(--border); color: var(--text3); }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: var(--content-gap); }
@media (max-width: 500px) { .stats-row { grid-template-columns: 1fr; } }
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.stat-val { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 600; color: var(--accent); }
.stat-key { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>JSON Formatter</h1>
    <p>Validare, indentare, minificare — local, fără upload</p>
  </div>

  <div class="mode-row">
    <button class="mode-btn" onclick="formatJSON()">Formatează (indentat)</button>
    <button class="mode-btn" onclick="minifyJSON()">Minifică</button>
    <button class="mode-btn" onclick="sortKeys()">Sortează chei</button>
    <select class="unit-select indent-select" id="indent-select" onchange="formatJSON()">
      <option value="2">2 spații</option>
      <option value="4">4 spații</option>
      <option value="tab">Tab</option>
    </select>
  </div>

  <div class="status-bar empty" id="status-bar">Introdu JSON mai jos</div>

  <div style="margin-bottom:var(--content-gap)">
    <div class="area-label">
      <span class="area-name">JSON</span>
      <div class="area-actions">
        <button class="mini-btn" onclick="pasteInto()">Lipește</button>
        <button class="mini-btn" onclick="copyOutput()">Copiază</button>
        <button class="mini-btn" onclick="clearInput()">Șterge</button>
      </div>
    </div>
    <textarea class="big-textarea" id="json-area" placeholder='{"exemplu": "valoare", "numar": 42, "lista": [1,2,3]}' oninput="validate()" spellcheck="false"></textarea>
  </div>

  <div class="stats-row" id="stats-row" style="display:none">
    <div class="stat-card"><div class="stat-val" id="stat-keys">—</div><div class="stat-key">chei totale</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-depth">—</div><div class="stat-key">adâncime</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-size">—</div><div class="stat-key">dimensiune</div></div>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
function getIndent() {
  const val = document.getElementById('indent-select').value;
  return val === 'tab' ? '\t' : parseInt(val);
}

function countKeys(obj) {
  if (obj === null || typeof obj !== 'object') return 0;
  let count = Array.isArray(obj) ? 0 : Object.keys(obj).length;
  const values = Array.isArray(obj) ? obj : Object.values(obj);
  values.forEach(v => { if (typeof v === 'object' && v !== null) count += countKeys(v); });
  return count;
}

function maxDepth(obj, current = 1) {
  if (obj === null || typeof obj !== 'object') return current - 1;
  const values = Array.isArray(obj) ? obj : Object.values(obj);
  if (values.length === 0) return current;
  return Math.max(...values.map(v => (typeof v === 'object' && v !== null) ? maxDepth(v, current + 1) : current));
}

function validate() {
  const text = document.getElementById('json-area').value.trim();
  const statusBar = document.getElementById('status-bar');
  const statsRow = document.getElementById('stats-row');
  const textarea = document.getElementById('json-area');

  textarea.classList.remove('error');

  if (!text) {
    statusBar.className = 'status-bar empty';
    statusBar.textContent = 'Introdu JSON mai jos';
    statsRow.style.display = 'none';
    return null;
  }

  try {
    const parsed = JSON.parse(text);
    statusBar.className = 'status-bar valid';
    statusBar.textContent = '✓ JSON valid';

    const keys = countKeys(parsed);
    const depth = maxDepth(parsed);
    const bytes = new TextEncoder().encode(text).length;

    document.getElementById('stat-keys').textContent = keys;
    document.getElementById('stat-depth').textContent = depth;
    document.getElementById('stat-size').textContent = bytes < 1024 ? bytes+' B' : (bytes/1024).toFixed(1)+' KB';
    statsRow.style.display = 'grid';

    return parsed;
  } catch (err) {
    textarea.classList.add('error');
    statusBar.className = 'status-bar invalid';
    statusBar.textContent = '✕ JSON invalid — ' + err.message;
    statsRow.style.display = 'none';
    return undefined;
  }
}

function formatJSON() {
  const parsed = validate();
  if (parsed === null || parsed === undefined) return;
  document.getElementById('json-area').value = JSON.stringify(parsed, null, getIndent());
  validate();
}

function minifyJSON() {
  const parsed = validate();
  if (parsed === null || parsed === undefined) return;
  document.getElementById('json-area').value = JSON.stringify(parsed);
  validate();
}

function sortKeysDeep(obj) {
  if (Array.isArray(obj)) return obj.map(sortKeysDeep);
  if (obj !== null && typeof obj === 'object') {
    const sorted = {};
    Object.keys(obj).sort().forEach(k => { sorted[k] = sortKeysDeep(obj[k]); });
    return sorted;
  }
  return obj;
}

function sortKeys() {
  const parsed = validate();
  if (parsed === null || parsed === undefined) return;
  const sorted = sortKeysDeep(parsed);
  document.getElementById('json-area').value = JSON.stringify(sorted, null, getIndent());
  validate();
}

function clearInput() {
  document.getElementById('json-area').value = '';
  validate();
}

function pasteInto() {
  navigator.clipboard.readText().then(text => {
    document.getElementById('json-area').value = text;
    validate();
  }).catch(() => showToast('Nu s-a putut accesa clipboard-ul'));
}

function copyOutput() {
  const text = document.getElementById('json-area').value;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => showToast('Copiat!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

validate();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>JSON formatter</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
