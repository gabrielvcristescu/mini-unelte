<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Cost Curent Electric — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #70d0f0;
  --accent-dim: rgba(112,208,240,0.10);
  --accent-border: rgba(112,208,240,0.28);
}

.fields-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--content-gap);
}
@media (max-width: 600px) { .fields-grid { grid-template-columns: 1fr; } }

.field-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.field-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.field-name { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text2); font-weight: 500; }
.field-unit {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--text3);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
}

/* ── Result cards row ── */
.result-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
@media (max-width: 700px) { .result-row { grid-template-columns: 1fr 1fr; } }
.result-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 12px;
  text-align: center;
}
.result-card.highlight { border-color: var(--accent-border); background: var(--accent-dim); }
.result-val {
  font-family: var(--font-mono);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--text);
}
.result-card.highlight .result-val { color: var(--accent); }
.result-key {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 3px;
}

/* ── Device list ── */
.device-list { display: flex; flex-direction: column; gap: 8px; }
.device-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  flex-wrap: wrap;
}
.device-row input.device-name {
  flex: 1.6;
  min-width: 120px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text);
  outline: none;
}
.device-row input.device-name:focus { border-color: var(--accent-border); }
.device-mini {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
  min-width: 90px;
}
.device-mini input {
  width: 100%;
  min-width: 0;
}
.device-mini-unit { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text3); flex-shrink: 0; }
.device-cost {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--accent);
  min-width: 60px;
  text-align: right;
  flex-shrink: 0;
}
.device-remove {
  background: none; border: none; cursor: pointer;
  color: var(--text3); padding: 4px 8px; border-radius: 5px;
  font-family: var(--font-mono); font-size: 0.85rem;
  transition: color 0.12s, background 0.12s; flex-shrink: 0;
}
.device-remove:hover { color: #f06060; background: var(--bg3); }
.device-remove:disabled { opacity: 0.25; cursor: default; }

.add-row-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px dashed var(--border2);
  background: none;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
  text-align: center;
}
.add-row-btn:hover { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }

.total-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  background: var(--accent-dim);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius);
  margin-top: 10px;
}
.total-label { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text2); }
.total-val { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; color: var(--accent); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Calculator cost curent electric</h1>
    <p>Putere, ore de funcționare, preț kWh → cost zilnic/lunar/anual</p>
  </div>

  <!-- Preț kWh -->
  <div class="fields-grid" style="margin-bottom:var(--content-gap)">
    <div class="field-card">
      <div class="field-top"><span class="field-name">Preț energie</span><span class="field-unit">Lei/kWh</span></div>
      <input class="input-calc" id="in-price" type="number" min="0" step="any" value="1.4"
             style="--input-color:var(--accent);font-size:1.05rem" oninput="compute()">
    </div>
  </div>

  <!-- Dispozitive -->
  <div class="card" style="margin-bottom:var(--content-gap)">
    <div class="field-name" style="margin-bottom:10px">Dispozitive</div>
    <div class="device-header" id="device-header">
      <span class="dh-name">Nume dispozitiv</span>
      <span class="dh-mini">Putere (W)</span>
      <span class="dh-mini">Ore/zi</span>
      <span class="dh-cost">Cost/zi</span>
      <span class="dh-spacer"></span>
    </div>
    <div class="device-list" id="device-list"></div>
    <button class="add-row-btn" style="margin-top:8px" onclick="addDevice()">+ adaugă dispozitiv</button>
    <div class="total-bar">
      <span class="total-label">Total lunar estimat</span>
      <span class="total-val" id="total-monthly">—</span>
    </div>
  </div>

  <!-- Rezultat detaliat -->
  <style>
    .device-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px 6px;
      flex-wrap: wrap;
    }
    .dh-name { flex: 1.6; min-width: 120px; font-family: var(--font-mono); font-size: 0.6rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
    .dh-mini { flex: 1; min-width: 90px; font-family: var(--font-mono); font-size: 0.6rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
    .dh-cost { min-width: 60px; text-align: right; font-family: var(--font-mono); font-size: 0.6rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
    .dh-spacer { width: 28px; flex-shrink: 0; }
    @media (max-width: 560px) { .device-header { display: none; } }
  </style>
  <div class="result-row">
    <div class="result-card"><div class="result-val" id="res-power">—</div><div class="result-key">putere totală</div></div>
    <div class="result-card highlight"><div class="result-val" id="res-daily">—</div><div class="result-key">cost / zi</div></div>
    <div class="result-card highlight"><div class="result-val" id="res-monthly">—</div><div class="result-key">cost / lună</div></div>
    <div class="result-card"><div class="result-val" id="res-yearly">—</div><div class="result-key">cost / an</div></div>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
let devices = [
  { name: 'Frigider', watts: 150, hours: 24 },
  { name: 'Radxa Dragon Q6A', watts: 8, hours: 10 },
  { name: 'Router/modem', watts: 10, hours: 24 },
  { name: 'Bec LED', watts: 9, hours: 5 },
];

function trim(n) { return parseFloat(n.toPrecision(4)).toString(); }
function fmtRon(n) { return trim(n) + ' Lei'; }

function renderDeviceList() {
  const list = document.getElementById('device-list');
  list.innerHTML = '';
  devices.forEach((d, i) => {
    const row = document.createElement('div');
    row.className = 'device-row';
    row.innerHTML = `
      <input class="device-name" type="text" value="${d.name}" placeholder="Nume dispozitiv" data-idx="${i}">
      <div class="device-mini">
        <input class="input-calc dev-watts" type="number" min="0" step="any" value="${d.watts}"
               style="--input-color:var(--accent);font-size:0.85rem;padding:5px 8px" title="Putere (W)">
        <span class="device-mini-unit">W</span>
      </div>
      <div class="device-mini">
        <input class="input-calc dev-hours" type="number" min="0" max="24" step="any" value="${d.hours}"
               style="--input-color:var(--accent);font-size:0.85rem;padding:5px 8px" title="Ore de funcționare pe zi">
        <span class="device-mini-unit">h/zi</span>
      </div>
      <span class="device-cost" id="dev-cost-${i}">—</span>
      <button class="device-remove" ${devices.length <= 1 ? 'disabled' : ''} title="Șterge">✕</button>
    `;
    const nameInput = row.querySelector('.device-name');
    const wattsInput = row.querySelector('.dev-watts');
    const hoursInput = row.querySelector('.dev-hours');

    nameInput.addEventListener('input', () => { devices[i].name = nameInput.value; });
    wattsInput.addEventListener('input', () => {
      devices[i].watts = parseFloat(wattsInput.value) || 0;
      compute();
    });
    hoursInput.addEventListener('input', () => {
      devices[i].hours = parseFloat(hoursInput.value) || 0;
      compute();
    });
    row.querySelector('.device-remove').addEventListener('click', () => {
      if (devices.length <= 1) return;
      devices.splice(i, 1);
      render();
    });
    list.appendChild(row);
  });
}

function addDevice() {
  devices.push({ name: 'Dispozitiv nou', watts: 10, hours: 8 });
  render();
}

function compute() {
  const price = parseFloat(document.getElementById('in-price').value);

  if (isNaN(price) || price <= 0) {
    document.getElementById('total-monthly').textContent = '—';
    ['res-power','res-daily','res-monthly','res-yearly'].forEach(id => document.getElementById(id).textContent = '—');
    return;
  }

  let totalWatts = 0;
  let totalDailyKwh = 0;

  devices.forEach((d, i) => {
    const dailyKwh = (d.watts * d.hours) / 1000;
    const dailyCost = dailyKwh * price;
    totalWatts += d.watts;
    totalDailyKwh += dailyKwh;

    const costEl = document.getElementById('dev-cost-' + i);
    if (costEl) costEl.textContent = fmtRon(dailyCost) + '/zi';
  });

  const dailyCost = totalDailyKwh * price;
  const monthlyCost = dailyCost * 30;
  const yearlyCost = dailyCost * 365;

  document.getElementById('res-power').textContent = trim(totalWatts) + ' W';
  document.getElementById('res-daily').textContent = fmtRon(dailyCost);
  document.getElementById('res-monthly').textContent = fmtRon(monthlyCost);
  document.getElementById('res-yearly').textContent = fmtRon(yearlyCost);
  document.getElementById('total-monthly').textContent = fmtRon(monthlyCost);
}

function render() {
  renderDeviceList();
  compute();
}

document.getElementById('in-price').addEventListener('input', compute);

render();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Calculator cost curent</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
