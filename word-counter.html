<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numărător Cuvinte — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #60a0f0;
  --accent-dim: rgba(96,160,240,0.10);
  --accent-border: rgba(96,160,240,0.28);
}

.big-textarea {
  width: 100%;
  min-height: 220px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.88rem;
  color: var(--text);
  outline: none;
  resize: vertical;
  line-height: 1.6;
  margin-bottom: var(--content-gap);
}
.big-textarea:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-dim); }

.area-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.area-name { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.mini-btn {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.mini-btn:hover { border-color: var(--accent-border); color: var(--accent); }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: var(--content-gap);
}
@media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 10px;
  text-align: center;
}
.stat-val { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 700; color: var(--accent); }
.stat-key { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }

.reading-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: var(--content-gap); }
@media (max-width: 500px) { .reading-row { grid-template-columns: 1fr; } }
.reading-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.reading-icon { font-size: 1.3rem; }
.reading-val { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 600; color: var(--text); }
.reading-key { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text3); }

/* ── Top words ── */
.top-words-list { display: flex; flex-direction: column; gap: 4px; }
.top-word-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 8px;
  border-radius: 5px;
}
.top-word-row:hover { background: var(--bg3); }
.top-word-text { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text2); width: 100px; flex-shrink: 0; }
.top-word-bar-bg { flex: 1; height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.top-word-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
.top-word-count { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text3); width: 30px; text-align: right; flex-shrink: 0; }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Numărător cuvinte</h1>
    <p>Cuvinte, caractere, propoziții, timp estimat de citire</p>
  </div>

  <div class="area-label">
    <span class="area-name">Text</span>
    <div style="display:flex;gap:6px">
      <button class="mini-btn" onclick="pasteInto()">Lipește</button>
      <button class="mini-btn" onclick="clearInput()">Șterge</button>
    </div>
  </div>
  <textarea class="big-textarea" id="input-area" placeholder="Scrie sau lipește text aici..." oninput="compute()"></textarea>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="stat-words">0</div><div class="stat-key">cuvinte</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-chars">0</div><div class="stat-key">caractere</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-charsnospace">0</div><div class="stat-key">fără spații</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-sentences">0</div><div class="stat-key">propoziții</div></div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="stat-paragraphs">0</div><div class="stat-key">paragrafe</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-lines">0</div><div class="stat-key">linii</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-unique">0</div><div class="stat-key">cuvinte unice</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-avglen">0</div><div class="stat-key">lit./cuvânt (med.)</div></div>
  </div>

  <div class="reading-row">
    <div class="reading-card">
      <span class="reading-icon">📖</span>
      <div>
        <div class="reading-val" id="reading-time">0 min</div>
        <div class="reading-key">timp citire (200 cuv/min)</div>
      </div>
    </div>
    <div class="reading-card">
      <span class="reading-icon">🎤</span>
      <div>
        <div class="reading-val" id="speaking-time">0 min</div>
        <div class="reading-key">timp vorbire (130 cuv/min)</div>
      </div>
    </div>
  </div>

  <!-- Top cuvinte -->
  <div class="card">
    <div class="field-label" style="margin-bottom:10px">Cele mai frecvente cuvinte</div>
    <div class="top-words-list" id="top-words-list"></div>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
const STOP_WORDS = new Set(['și','sau','dar','de','la','în','cu','pe','un','o','ce','că','se','nu','este','sunt','a','al','ale','ai','din','pentru','mai','ca','să','au','are','fi','va','fost','avea','acest','această','acesta','aceasta','the','and','or','a','an','to','of','in','on','at','is','are']);

function compute() {
  const text = document.getElementById('input-area').value;

  if (!text) {
    ['stat-words','stat-chars','stat-charsnospace','stat-sentences','stat-paragraphs','stat-lines','stat-unique','stat-avglen'].forEach(id => document.getElementById(id).textContent = '0');
    document.getElementById('reading-time').textContent = '0 min';
    document.getElementById('speaking-time').textContent = '0 min';
    document.getElementById('top-words-list').innerHTML = '';
    return;
  }

  const words = text.match(/[\p{L}\p{N}'-]+/gu) || [];
  const wordCount = words.length;
  const charCount = [...text].length;
  const charNoSpace = [...text.replace(/\s/g, '')].length;
  const sentences = (text.match(/[.!?]+/g) || []).length || (text.trim() ? 1 : 0);
  const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim() !== '').length;
  const lines = text.split('\n').length;

  const wordsLower = words.map(w => w.toLowerCase());
  const uniqueWords = new Set(wordsLower).size;
  const avgWordLen = wordCount > 0 ? (words.reduce((s,w) => s+w.length, 0) / wordCount) : 0;

  document.getElementById('stat-words').textContent = wordCount.toLocaleString('ro-RO');
  document.getElementById('stat-chars').textContent = charCount.toLocaleString('ro-RO');
  document.getElementById('stat-charsnospace').textContent = charNoSpace.toLocaleString('ro-RO');
  document.getElementById('stat-sentences').textContent = sentences.toLocaleString('ro-RO');
  document.getElementById('stat-paragraphs').textContent = paragraphs.toLocaleString('ro-RO');
  document.getElementById('stat-lines').textContent = lines.toLocaleString('ro-RO');
  document.getElementById('stat-unique').textContent = uniqueWords.toLocaleString('ro-RO');
  document.getElementById('stat-avglen').textContent = avgWordLen.toFixed(1);

  const readMin = wordCount / 200;
  const speakMin = wordCount / 130;
  document.getElementById('reading-time').textContent = fmtMinutes(readMin);
  document.getElementById('speaking-time').textContent = fmtMinutes(speakMin);

  renderTopWords(wordsLower);
}

function fmtMinutes(min) {
  if (min < 1) return Math.max(1, Math.round(min * 60)) + ' sec';
  const whole = Math.floor(min);
  const sec = Math.round((min - whole) * 60);
  return sec > 0 ? `${whole} min ${sec}s` : `${whole} min`;
}

function renderTopWords(wordsLower) {
  const freq = {};
  wordsLower.forEach(w => {
    if (STOP_WORDS.has(w) || w.length < 2) return;
    freq[w] = (freq[w] || 0) + 1;
  });

  const sorted = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0, 10);
  const maxCount = sorted.length > 0 ? sorted[0][1] : 1;

  const list = document.getElementById('top-words-list');
  if (sorted.length === 0) {
    list.innerHTML = '<div class="text3" style="font-family:var(--font-mono);font-size:0.75rem">Introdu text mai mult pentru analiză</div>';
    return;
  }

  list.innerHTML = sorted.map(([word, count]) => `
    <div class="top-word-row">
      <span class="top-word-text">${word}</span>
      <div class="top-word-bar-bg"><div class="top-word-bar-fill" style="width:${(count/maxCount)*100}%"></div></div>
      <span class="top-word-count">${count}</span>
    </div>
  `).join('');
}

function clearInput() {
  document.getElementById('input-area').value = '';
  compute();
}

function pasteInto() {
  navigator.clipboard.readText().then(text => {
    document.getElementById('input-area').value = text;
    compute();
  }).catch(() => showToast('Nu s-a putut accesa clipboard-ul'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

compute();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Numărător cuvinte</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
