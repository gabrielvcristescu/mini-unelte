<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Tabel Periodic — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #f0a040;
  --accent-dim: rgba(240,160,64,0.10);
  --accent-border: rgba(240,160,64,0.28);
}

.mode-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); flex-wrap: wrap; }
.mode-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.mode-btn.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }

.score-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--content-gap);
  font-family: var(--font-mono);
  font-size: 0.78rem;
}
.score-item { display: flex; gap: 6px; align-items: center; }
.score-label { color: var(--text3); }
.score-val { color: var(--accent); font-weight: 700; }

.question-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 34px 24px;
  text-align: center;
  margin-bottom: var(--content-gap);
}
.question-label { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }
.question-symbol { font-family: var(--font-mono); font-size: 3.2rem; font-weight: 700; color: var(--text); }
.question-number { font-family: var(--font-mono); font-size: 3.2rem; font-weight: 700; color: var(--accent); }

.options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: var(--content-gap); }
@media (max-width: 500px) { .options-grid { grid-template-columns: 1fr; } }
.option-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
}
.option-btn:hover:not(:disabled) { border-color: var(--accent-border); background: var(--accent-dim); }
.option-btn:disabled { cursor: default; }
.option-btn.correct { border-color: #4af0b0; background: rgba(74,240,176,0.12); color: #4af0b0; }
.option-btn.wrong { border-color: #f06060; background: rgba(240,96,96,0.12); color: #f06060; }

.final-card {
  background: var(--bg2);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius);
  padding: 30px 24px;
  text-align: center;
  display: none;
}
.final-card.show { display: block; }
.final-score { font-family: var(--font-mono); font-size: 2.2rem; font-weight: 700; color: var(--accent); }
.final-label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text3); margin-top: 6px; }
.restart-btn {
  margin-top: 16px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  cursor: pointer;
}
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Quiz tabel periodic</h1>
    <p>Simbol → element, sau număr atomic → element</p>
  </div>

  <div class="mode-row">
    <button class="mode-btn active" id="btn-symbol" onclick="setMode('symbol')">Simbol → Element</button>
    <button class="mode-btn" id="btn-number" onclick="setMode('number')">Nr. atomic → Element</button>
  </div>

  <div class="score-bar">
    <div class="score-item"><span class="score-label">Întrebare</span> <span class="score-val" id="q-num">1</span><span class="score-label">/10</span></div>
    <div class="score-item"><span class="score-label">Scor</span> <span class="score-val" id="score-val">0</span></div>
  </div>

  <div id="quiz-area">
    <div class="question-card">
      <div class="question-label" id="question-label">Ce element are simbolul...</div>
      <div class="question-symbol" id="question-main">—</div>
    </div>

    <div class="options-grid" id="options-grid"></div>
  </div>

  <div class="final-card" id="final-card">
    <div class="final-score" id="final-score">—</div>
    <div class="final-label">răspunsuri corecte din 10</div>
    <button class="restart-btn" onclick="startQuiz()">Joacă din nou</button>
  </div>
</div>

<script>
// Primele 36 elemente (H-Kr) — cele mai comune, potrivite pentru quiz
const ELEMENTS = [
  [1,'H','Hidrogen'],[2,'He','Heliu'],[3,'Li','Litiu'],[4,'Be','Beriliu'],[5,'B','Bor'],
  [6,'C','Carbon'],[7,'N','Azot'],[8,'O','Oxigen'],[9,'F','Fluor'],[10,'Ne','Neon'],
  [11,'Na','Sodiu'],[12,'Mg','Magneziu'],[13,'Al','Aluminiu'],[14,'Si','Siliciu'],[15,'P','Fosfor'],
  [16,'S','Sulf'],[17,'Cl','Clor'],[18,'Ar','Argon'],[19,'K','Potasiu'],[20,'Ca','Calciu'],
  [21,'Sc','Scandiu'],[22,'Ti','Titan'],[23,'V','Vanadiu'],[24,'Cr','Crom'],[25,'Mn','Mangan'],
  [26,'Fe','Fier'],[27,'Co','Cobalt'],[28,'Ni','Nichel'],[29,'Cu','Cupru'],[30,'Zn','Zinc'],
  [31,'Ga','Galiu'],[32,'Ge','Germaniu'],[33,'As','Arsen'],[34,'Se','Seleniu'],[35,'Br','Brom'],[36,'Kr','Kripton'],
];

let mode = 'symbol';
let quizOrder = [];
let currentQ = 0;
let score = 0;
let answered = false;
let autoAdvanceTimer = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-symbol').classList.toggle('active', m==='symbol');
  document.getElementById('btn-number').classList.toggle('active', m==='number');
  startQuiz();
}

function startQuiz() {
  clearTimeout(autoAdvanceTimer);
  quizOrder = shuffle(ELEMENTS).slice(0, 10);
  currentQ = 0;
  score = 0;
  document.getElementById('final-card').classList.remove('show');
  document.getElementById('quiz-area').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const [num, sym, name] = quizOrder[currentQ];
  document.getElementById('q-num').textContent = currentQ+1;
  document.getElementById('score-val').textContent = score;

  const mainEl = document.getElementById('question-main');
  const labelEl = document.getElementById('question-label');

  if (mode === 'symbol') {
    labelEl.textContent = 'Ce element are simbolul...';
    mainEl.textContent = sym;
    mainEl.className = 'question-symbol';
  } else {
    labelEl.textContent = 'Ce element are numărul atomic...';
    mainEl.textContent = num;
    mainEl.className = 'question-number';
  }

  const correct = name;
  const wrongPool = ELEMENTS.filter(e => e[2] !== name);
  const wrongs = shuffle(wrongPool).slice(0,3).map(e => e[2]);
  const options = shuffle([correct, ...wrongs]);

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(btn, opt, correct);
    grid.appendChild(btn);
  });
}

function selectAnswer(btn, selected, correct) {
  if (answered) return;
  answered = true;

  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });

  if (selected === correct) score++;
  document.getElementById('score-val').textContent = score;

  clearTimeout(autoAdvanceTimer);
  autoAdvanceTimer = setTimeout(() => { if (answered) nextQuestion(); }, 1400);
}

function nextQuestion() {
  clearTimeout(autoAdvanceTimer);
  currentQ++;
  if (currentQ >= 10) showFinal(); else renderQuestion();
}

function showFinal() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('final-score').textContent = score + '/10';
  document.getElementById('final-card').classList.add('show');
}

startQuiz();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Quiz tabel periodic</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
