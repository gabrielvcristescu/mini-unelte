<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spânzurătoarea — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #f0a040;
  --accent-dim: rgba(240,160,64,0.10);
  --accent-border: rgba(240,160,64,0.28);
}

.stats-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--content-gap);
  font-family: var(--font-mono);
  font-size: 0.78rem;
}
.stat-item { display: flex; gap: 6px; align-items: center; }
.stat-label { color: var(--text3); }
.stat-val { color: var(--accent); font-weight: 700; }

.hangman-wrap { display: flex; justify-content: center; padding: 1rem 0; }
.hangman-svg .part { stroke: var(--text2); stroke-width: 3; stroke-linecap: round; fill: none; }
.hangman-svg .base { stroke: var(--text3); }

.word-display {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: 1.8rem;
  font-weight: 700;
  margin: var(--content-gap) 0;
  letter-spacing: 4px;
}
.word-letter { min-width: 24px; text-align: center; border-bottom: 3px solid var(--border2); }
.word-letter.revealed { border-color: var(--accent); color: var(--accent); }
.word-letter.space { border: none; min-width: 16px; }

.keyboard {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
  gap: 5px;
  margin-bottom: var(--content-gap);
}
.key-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 0;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.12s;
}
.key-btn:hover:not(:disabled) { border-color: var(--accent-border); background: var(--accent-dim); }
.key-btn:disabled { cursor: default; opacity: 0.4; }
.key-btn.correct { background: rgba(74,240,176,0.15); border-color: rgba(74,240,176,0.4); color: #4af0b0; }
.key-btn.wrong { background: rgba(240,96,96,0.15); border-color: rgba(240,96,96,0.4); color: #f06060; }

.status-msg {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: var(--content-gap);
  min-height: 1.5em;
}
.status-msg.win { color: #4af0b0; }
.status-msg.loss { color: #f06060; }

.restart-btn {
  display: block;
  margin: 0 auto;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
  padding: 10px 24px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  cursor: pointer;
}
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Spânzurătoarea</h1>
    <p>Ghicește cuvântul românesc, litera cu literă</p>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><span class="stat-label">Greșeli</span> <span class="stat-val" id="stat-wrong">0</span><span class="stat-label">/6</span></div>
    <div class="stat-item"><span class="stat-label">Categorie</span> <span class="stat-val" id="stat-category">—</span></div>
  </div>

  <div class="hangman-wrap">
    <svg class="hangman-svg" width="180" height="180" viewBox="0 0 180 180" id="hangman-svg">
      <line class="part base" x1="20" y1="170" x2="120" y2="170"/>
      <line class="part base" x1="50" y1="170" x2="50" y2="20"/>
      <line class="part base" x1="50" y1="20" x2="130" y2="20"/>
      <line class="part base" x1="130" y1="20" x2="130" y2="40"/>
      <circle class="part" id="hm-head" cx="130" cy="55" r="15" style="display:none"/>
      <line class="part" id="hm-body" x1="130" y1="70" x2="130" y2="110" style="display:none"/>
      <line class="part" id="hm-arm-l" x1="130" y1="80" x2="112" y2="100" style="display:none"/>
      <line class="part" id="hm-arm-r" x1="130" y1="80" x2="148" y2="100" style="display:none"/>
      <line class="part" id="hm-leg-l" x1="130" y1="110" x2="112" y2="140" style="display:none"/>
      <line class="part" id="hm-leg-r" x1="130" y1="110" x2="148" y2="140" style="display:none"/>
    </svg>
  </div>

  <div class="word-display" id="word-display"></div>

  <div class="status-msg" id="status-msg"></div>

  <div class="keyboard" id="keyboard"></div>

  <button class="restart-btn" id="restart-btn" onclick="startGame()" style="display:none">Joacă din nou</button>
</div>

<script>
const WORDS = [
  { word: 'CALCULATOR', category: 'Tehnologie' },
  { word: 'MUNTE', category: 'Natură' },
  { word: 'BUCURESTI', category: 'Orașe' },
  { word: 'ALBASTRU', category: 'Culori' },
  { word: 'FLUTURE', category: 'Animale' },
  { word: 'PRIETENIE', category: 'Sentimente' },
  { word: 'BIBLIOTECA', category: 'Locuri' },
  { word: 'CIOCOLATA', category: 'Mâncare' },
  { word: 'CALATORIE', category: 'Concepte' },
  { word: 'FEREASTRA', category: 'Casă' },
  { word: 'PRIMAVARA', category: 'Anotimpuri' },
  { word: 'SANATATE', category: 'Concepte' },
  { word: 'ORCHESTRA', category: 'Muzică' },
  { word: 'GRADINA', category: 'Natură' },
  { word: 'ALFABET', category: 'Limbă' },
  { word: 'PADURE', category: 'Natură' },
  { word: 'FOTOGRAFIE', category: 'Artă' },
  { word: 'INTELIGENT', category: 'Adjective' },
  { word: 'TELEFON', category: 'Tehnologie' },
  { word: 'MAGAZIN', category: 'Locuri' },
];

const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const HANGMAN_PARTS = ['hm-head','hm-body','hm-arm-l','hm-arm-r','hm-leg-l','hm-leg-r'];

let currentWord = '';
let guessedLetters = new Set();
let wrongCount = 0;
let gameOver = false;

function startGame() {
  const pick = WORDS[Math.floor(Math.random()*WORDS.length)];
  currentWord = pick.word;
  document.getElementById('stat-category').textContent = pick.category;
  guessedLetters = new Set();
  wrongCount = 0;
  gameOver = false;

  document.getElementById('stat-wrong').textContent = '0';
  document.getElementById('status-msg').textContent = '';
  document.getElementById('status-msg').className = 'status-msg';
  document.getElementById('restart-btn').style.display = 'none';

  HANGMAN_PARTS.forEach(id => document.getElementById(id).style.display = 'none');

  renderWord();
  renderKeyboard();
}

function renderWord() {
  const display = document.getElementById('word-display');
  display.innerHTML = [...currentWord].map(ch => {
    if (ch === ' ') return '<div class="word-letter space"></div>';
    const revealed = guessedLetters.has(ch) || gameOver;
    return `<div class="word-letter ${revealed?'revealed':''}">${revealed ? ch : ''}</div>`;
  }).join('');
}

function renderKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  ALPHABET.forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'key-btn';
    btn.textContent = letter;
    btn.onclick = () => guessLetter(letter);
    kb.appendChild(btn);
  });
}

function guessLetter(letter) {
  if (gameOver || guessedLetters.has(letter)) return;
  guessedLetters.add(letter);

  const btns = document.querySelectorAll('.key-btn');
  const btn = [...btns].find(b => b.textContent === letter);
  btn.disabled = true;

  if (currentWord.includes(letter)) {
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    document.getElementById('stat-wrong').textContent = wrongCount;
    if (HANGMAN_PARTS[wrongCount-1]) {
      document.getElementById(HANGMAN_PARTS[wrongCount-1]).style.display = 'block';
    }
  }

  renderWord();
  checkGameState();
}

function checkGameState() {
  const won = [...currentWord].every(ch => ch === ' ' || guessedLetters.has(ch));
  if (won) {
    gameOver = true;
    const msg = document.getElementById('status-msg');
    msg.textContent = '🎉 Ai câștigat!';
    msg.className = 'status-msg win';
    document.getElementById('restart-btn').style.display = 'block';
    disableKeyboard();
  } else if (wrongCount >= 6) {
    gameOver = true;
    const msg = document.getElementById('status-msg');
    msg.textContent = `Ai pierdut! Cuvântul era: ${currentWord}`;
    msg.className = 'status-msg loss';
    renderWord();
    document.getElementById('restart-btn').style.display = 'block';
    disableKeyboard();
  }
}

function disableKeyboard() {
  document.querySelectorAll('.key-btn').forEach(b => b.disabled = true);
}

startGame();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Spânzurătoarea</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
