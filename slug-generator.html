<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slug Generator — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #60a0f0;
  --accent-dim: rgba(96,160,240,0.10);
  --accent-border: rgba(96,160,240,0.28);
}

.field-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: var(--content-gap);
}
.field-name { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text2); font-weight: 500; margin-bottom: 8px; display: block; }

.options-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: var(--content-gap); }
.option-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text2);
  cursor: pointer;
}

.separator-select {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 4px 8px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 5px;
  color: var(--text2);
  outline: none;
  cursor: pointer;
}

.result-card {
  background: var(--bg2);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius);
  padding: 18px 20px;
  text-align: center;
  margin-bottom: var(--content-gap);
}
.result-slug {
  font-family: var(--font-mono);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--accent);
  word-break: break-all;
  margin-bottom: 10px;
}
.result-actions { display: flex; gap: 8px; justify-content: center; }
.result-btn {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.result-btn:hover { border-color: var(--accent-border); color: var(--accent); }

.url-preview {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text3);
  text-align: center;
  padding: 10px;
  background: var(--bg3);
  border-radius: var(--radius-sm);
  margin-bottom: var(--content-gap);
  word-break: break-all;
}
.url-preview .domain { color: var(--text2); }
.url-preview .slug-part { color: var(--accent); font-weight: 600; }

.example-list { display: flex; flex-direction: column; gap: 6px; }
.example-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 0.75rem;
}
.example-row:hover { background: var(--bg3); }
.example-from { color: var(--text2); }
.example-to { color: var(--accent); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Slug generator</h1>
    <p>Titlu articol → url-slug-prietenos</p>
  </div>

  <div class="field-card">
    <span class="field-name">Titlu / text original</span>
    <input class="input-calc" id="in-title" type="text" value="Cum să Creezi un Slug Prietenos pentru URL-uri?"
           style="--input-color:var(--accent);font-size:1rem" oninput="compute()">
  </div>

  <div class="options-row">
    <label class="option-item">
      Separator:
      <select class="separator-select" id="separator-select" onchange="compute()">
        <option value="-">cratimă (-)</option>
        <option value="_">underscore (_)</option>
      </select>
    </label>
    <label class="option-item">
      <input type="checkbox" id="lowercase-toggle" checked onchange="compute()">
      forțează minuscule
    </label>
    <label class="option-item">
      <input type="checkbox" id="maxlen-toggle" onchange="compute()">
      limitează la 60 caractere
    </label>
  </div>

  <div class="result-card">
    <div class="result-slug" id="result-slug">—</div>
    <div class="result-actions">
      <button class="result-btn" onclick="copySlug()">Copiază</button>
    </div>
  </div>

  <div class="url-preview" id="url-preview"></div>

  <div class="card">
    <div class="field-label" style="margin-bottom:10px">Exemple (click pentru a testa)</div>
    <div class="example-list" id="example-list"></div>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
const EXAMPLES = [
  'Cum să Creezi un Slug Prietenos pentru URL-uri?',
  'Rețete Tradiționale Românești: Sarmale și Mămăligă',
  'Top 10 Sfaturi pentru Dezvoltatori Web (2026)',
  'Mini Unelte: experimente interactive în browser',
];

function slugify(text, separator, forceLower, maxLen) {
  let s = text.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // elimină diacritice
  if (forceLower) s = s.toLocaleLowerCase('ro');
  s = s.replace(/[^\p{L}\p{N}]+/gu, separator); // orice non-alfanumeric -> separator
  s = s.replace(new RegExp(`\\${separator}{2,}`, 'g'), separator); // separatoare multiple -> unul singur
  s = s.replace(new RegExp(`^\\${separator}+|\\${separator}+$`, 'g'), ''); // trim separatoare la capete
  if (maxLen && s.length > 60) {
    s = s.slice(0, 60);
    // Evită tăierea la mijlocul unui cuvânt
    const lastSep = s.lastIndexOf(separator);
    if (lastSep > 40) s = s.slice(0, lastSep);
  }
  return s;
}

function compute() {
  const title = document.getElementById('in-title').value;
  const separator = document.getElementById('separator-select').value;
  const forceLower = document.getElementById('lowercase-toggle').checked;
  const maxLen = document.getElementById('maxlen-toggle').checked;

  if (!title) {
    document.getElementById('result-slug').textContent = '—';
    document.getElementById('url-preview').innerHTML = '';
    return;
  }

  const slug = slugify(title, separator, forceLower, maxLen);
  document.getElementById('result-slug').textContent = slug || '(gol)';

  document.getElementById('url-preview').innerHTML =
    `<span class="domain">exemplu.ro/articole/</span><span class="slug-part">${slug}</span>`;
}

function copySlug() {
  const slug = document.getElementById('result-slug').textContent;
  if (!slug || slug === '—') return;
  navigator.clipboard.writeText(slug).then(() => showToast('Copiat!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function buildExamples() {
  const list = document.getElementById('example-list');
  EXAMPLES.forEach(ex => {
    const slug = slugify(ex, '-', true, false);
    const row = document.createElement('div');
    row.className = 'example-row';
    row.innerHTML = `<span class="example-from">${ex}</span><span class="example-to">→ ${slug}</span>`;
    row.onclick = () => {
      document.getElementById('in-title').value = ex;
      compute();
    };
    list.appendChild(row);
  });
}

buildExamples();
compute();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Slug generator</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
