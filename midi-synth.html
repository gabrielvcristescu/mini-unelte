  :root {
    --cream: #f5f0e8;

  body {

    color: var(--text);
    min-height: 100vh;
    font-family: 'DM Mono', monospace;
    overflow-x: hidden;
  }

  .instrument {

    align-items: center;

  .top-panel {

    border: 2px solid #5a3520;
    border-bottom: none;
    border-radius: 12px 12px 0 0;

    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.5);

  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;

  .brand-name {

    font-size: 22px;
    color: var(--oak);
    letter-spacing: 3px;
    text-shadow: 0 1px 0 rgba(0,0,0,0.5);

  .brand-model {

    letter-spacing: 4px;
    color: #7a5a3a;
    text-transform: uppercase;

    align-items: center;

    align-items: center;

  .knob {
    width: 36px;
    height: 36px;
    background: radial-gradient(circle at 35% 35%, #5a4030, #1a0e08);

    border: 2px solid #4a3020;

    touch-action: none;
    user-select: none;

  .knob::after {
    content: '';

    top: 4px;
    left: 50%;

    height: 10px;
    background: var(--oak);
    border-radius: 2px;
    transform-origin: 50% 14px;

  .oct-display {

  .synth-page {

<script>
// ── Notes layout (2 octaves + 1) ───────────────────────────────
let baseOct = 4;
const WHITE_PATTERN = ['C','D','E','F','G','A','B'];
const BLACK_PATTERN = [
  { note:'C#', afterWhite:0 },
  { note:'D#', afterWhite:1 },
  { note:'F#', afterWhite:3 },
  { note:'G#', afterWhite:4 },
  { note:'A#', afterWhite:5 },
];

// 2 octaves of white keys
let whiteNotes = []; // { note, oct }
let blackNotes = []; // { note, oct, slotIndex }

function buildLayout() {
  whiteNotes = [];
  for (let o = baseOct; o <= baseOct + 1; o++) {
    for (const n of WHITE_PATTERN) whiteNotes.push({ note: n, oct: o });
  }
  whiteNotes.push({ note: 'C', oct: baseOct + 2 });

  blackNotes = [];
  for (let o = baseOct; o <= baseOct + 1; o++) {
    const offset = (o - baseOct) * 7;
    for (const bp of BLACK_PATTERN) {
      blackNotes.push({ note: bp.note, oct: o, slotIndex: offset + bp.afterWhite });
    }
  }
}

// ── Tone.js synth ──────────────────────────────────────────────
let synth = null;
let activeNotes = {};

const SYNTH_OPTS = {
  synth: () => new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'sine' }, envelope: { attack: 0.02, decay: 0.1, sustain: 0.5, release: 0.8 } }),
  am: () => new Tone.PolySynth(Tone.AMSynth, { envelope: { attack: 0.02, decay: 0.2, sustain: 0.6, release: 1.2 } }),
  fm: () => new Tone.PolySynth(Tone.FMSynth, { envelope: { attack: 0.02, decay: 0.1, sustain: 0.7, release: 1.0 }, modulationIndex: 3 }),
  membrane: () => new Tone.MembraneSynth(),
  metal: () => new Tone.MetalSynth({ envelope: { attack: 0.001, decay: 0.4, release: 0.2 } }),
  piano: () => new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'triangle' }, envelope: { attack: 0.005, decay: 0.3, sustain: 0.3, release: 1.5 } }),
};

let atkVal = 0.02, relVal = 0.8, volDB = -6;

function buildSynth(type) {
  if (synth) { synth.dispose(); }
  synth = SYNTH_OPTS[type]();
  synth.toDestination();
  if (synth.set) {
    synth.set({ volume: volDB });
    if (type !== 'membrane' && type !== 'metal') {
      synth.set({ envelope: { attack: atkVal, release: relVal } });
    }
  }
}

buildSynth('fm');

function noteOn(noteName) {
  if (Tone.context.state !== 'running') Tone.start();
  if (activeNotes[noteName]) return;
  try {
    if (synth instanceof Tone.MembraneSynth || synth instanceof Tone.MetalSynth) {
      synth.triggerAttack(noteName, Tone.now());
    } else {
      synth.triggerAttack(noteName, Tone.now());
    }
    activeNotes[noteName] = true;
    setLed(true);
    updateNoteDisplay(noteName);
  } catch(e) { console.warn(e); }
}

function noteOff(noteName) {
  if (!activeNotes[noteName]) return;
  try {
    if (!(synth instanceof Tone.MembraneSynth) && !(synth instanceof Tone.MetalSynth)) {
      synth.triggerRelease(noteName, Tone.now());
    }
  } catch(e) {}
  delete activeNotes[noteName];
  if (Object.keys(activeNotes).length === 0) setLed(false);
  updateNoteDisplay(null);
}

function setLed(on) {
  document.getElementById('led').classList.toggle('on', on);
}

const SOLFEGE = {
  'C':'Do','C#':'Do♯',
  'D':'Re','D#':'Re♯',
  'E':'Mi',
  'F':'Fa','F#':'Fa♯',
  'G':'Sol','G#':'Sol♯',
  'A':'La','A#':'La♯',
  'B':'Si'
};

function dualNoteName(noteName) {
  if (!noteName) return '—';
  const m = /^([A-G]#?)(-?\d+)$/.exec(noteName);
  if (!m) return noteName;
  return `${noteName} · ${SOLFEGE[m[1]] || m[1]}${m[2]}`;
}

function updateNoteDisplay(n) {
  const el = document.getElementById('noteDisplay');
  el.innerHTML = `note: <span>${dualNoteName(n)}</span>`;
}

// ── Build piano UI ─────────────────────────────────────────────
const WK_MAP = 'asdfghjkl';
const BK_MAP = 'wetyu op'; // spaces = no black key at that position

function renderPiano() {
  buildLayout();
  const wkContainer = document.getElementById('whiteKeys');
  const bkContainer = document.getElementById('blackKeys');
  wkContainer.innerHTML = '';
  bkContainer.innerHTML = '';

  const wkWidth = 42;
  const wkGap = 3;
  const totalWhite = whiteNotes.length;
  const totalWidth = totalWhite * wkWidth + (totalWhite - 1) * wkGap;

  // White keys
  whiteNotes.forEach((n, i) => {
    const el = document.createElement('div');
    el.className = 'key-w';
    const fullNote = n.note + n.oct;
    el.dataset.note = fullNote;
    const kbKey = WK_MAP[i] || '';
    const sol = SOLFEGE[n.note] || n.note;
    el.innerHTML = `<span class="key-label${n.note === 'C' ? ' hi' : ''}">${kbKey.toUpperCase()}<br>${n.note} · ${sol}</span>`;

    el.addEventListener('mousedown', e => { e.preventDefault(); noteOn(fullNote); });
    el.addEventListener('mouseup', () => noteOff(fullNote));
    el.addEventListener('mouseleave', () => noteOff(fullNote));
    el.addEventListener('touchstart', e => { e.preventDefault(); noteOn(fullNote); }, { passive: false });
    el.addEventListener('touchend', e => { e.preventDefault(); noteOff(fullNote); });

    wkContainer.appendChild(el);
  });

  // Black keys — positioned absolutely over white keys
  bkContainer.style.width = totalWidth + 'px';
  bkContainer.style.left = '0';
  bkContainer.style.transform = 'none';
  bkContainer.style.position = 'absolute';
  bkContainer.style.top = '0';

  // Calculate left positions for each white key
  const getWhiteLeft = idx => idx * (wkWidth + wkGap);

  let bkIdx = 0;
  blackNotes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'key-b';
    const fullNote = n.note + n.oct;
    el.dataset.note = fullNote;

    const whiteIdx = n.slotIndex;
    const leftPos = getWhiteLeft(whiteIdx) + wkWidth - 14; // center between white keys
    el.style.left = leftPos + 'px';
    el.style.position = 'absolute';

    const bkKeyStr = BK_MAP[n.slotIndex % 7] || '';
    const kbKey = ['w','e','','t','y','u',''][n.slotIndex % 7] || '';
    const octKeys = ['w','e','','t','y','u','o','','p'][bkIdx] || '';
    const sol = SOLFEGE[n.note] || n.note;
    el.innerHTML = `<span class="key-label">${kbKey.toUpperCase()}<br>${n.note} · ${sol}</span>`;

    el.addEventListener('mousedown', e => { e.preventDefault(); noteOn(fullNote); });
    el.addEventListener('mouseup', () => noteOff(fullNote));
    el.addEventListener('mouseleave', () => noteOff(fullNote));
    el.addEventListener('touchstart', e => { e.preventDefault(); noteOn(fullNote); }, { passive: false });
    el.addEventListener('touchend', e => { e.preventDefault(); noteOff(fullNote); });

    bkContainer.appendChild(el);
    bkIdx++;
  });
}

renderPiano();

// Re-center black keys container
function fixBlackKeys() {
  const wk = document.getElementById('whiteKeys');
  const bk = document.getElementById('blackKeys');
  const rect = wk.getBoundingClientRect();
  const parentRect = wk.parentElement.getBoundingClientRect();
  bk.style.left = (rect.left - parentRect.left) + 'px';
}
requestAnimationFrame(fixBlackKeys);

// ── Keyboard input ─────────────────────────────────────────────
const whiteKbMap = {};
const blackKbMap = {};

'asdfghjkl'.split('').forEach((k, i) => {
  if (whiteNotes[i]) whiteKbMap[k] = whiteNotes[i].note + whiteNotes[i].oct;
});

// Black keys keyboard: w e - t y u - o p (positions 0,1, skip 2, 3,4,5, skip 6, 7,8...)
const blackKbKeys = ['w','e','t','y','u','o','p','1','2','3','4'];
blackNotes.forEach((n, i) => {
  if (blackKbKeys[i]) blackKbMap[blackKbKeys[i]] = n.note + n.oct;
});

document.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  const note = whiteKbMap[k] || blackKbMap[k];
  if (note) {
    noteOn(note);
    // highlight
    document.querySelectorAll(`[data-note="${note}"]`).forEach(el => el.classList.add('active'));
  }
});

document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  const note = whiteKbMap[k] || blackKbMap[k];
  if (note) {
    noteOff(note);
    document.querySelectorAll(`[data-note="${note}"]`).forEach(el => el.classList.remove('active'));
  }
});

// ── Synth type change ──────────────────────────────────────────
document.getElementById('synthType').addEventListener('change', e => {
  buildSynth(e.target.value);
});

// ── Octave ─────────────────────────────────────────────────────
document.getElementById('octDown').addEventListener('click', () => {
  if (baseOct <= 1) return;
  baseOct--;
  document.getElementById('octDisplay').textContent = `OCT ${baseOct}`;
  renderPiano();
  fixBlackKeys();
  rebuildKeyMaps();
});

document.getElementById('octUp').addEventListener('click', () => {
  if (baseOct >= 7) return;
  baseOct++;
  document.getElementById('octDisplay').textContent = `OCT ${baseOct}`;
  renderPiano();
  fixBlackKeys();
  rebuildKeyMaps();
});

function rebuildKeyMaps() {
  for (const k in whiteKbMap) delete whiteKbMap[k];
  for (const k in blackKbMap) delete blackKbMap[k];
  'asdfghjkl'.split('').forEach((k, i) => {
    if (whiteNotes[i]) whiteKbMap[k] = whiteNotes[i].note + whiteNotes[i].oct;
  });
  blackNotes.forEach((n, i) => {
    if (blackKbKeys[i]) blackKbMap[blackKbKeys[i]] = n.note + n.oct;
  });
}

// ── Knob controls ───────────────────────────────────────────────
function setupKnob(id, min, max, init, onChange, formatValue) {
  const el = document.getElementById(id);
  const valueId = id === 'knobVol' ? 'valVol' : id === 'knobAtk' ? 'valAtk' : 'valRel';
  const valueEl = document.getElementById(valueId);

  let val = init;
  let dragging = false;
  let startY = 0;
  let startVal = init;

  const clamp = v => Math.max(min, Math.min(max, v));

  function updateVisual() {
    const t = (val - min) / (max - min);
    const angle = -135 + t * 270;
    el.style.setProperty('--rot', angle + 'deg');
    el.setAttribute('aria-valuenow', String(val));
    if (valueEl) valueEl.textContent = formatValue(val);
  }

  function setValue(v) {
    val = clamp(v);
    updateVisual();
    onChange(val);
  }

  el.setAttribute('role', 'slider');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-valuemin', String(min));
  el.setAttribute('aria-valuemax', String(max));

  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    dragging = true;
    startY = e.clientY;
    startVal = val;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    // ~180 px vertical movement = complete knob range.
    const delta = (startY - e.clientY) / 180;
    setValue(startVal + delta * (max - min));
  });

  el.addEventListener('pointerup', e => {
    dragging = false;
    try { el.releasePointerCapture(e.pointerId); } catch (_) {}
  });

  el.addEventListener('pointercancel', () => dragging = false);

  el.addEventListener('wheel', e => {
    e.preventDefault();
    const step = (max - min) / 100;
    setValue(val + (e.deltaY < 0 ? step : -step));
  }, { passive: false });

  el.addEventListener('keydown', e => {
    const step = (max - min) / 100;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
      e.preventDefault(); setValue(val + step);
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
      e.preventDefault(); setValue(val - step);
    } else if (e.key === 'Home') {
      e.preventDefault(); setValue(min);
    } else if (e.key === 'End') {
      e.preventDefault(); setValue(max);
    }
  });

  updateVisual();
}

setupKnob('knobVol', -30, 0, -6, v => {
  volDB = v;
  if (synth && synth.set) synth.set({ volume: v });
}, v => `${v.toFixed(1).replace('-', '−')} dB`);

setupKnob('knobAtk', 0.001, 1, 0.02, v => {
  atkVal = v;
  if (synth && synth.set) {
    try { synth.set({ envelope: { attack: v } }); } catch(e) {}
  }
}, v => v < 0.1 ? `${Math.round(v * 1000)} ms` : `${v.toFixed(2)} s`);

setupKnob('knobRel', 0.05, 4, 0.8, v => {
  relVal = v;
  if (synth && synth.set) {
    try { synth.set({ envelope: { release: v } }); } catch(e) {}
  }
}, v => `${v.toFixed(2)} s`);
</script>
