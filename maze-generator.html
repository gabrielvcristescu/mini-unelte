<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Labirint — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="prism.css">

<style>
:root {
  --accent: #f0a040;
  --accent-dim: rgba(240,160,64,0.10);
  --accent-border: rgba(240,160,64,0.28);
}

.controls-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); align-items: center; flex-wrap: wrap; }
.size-select {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  padding: 6px 10px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  outline: none;
  cursor: pointer;
}
.gen-btn {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  cursor: pointer;
  transition: all 0.12s;
}
.gen-btn:hover { filter: brightness(1.15); }

.maze-wrap { display: flex; justify-content: center; padding: 0.5rem 0; overflow-x: auto; }
.maze-svg { background: var(--bg2); border-radius: var(--radius); }
.maze-wall { stroke: var(--text2); stroke-width: 2; stroke-linecap: round; }
.maze-start { fill: #4af0b0; }
.maze-end { fill: #f06060; }
.maze-player { fill: #60a0f0; }
.maze-path { stroke: #60a0f0; stroke-width: 3; fill: none; opacity: 0.4; }

.status-msg {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
  margin: var(--content-gap) 0;
  min-height: 1.5em;
}
.status-msg.win { color: #4af0b0; }

.info-note { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text3); text-align: center; margin-top: 8px; }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Generator labirint</h1>
    <p>Algoritm DFS — navighează cu săgețile sau WASD</p>
  </div>

  <div class="controls-row">
    <select class="size-select" id="size-select" onchange="generateMaze()">
      <option value="10">Mic (10×10)</option>
      <option value="15" selected>Mediu (15×15)</option>
      <option value="20">Mare (20×20)</option>
      <option value="30">Foarte mare (30×30)</option>
    </select>
    <button class="gen-btn" onclick="generateMaze()">🔀 Labirint nou</button>
  </div>

  <div class="maze-wrap" id="maze-wrap"></div>

  <div class="status-msg" id="status-msg"></div>
  <p class="info-note">Verde = start · Roșu = ieșire · Folosește săgețile sau W/A/S/D</p>
</div>

<script>
let maze = [];
let size = 15;
let playerX = 0, playerY = 0;
let won = false;
const CELL = 24;

// Generare labirint prin DFS recursiv (recursive backtracker) — clasic, garantează unicitate cale
function generateMazeGrid(n) {
  // Fiecare celulă are 4 pereți: N,E,S,W (true = perete prezent)
  const grid = Array.from({length:n}, () => Array.from({length:n}, () => ({N:true,E:true,S:true,W:true,visited:false})));

  const stack = [[0,0]];
  grid[0][0].visited = true;

  const dirs = [
    [0,-1,'N','S'], [1,0,'E','W'], [0,1,'S','N'], [-1,0,'W','E']
  ];

  while (stack.length > 0) {
    const [cx, cy] = stack[stack.length-1];
    const neighbors = [];

    dirs.forEach(([dx,dy,wall,opWall]) => {
      const nx = cx+dx, ny = cy+dy;
      if (nx>=0 && nx<n && ny>=0 && ny<n && !grid[ny][nx].visited) {
        neighbors.push([nx,ny,wall,opWall]);
      }
    });

    if (neighbors.length === 0) {
      stack.pop();
    } else {
      const [nx,ny,wall,opWall] = neighbors[Math.floor(Math.random()*neighbors.length)];
      grid[cy][cx][wall] = false;
      grid[ny][nx][opWall] = false;
      grid[ny][nx].visited = true;
      stack.push([nx,ny]);
    }
  }

  return grid;
}

function generateMaze() {
  size = parseInt(document.getElementById('size-select').value);
  maze = generateMazeGrid(size);
  playerX = 0; playerY = 0;
  won = false;
  document.getElementById('status-msg').textContent = '';
  document.getElementById('status-msg').className = 'status-msg';
  renderMaze();
}

function renderMaze() {
  const wrap = document.getElementById('maze-wrap');
  const w = size*CELL, h = size*CELL;
  let svg = `<svg class="maze-svg" width="${w+4}" height="${h+4}" viewBox="0 0 ${w+4} ${h+4}">`;
  svg += `<g transform="translate(2,2)">`;

  for (let y=0; y<size; y++) {
    for (let x=0; x<size; x++) {
      const cell = maze[y][x];
      const px = x*CELL, py = y*CELL;
      if (cell.N) svg += `<line class="maze-wall" x1="${px}" y1="${py}" x2="${px+CELL}" y2="${py}"/>`;
      if (cell.S) svg += `<line class="maze-wall" x1="${px}" y1="${py+CELL}" x2="${px+CELL}" y2="${py+CELL}"/>`;
      if (cell.W) svg += `<line class="maze-wall" x1="${px}" y1="${py}" x2="${px}" y2="${py+CELL}"/>`;
      if (cell.E) svg += `<line class="maze-wall" x1="${px+CELL}" y1="${py}" x2="${px+CELL}" y2="${py+CELL}"/>`;
    }
  }

  // Start
  svg += `<circle class="maze-start" cx="${CELL/2}" cy="${CELL/2}" r="${CELL*0.28}"/>`;
  // Finish
  svg += `<circle class="maze-end" cx="${(size-1)*CELL+CELL/2}" cy="${(size-1)*CELL+CELL/2}" r="${CELL*0.28}"/>`;
  // Player
  svg += `<circle class="maze-player" id="player-dot" cx="${playerX*CELL+CELL/2}" cy="${playerY*CELL+CELL/2}" r="${CELL*0.32}"/>`;

  svg += `</g></svg>`;
  wrap.innerHTML = svg;
}

function movePlayer(dx, dy) {
  if (won) return;
  const cell = maze[playerY][playerX];

  if (dx===1 && !cell.E) playerX++;
  else if (dx===-1 && !cell.W) playerX--;
  else if (dy===1 && !cell.S) playerY++;
  else if (dy===-1 && !cell.N) playerY--;
  else return;

  const dot = document.getElementById('player-dot');
  if (dot) {
    dot.setAttribute('cx', playerX*CELL+CELL/2);
    dot.setAttribute('cy', playerY*CELL+CELL/2);
  }

  if (playerX === size-1 && playerY === size-1) {
    won = true;
    const msg = document.getElementById('status-msg');
    msg.textContent = '🎉 Ai ajuns la ieșire!';
    msg.className = 'status-msg win';
  }
}

document.addEventListener('keydown', e => {
  const map = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
    W:[0,-1], S:[0,1], A:[-1,0], D:[1,0],
  };
  if (map[e.key]) {
    e.preventDefault();
    movePlayer(...map[e.key]);
  }
});

generateMaze();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Generator labirint</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
