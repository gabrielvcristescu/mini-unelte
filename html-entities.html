<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Entities — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #60a0f0;
  --accent-dim: rgba(96,160,240,0.10);
  --accent-border: rgba(96,160,240,0.28);
}

.mode-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); align-items: center; }
.mode-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.mode-btn.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }

.swap-btn {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text2);
  transition: all 0.15s;
  margin-left: auto;
}
.swap-btn:hover { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }

.big-textarea {
  width: 100%;
  min-height: 140px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--text);
  outline: none;
  resize: vertical;
  line-height: 1.5;
}
.big-textarea:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-dim); }
.big-textarea.output { color: var(--accent); }

.area-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.area-name { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.area-actions { display: flex; gap: 6px; }
.mini-btn {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.mini-btn:hover { border-color: var(--accent-border); color: var(--accent); }

/* ── Preview box ── */
.preview-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-sans);
  font-size: 0.9rem;
  color: var(--text);
  min-height: 60px;
  word-break: break-word;
}

/* ── Reference table ── */
.ref-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.74rem; }
.ref-table th { text-align: left; color: var(--text3); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 5px 10px; border-bottom: 1px solid var(--border); }
.ref-table td { padding: 4px 10px; border-bottom: 1px solid rgba(128,128,128,0.05); color: var(--text2); cursor: pointer; }
.ref-table tr:hover td { background: var(--bg3); }
.ref-char { font-size: 1rem; color: var(--text); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>HTML Entities</h1>
    <p>Encode/decode &amp; &lt; &gt; și alte caractere speciale HTML</p>
  </div>

  <div class="mode-row">
    <button class="mode-btn active" id="btn-encode" onclick="setMode('encode')">Encode</button>
    <button class="mode-btn" id="btn-decode" onclick="setMode('decode')">Decode</button>
    <div class="swap-btn" onclick="swapDirection()" title="Inversează">⇄</div>
  </div>

  <div style="margin-bottom:var(--content-gap)">
    <div class="area-label">
      <span class="area-name" id="input-label">Text original</span>
      <div class="area-actions">
        <button class="mini-btn" onclick="pasteInto()">Lipește</button>
        <button class="mini-btn" onclick="clearInput()">Șterge</button>
      </div>
    </div>
    <textarea class="big-textarea" id="input-area" placeholder="Scrie sau lipește text/HTML aici..." oninput="compute()"></textarea>
  </div>

  <div style="margin-bottom:var(--content-gap)">
    <div class="area-label">
      <span class="area-name" id="output-label">Rezultat encodat</span>
      <div class="area-actions">
        <button class="mini-btn" onclick="copyOutput()">Copiază</button>
      </div>
    </div>
    <textarea class="big-textarea output" id="output-area" readonly placeholder="Rezultatul apare aici..."></textarea>
  </div>

  <!-- Preview vizual -->
  <div style="margin-bottom:var(--content-gap)">
    <div class="area-label"><span class="area-name">Previzualizare randare browser</span></div>
    <div class="preview-box" id="preview-box"></div>
  </div>

  <!-- Tabel referință -->
  <div class="card">
    <div class="field-label" style="margin-bottom:10px">Entități comune (click pentru a insera)</div>
    <table class="ref-table" id="ref-table"></table>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
let mode = 'encode';

const COMMON_ENTITIES = [
  { char: '<', name: '&lt;', desc: 'mai mic' },
  { char: '>', name: '&gt;', desc: 'mai mare' },
  { char: '&', name: '&amp;', desc: 'ampersand' },
  { char: '"', name: '&quot;', desc: 'ghilimele' },
  { char: "'", name: '&#39;', desc: 'apostrof' },
  { char: '©', name: '&copy;', desc: 'copyright' },
  { char: '®', name: '&reg;', desc: 'marcă înregistrată' },
  { char: '™', name: '&trade;', desc: 'trademark' },
  { char: '€', name: '&euro;', desc: 'euro' },
  { char: '£', name: '&pound;', desc: 'liră' },
  { char: '§', name: '&sect;', desc: 'secțiune' },
  { char: '¶', name: '&para;', desc: 'paragraf' },
  { char: '×', name: '&times;', desc: 'înmulțire' },
  { char: '÷', name: '&divide;', desc: 'împărțire' },
  { char: '±', name: '&plusmn;', desc: 'plus-minus' },
  { char: '°', name: '&deg;', desc: 'grade' },
  { char: '¼', name: '&frac14;', desc: 'un sfert' },
  { char: '½', name: '&frac12;', desc: 'jumătate' },
  { char: '¾', name: '&frac34;', desc: 'trei sferturi' },
  { char: '\u00A0', name: '&nbsp;', desc: 'spațiu fix' },
  { char: '—', name: '&mdash;', desc: 'linie lungă' },
  { char: '–', name: '&ndash;', desc: 'linie scurtă' },
  { char: '…', name: '&hellip;', desc: 'puncte de suspensie' },
];

function setMode(m) {
  mode = m;
  document.getElementById('btn-encode').classList.toggle('active', m === 'encode');
  document.getElementById('btn-decode').classList.toggle('active', m === 'decode');
  document.getElementById('input-label').textContent = m === 'encode' ? 'Text original' : 'HTML cu entități';
  document.getElementById('output-label').textContent = m === 'encode' ? 'Rezultat encodat' : 'Text decodat';
  compute();
}

function swapDirection() {
  const out = document.getElementById('output-area').value;
  setMode(mode === 'encode' ? 'decode' : 'encode');
  document.getElementById('input-area').value = out;
  compute();
}

function encodeEntities(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function decodeEntities(text) {
  const div = document.createElement('div');
  div.innerHTML = text;
  return div.textContent;
}

function compute() {
  const input = document.getElementById('input-area');
  const output = document.getElementById('output-area');
  const preview = document.getElementById('preview-box');
  const text = input.value;

  if (!text) { output.value = ''; preview.innerHTML = ''; return; }

  let result;
  if (mode === 'encode') {
    result = encodeEntities(text);
    preview.textContent = text; // preview arată textul brut (cum s-ar vedea randat)
  } else {
    result = decodeEntities(text);
    preview.innerHTML = text; // preview randează HTML-ul introdus (cu entitățile decodate vizual)
  }

  output.value = result;
}

function clearInput() {
  document.getElementById('input-area').value = '';
  compute();
}

function pasteInto() {
  navigator.clipboard.readText().then(text => {
    document.getElementById('input-area').value = text;
    compute();
  }).catch(() => showToast('Nu s-a putut accesa clipboard-ul'));
}

function copyOutput() {
  const text = document.getElementById('output-area').value;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => showToast('Copiat!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function buildRefTable() {
  const table = document.getElementById('ref-table');
  table.innerHTML = `<thead><tr><th>Caracter</th><th>Entitate</th><th>Descriere</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  COMMON_ENTITIES.forEach(e => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="ref-char">${e.char === '\u00A0' ? '(spațiu)' : e.char}</td><td>${e.name}</td><td>${e.desc}</td>`;
    tr.onclick = () => {
      const inp = document.getElementById('input-area');
      inp.value += mode === 'encode' ? e.char : e.name;
      compute();
    };
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

buildRefTable();
compute();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>HTML entities</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
