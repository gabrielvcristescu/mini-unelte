<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghicește Culoarea HEX — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #f0a040;
  --accent-dim: rgba(240,192,64,0.10);
  --accent-border: rgba(240,192,64,0.28);
}

.diff-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); }
.diff-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.diff-btn.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }

.stats-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--content-gap);
  font-family: var(--font-mono);
  font-size: 0.78rem;
}
.stat-item { display: flex; gap: 6px; align-items: center; }
.stat-label { color: var(--text3); }
.stat-val { color: var(--accent); font-weight: 700; }

.color-display {
  height: 200px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: var(--content-gap);
  transition: background 0.15s;
}

.options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: var(--content-gap); }
@media (max-width: 500px) { .options-grid { grid-template-columns: 1fr; } }
.option-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.option-btn:hover:not(:disabled) { border-color: var(--accent-border); background: var(--accent-dim); }
.option-btn:disabled { cursor: default; }
.option-btn.correct { border-color: #4af0b0; background: rgba(74,240,176,0.12); color: #4af0b0; }
.option-btn.wrong { border-color: #f06060; background: rgba(240,96,96,0.12); color: #f06060; }

.final-card {
  background: var(--bg2);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius);
  padding: 30px 24px;
  text-align: center;
  display: none;
}
.final-card.show { display: block; }
.final-score { font-family: var(--font-mono); font-size: 2.2rem; font-weight: 700; color: var(--accent); }
.final-label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text3); margin-top: 6px; }
.restart-btn {
  margin-top: 16px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  cursor: pointer;
}
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Ghicește culoarea HEX</h1>
    <p>Ce cod hex are această culoare?</p>
  </div>

  <div class="diff-row">
    <button class="diff-btn active" id="diff-easy" onclick="setDifficulty('easy')">Ușor</button>
    <button class="diff-btn" id="diff-hard" onclick="setDifficulty('hard')">Greu</button>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><span class="stat-label">Rundă</span> <span class="stat-val" id="q-num">1</span><span class="stat-label">/10</span></div>
    <div class="stat-item"><span class="stat-label">Scor</span> <span class="stat-val" id="score-val">0</span></div>
  </div>

  <div id="quiz-area">
    <div class="color-display" id="color-display"></div>
    <div class="options-grid" id="options-grid"></div>
  </div>

  <div class="final-card" id="final-card">
    <div class="final-score" id="final-score">—</div>
    <div class="final-label">răspunsuri corecte din 10</div>
    <button class="restart-btn" onclick="startQuiz()">Joacă din nou</button>
  </div>
</div>

<script>
let difficulty = 'easy';
let currentHex = '';
let currentQ = 0;
let score = 0;
let answered = false;
let autoAdvanceTimer = null;

function randHex() {
  return '#' + Math.floor(Math.random()*16777216).toString(16).padStart(6,'0').toUpperCase();
}

// Generează o culoare "apropiată" pentru distractori — diferă puțin în R/G/B
function nearbyHex(hex, maxDelta) {
  const num = parseInt(hex.slice(1), 16);
  let r=(num>>16)&255, g=(num>>8)&255, b=num&255;
  const jitter = () => Math.floor((Math.random()*2-1)*maxDelta);
  r = Math.max(0, Math.min(255, r+jitter()));
  g = Math.max(0, Math.min(255, g+jitter()));
  b = Math.max(0, Math.min(255, b+jitter()));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();
}

function setDifficulty(d) {
  difficulty = d;
  document.getElementById('diff-easy').classList.toggle('active', d==='easy');
  document.getElementById('diff-hard').classList.toggle('active', d==='hard');
  startQuiz();
}

function startQuiz() {
  clearTimeout(autoAdvanceTimer);
  currentQ = 0;
  score = 0;
  document.getElementById('final-card').classList.remove('show');
  document.getElementById('quiz-area').style.display = 'block';
  nextRound();
}

function nextRound() {
  currentQ++;
  answered = false;

  if (currentQ > 10) { showFinal(); return; }

  document.getElementById('q-num').textContent = currentQ;
  document.getElementById('score-val').textContent = score;

  currentHex = randHex();
  document.getElementById('color-display').style.background = currentHex;

  // Distractori: în modul greu, foarte apropiați de culoarea corectă (diferență mică RGB)
  const maxDelta = difficulty === 'easy' ? 60 : 15;
  const wrongs = [nearbyHex(currentHex, maxDelta), nearbyHex(currentHex, maxDelta), nearbyHex(currentHex, maxDelta)];
  const options = shuffle([currentHex, ...wrongs]);

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(btn, opt);
    grid.appendChild(btn);
  });
}

function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function selectAnswer(btn, selected) {
  if (answered) return;
  answered = true;

  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === currentHex) b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });

  if (selected === currentHex) score++;
  document.getElementById('score-val').textContent = score;

  clearTimeout(autoAdvanceTimer);
  autoAdvanceTimer = setTimeout(nextRound, 1300);
}

function showFinal() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('final-score').textContent = score + '/10';
  document.getElementById('final-card').classList.add('show');
}

startQuiz();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Ghicește culoarea HEX</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
