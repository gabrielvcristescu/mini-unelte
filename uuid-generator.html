<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID Generator — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #60a0f0;
  --accent-dim: rgba(96,160,240,0.10);
  --accent-border: rgba(96,160,240,0.28);
}

.controls-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); align-items: center; flex-wrap: wrap; }
.count-input { width: 70px !important; font-size: 0.9rem !important; padding: 6px 8px !important; text-align: center; }
.gen-btn {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  cursor: pointer;
  transition: all 0.12s;
}
.gen-btn:hover { filter: brightness(1.15); }
.gen-btn:active { transform: scale(0.98); }

.format-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--text2);
  cursor: pointer;
  margin-left: auto;
}

.uuid-list { display: flex; flex-direction: column; gap: 6px; }
.uuid-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
}
.uuid-val {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--text);
  flex: 1;
  word-break: break-all;
}
.copy-mini {
  background: none; border: none; cursor: pointer;
  color: var(--text3); padding: 4px 8px; border-radius: 4px;
  transition: color 0.12s, background 0.12s; flex-shrink: 0;
  font-family: var(--font-mono); font-size: 0.65rem;
}
.copy-mini:hover { color: var(--accent); background: var(--bg3); }

.copy-all-row { display: flex; gap: 8px; margin-top: var(--content-gap); }
.action-btn {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.action-btn:hover { border-color: var(--accent-border); color: var(--accent); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>UUID Generator</h1>
    <p>UUID v4 random, generare în masă, copiere ușoară</p>
  </div>

  <div class="controls-row">
    <input class="input-calc count-input" id="count-input" type="number" min="1" max="500" value="5"
           style="--input-color:var(--accent)">
    <button class="gen-btn" onclick="generateAll()">Generează</button>
    <label class="format-toggle">
      <input type="checkbox" id="uppercase-toggle" onchange="reformatAll()">
      MAJUSCULE
    </label>
    <label class="format-toggle">
      <input type="checkbox" id="nohyphen-toggle" onchange="reformatAll()">
      fără cratime
    </label>
  </div>

  <div class="uuid-list" id="uuid-list"></div>

  <div class="copy-all-row">
    <button class="action-btn" onclick="copyAll()">Copiază toate</button>
    <button class="action-btn" onclick="downloadAll()">Descarcă .txt</button>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
let currentUUIDs = [];

function generateUUID() {
  // crypto.randomUUID() e nativ browser, criptografic sigur
  return crypto.randomUUID();
}

function formatUUID(uuid) {
  const uppercase = document.getElementById('uppercase-toggle').checked;
  const noHyphen = document.getElementById('nohyphen-toggle').checked;
  let result = uuid;
  if (noHyphen) result = result.replace(/-/g, '');
  if (uppercase) result = result.toUpperCase();
  return result;
}

function generateAll() {
  const count = Math.min(500, Math.max(1, parseInt(document.getElementById('count-input').value) || 1));
  currentUUIDs = Array.from({ length: count }, () => generateUUID());
  renderList();
}

function reformatAll() {
  renderList();
}

function renderList() {
  const list = document.getElementById('uuid-list');
  list.innerHTML = currentUUIDs.map((uuid, i) => `
    <div class="uuid-row">
      <span class="uuid-val">${formatUUID(uuid)}</span>
      <button class="copy-mini" onclick="copyOne(${i})">Copiază</button>
    </div>
  `).join('');
}

function copyOne(i) {
  const formatted = formatUUID(currentUUIDs[i]);
  navigator.clipboard.writeText(formatted).then(() => showToast('Copiat!'));
}

function copyAll() {
  const all = currentUUIDs.map(formatUUID).join('\n');
  navigator.clipboard.writeText(all).then(() => showToast(`${currentUUIDs.length} UUID-uri copiate`));
}

function downloadAll() {
  const all = currentUUIDs.map(formatUUID).join('\n');
  const blob = new Blob([all], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'uuids.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

generateAll();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>UUID generator</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
