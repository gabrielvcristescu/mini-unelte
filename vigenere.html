<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigenère Educativ — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #c080f0;
  --accent-dim: rgba(224,112,160,0.10);
  --accent-border: rgba(224,112,160,0.28);
}

.mode-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); }
.mode-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
}
.mode-btn.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }

.big-textarea {
  width: 100%;
  min-height: 90px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--text);
  outline: none;
  resize: vertical;
  margin-bottom: var(--content-gap);
}
.big-textarea:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-dim); }
.big-textarea.output { color: var(--accent); }

.key-input { width: 100%; font-family: var(--font-mono); font-size: 1rem !important; text-transform: uppercase; margin-bottom: var(--content-gap); }

.area-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.area-name { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.mini-btn {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
}
.mini-btn:hover { border-color: var(--accent-border); color: var(--accent); }

.demo-table-wrap { overflow-x: auto; }
.demo-table { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.78rem; white-space: nowrap; }
.demo-table td { padding: 4px 8px; text-align: center; }
.demo-table .row-label { color: var(--text3); font-size: 0.62rem; text-align: right; }
.demo-table .plain-cell { color: var(--text); }
.demo-table .key-cell { color: var(--accent); font-weight: 700; }
.demo-table .cipher-cell { color: #4af0b0; font-weight: 700; }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Vigenère educativ</h1>
    <p>Cifră polialfabetică — cheie repetată, cu vizualizare pas cu pas</p>
  </div>

  <div class="mode-row">
    <button class="mode-btn active" id="btn-encrypt" onclick="setMode('encrypt')">Criptează</button>
    <button class="mode-btn" id="btn-decrypt" onclick="setMode('decrypt')">Decriptează</button>
  </div>

  <div class="area-label">
    <span class="area-name">Text</span>
    <button class="mini-btn" onclick="pasteInto()">Lipește</button>
  </div>
  <textarea class="big-textarea" id="in-text" oninput="render()">ATTACKATDAWN</textarea>

  <div class="area-label">
    <span class="area-name">Cheie</span>
  </div>
  <input class="input-calc key-input" id="in-key" type="text" value="LEMON" oninput="render()" style="--input-color:var(--accent)">

  <div class="area-label">
    <span class="area-name">Rezultat</span>
    <button class="mini-btn" onclick="copyOutput()">Copiază</button>
  </div>
  <textarea class="big-textarea output" id="out-text" readonly></textarea>

  <div class="card" style="margin-top:var(--content-gap)">
    <div class="field-label" style="margin-bottom:10px">Vizualizare pas cu pas</div>
    <div class="demo-table-wrap">
      <table class="demo-table" id="demo-table"></table>
    </div>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
let mode = 'encrypt';

function setMode(m) {
  mode = m;
  document.getElementById('btn-encrypt').classList.toggle('active', m==='encrypt');
  document.getElementById('btn-decrypt').classList.toggle('active', m==='decrypt');
  render();
}

// Vigenère clasic: operează doar pe litere A-Z, ignoră/păstrează restul neschimbat
// dar cheia se aplică doar peste pozițiile de litere (spațiile/punctuația nu consumă din cheie)
function vigenere(text, key, decrypt) {
  const cleanKey = key.toUpperCase().replace(/[^A-Z]/g, '');
  if (!cleanKey) return { result: text, steps: [] };

  let keyIndex = 0;
  const steps = [];
  let result = '';

  for (const ch of text) {
    if (/[a-zA-Z]/.test(ch)) {
      const isUpper = ch === ch.toUpperCase();
      const base = isUpper ? 65 : 97;
      const plainVal = ch.toUpperCase().charCodeAt(0) - 65;
      const keyChar = cleanKey[keyIndex % cleanKey.length];
      const keyVal = keyChar.charCodeAt(0) - 65;

      const shift = decrypt ? -keyVal : keyVal;
      const cipherVal = ((plainVal + shift) % 26 + 26) % 26;
      const cipherChar = String.fromCharCode(cipherVal + base);

      steps.push({ plain: ch.toUpperCase(), key: keyChar, cipher: cipherChar.toUpperCase() });
      result += cipherChar;
      keyIndex++;
    } else {
      result += ch;
    }
  }

  return { result, steps };
}

function render() {
  const text = document.getElementById('in-text').value;
  const key = document.getElementById('in-key').value;

  const { result, steps } = vigenere(text, key, mode === 'decrypt');
  document.getElementById('out-text').value = result;

  renderDemoTable(steps);
}

function renderDemoTable(steps) {
  const table = document.getElementById('demo-table');
  if (steps.length === 0) { table.innerHTML = ''; return; }

  const shown = steps.slice(0, 30); // limităm afișarea pt text lung
  let html = '<tr><td class="row-label">Text</td>';
  shown.forEach(s => html += `<td class="plain-cell">${s.plain}</td>`);
  html += '</tr><tr><td class="row-label">Cheie</td>';
  shown.forEach(s => html += `<td class="key-cell">${s.key}</td>`);
  html += '</tr><tr><td class="row-label">Rezultat</td>';
  shown.forEach(s => html += `<td class="cipher-cell">${s.cipher}</td>`);
  html += '</tr>';

  table.innerHTML = html;
}

function pasteInto() {
  navigator.clipboard.readText().then(text => {
    document.getElementById('in-text').value = text;
    render();
  }).catch(() => showToast('Nu s-a putut accesa clipboard-ul'));
}

function copyOutput() {
  const val = document.getElementById('out-text').value;
  if (!val) return;
  navigator.clipboard.writeText(val).then(() => showToast('Copiat!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

render();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>

  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
