<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --accent: #60a0f0;
  --accent-dim: rgba(96,160,240,0.10);
  --accent-border: rgba(96,160,240,0.28);
}

.big-textarea {
  width: 100%;
  min-height: 130px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--text);
  outline: none;
  resize: vertical;
  line-height: 1.6;
}
.big-textarea:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-dim); }

.area-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.area-name { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.area-actions { display: flex; gap: 6px; align-items: center; }
.mini-btn {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.mini-btn:hover { border-color: var(--accent-border); color: var(--accent); }

.delim-select {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  padding: 3px 7px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 5px;
  color: var(--text2);
  outline: none;
  cursor: pointer;
}

.status-bar {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text3);
  margin: var(--content-gap) 0;
}
.status-bar.error { color: #f06060; }

/* ── Table ── */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-height: 500px;
  overflow-y: auto;
}
.csv-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.76rem; }
.csv-table th {
  position: sticky; top: 0;
  background: var(--bg3);
  text-align: left;
  padding: 8px 12px;
  border-bottom: 2px solid var(--border2);
  color: var(--accent);
  font-weight: 700;
  white-space: nowrap;
}
.csv-table td {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text2);
  white-space: nowrap;
}
.csv-table tr:hover td { background: var(--bg2); }
.csv-table .row-num {
  color: var(--text3);
  text-align: right;
  background: var(--bg2);
  position: sticky; left: 0;
}
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>

<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>CSV Viewer</h1>
    <p>Paste CSV → tabel formatat, local</p>
  </div>

  <div class="area-label">
    <span class="area-name">CSV / date tabulare</span>
    <div class="area-actions">
      <select class="delim-select" id="delim-select" onchange="parse()">
        <option value="auto">auto-detectează</option>
        <option value=",">virgulă (,)</option>
        <option value=";">punct-virgulă (;)</option>
        <option value="\t">tab</option>
        <option value="|">bară (|)</option>
      </select>
      <button class="mini-btn" onclick="pasteInto()">Lipește</button>
      <button class="mini-btn" onclick="clearInput()">Șterge</button>
    </div>
  </div>
  <textarea class="big-textarea" id="input-area" oninput="parse()">nume,vârstă,oraș
Ana Popescu,28,București
Victor Ionescu,34,Cluj-Napoca
Maria Dumitru,22,"Iași, România"</textarea>

  <div class="status-bar" id="status-bar"></div>

  <div class="table-wrap">
    <table class="csv-table" id="csv-table"></table>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
function detectDelimiter(text) {
  const firstLine = text.split('\n')[0] || '';
  const counts = {
    ',': (firstLine.match(/,/g) || []).length,
    ';': (firstLine.match(/;/g) || []).length,
    '\t': (firstLine.match(/\t/g) || []).length,
    '|': (firstLine.match(/\|/g) || []).length,
  };
  return Object.entries(counts).sort((a,b) => b[1]-a[1])[0][0];
}

// Parser CSV simplu care gestionează corect câmpuri cu ghilimele și delimitatori escapați
function parseCSV(text, delimiter) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i+1];

    if (inQuotes) {
      if (ch === '"' && next === '"') { field += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { field += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === delimiter) { row.push(field); field = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && next === '\n') i++;
        row.push(field); field = '';
        rows.push(row); row = [];
      } else { field += ch; }
    }
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parse() {
  const text = document.getElementById('input-area').value;
  const delimSetting = document.getElementById('delim-select').value;
  const statusBar = document.getElementById('status-bar');
  const table = document.getElementById('csv-table');

  if (!text.trim()) {
    statusBar.textContent = '';
    table.innerHTML = '';
    return;
  }

  const delimiter = delimSetting === 'auto' ? detectDelimiter(text) : (delimSetting === '\\t' ? '\t' : delimSetting);

  let rows;
  try {
    rows = parseCSV(text, delimiter);
  } catch (err) {
    statusBar.className = 'status-bar error';
    statusBar.textContent = 'Eroare la parsare: ' + err.message;
    table.innerHTML = '';
    return;
  }

  if (rows.length === 0) {
    statusBar.textContent = 'Nicio dată de afișat';
    table.innerHTML = '';
    return;
  }

  const header = rows[0];
  const dataRows = rows.slice(1);
  const colCount = header.length;

  // Verificăm consistența numărului de coloane
  const inconsistentRows = dataRows.filter(r => r.length !== colCount).length;

  statusBar.className = 'status-bar';
  statusBar.textContent = `${dataRows.length} rânduri × ${colCount} coloane` +
    (inconsistentRows > 0 ? ` · ⚠ ${inconsistentRows} rânduri cu nr. diferit de coloane` : '') +
    ` · delimitator: "${delimiter === '\t' ? 'tab' : delimiter}"`;

  let html = '<thead><tr><th class="row-num">#</th>';
  header.forEach(h => html += `<th>${escapeHtml(h)}</th>`);
  html += '</tr></thead><tbody>';

  dataRows.forEach((row, i) => {
    html += `<tr><td class="row-num">${i+1}</td>`;
    for (let c = 0; c < colCount; c++) {
      html += `<td>${escapeHtml(row[c] ?? '')}</td>`;
    }
    html += '</tr>';
  });
  html += '</tbody>';

  table.innerHTML = html;
}

function clearInput() {
  document.getElementById('input-area').value = '';
  parse();
}

function pasteInto() {
  navigator.clipboard.readText().then(text => {
    document.getElementById('input-area').value = text;
    parse();
  }).catch(() => showToast('Nu s-a putut accesa clipboard-ul'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

parse();
</script>

</script>
