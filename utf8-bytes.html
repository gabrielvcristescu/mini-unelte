<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTF-8 Byte Viewer — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #60a0f0;
  --accent-dim: rgba(96,160,240,0.10);
  --accent-border: rgba(96,160,240,0.28);
}

.big-textarea {
  width: 100%;
  min-height: 100px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--text);
  outline: none;
  resize: vertical;
  line-height: 1.5;
  margin-bottom: var(--content-gap);
}
.big-textarea:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-dim); }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: var(--content-gap); }
@media (max-width: 500px) { .stats-row { grid-template-columns: 1fr; } }
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.stat-val { font-family: var(--font-mono); font-size: 1rem; font-weight: 600; color: var(--accent); }
.stat-key { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

/* ── Byte breakdown per character ── */
.char-breakdown {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.char-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  flex-wrap: wrap;
}
.char-display {
  font-family: var(--font-mono);
  font-size: 1.1rem;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg3);
  border-radius: 6px;
  flex-shrink: 0;
}
.char-bytes { display: flex; gap: 4px; flex-wrap: wrap; }
.byte-chip {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 600;
  padding: 3px 7px;
  border-radius: 4px;
  background: var(--accent-dim);
  border: 1px solid var(--accent-border);
  color: var(--accent);
}
.char-meta {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--text3);
  margin-left: auto;
}

.raw-hex-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text2);
  word-break: break-all;
  line-height: 1.8;
}

.area-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.area-name { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.mini-btn {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.mini-btn:hover { border-color: var(--accent-border); color: var(--accent); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>UTF-8 Byte Viewer</h1>
    <p>Vezi octeții exacți din reprezentarea UTF-8 a unui text</p>
  </div>

  <div class="area-label">
    <span class="area-name">Text</span>
    <button class="mini-btn" onclick="clearInput()">Șterge</button>
  </div>
  <textarea class="big-textarea" id="input-area" placeholder="Scrie text aici (încearcă diacritice: ăîâșț sau emoji 🎉)..." oninput="compute()">Salut, ăîâșț! 🎉</textarea>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="stat-chars">—</div><div class="stat-key">caractere</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-bytes">—</div><div class="stat-key">octeți UTF-8</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-multi">—</div><div class="stat-key">caractere multi-byte</div></div>
  </div>

  <div class="area-label"><span class="area-name">Hex dump complet</span>
    <button class="mini-btn" onclick="copyHex()">Copiază</button>
  </div>
  <div class="raw-hex-box" id="raw-hex" style="margin-bottom:var(--content-gap)"></div>

  <div class="area-label"><span class="area-name">Detaliere per caracter</span></div>
  <div class="char-breakdown" id="char-breakdown"></div>

</div>

<div class="toast" id="toast">
</div>

<script>
function compute() {
  const text = document.getElementById('input-area').value;
  const chars = [...text]; // gestionează corect surrogate pairs / emoji

  let totalBytes = 0;
  let multiByteCount = 0;
  let hexParts = [];
  let breakdownHtml = '';

  chars.forEach(ch => {
    const bytes = [...new TextEncoder().encode(ch)];
    totalBytes += bytes.length;
    if (bytes.length > 1) multiByteCount++;

    const hexBytes = bytes.map(b => b.toString(16).toUpperCase().padStart(2,'0'));
    hexParts.push(...hexBytes);

    const codePoint = ch.codePointAt(0);
    const displayChar = ch === ' ' ? '␣' : ch === '\n' ? '↵' : ch;

    breakdownHtml += `
      <div class="char-row">
        <div class="char-display">${displayChar}</div>
        <div class="char-bytes">
          ${hexBytes.map(h => `<span class="byte-chip">${h}</span>`).join('')}
        </div>
        <div class="char-meta">U+${codePoint.toString(16).toUpperCase().padStart(4,'0')} · ${bytes.length} ${bytes.length===1?'octet':'octeți'}</div>
      </div>
    `;
  });

  document.getElementById('stat-chars').textContent = chars.length;
  document.getElementById('stat-bytes').textContent = totalBytes;
  document.getElementById('stat-multi').textContent = multiByteCount;
  document.getElementById('raw-hex').textContent = hexParts.join(' ') || '—';
  document.getElementById('char-breakdown').innerHTML = breakdownHtml || '<div class="text3" style="font-family:var(--font-mono);font-size:0.75rem">Introdu text mai sus</div>';
}

function clearInput() {
  document.getElementById('input-area').value = '';
  compute();
}

function copyHex() {
  const text = document.getElementById('raw-hex').textContent;
  if (!text || text === '—') return;
  navigator.clipboard.writeText(text).then(() => showToast('Copiat!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

compute();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>UTF-8 byte viewer</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
