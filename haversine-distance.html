<html lang="ro">
<head>
<meta charset="UTF-8">

<title>Distanță Haversine — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #90d060;
  --accent-dim: rgba(144,208,96,0.10);
  --accent-border: rgba(144,208,96,0.28);
}

.points-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--content-gap); }
@media (max-width: 500px) { .points-grid { grid-template-columns: 1fr; } }

.point-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.point-title {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.point-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.point-field { margin-bottom: 8px; }
.point-field:last-child { margin-bottom: 0; }
.point-field label {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  display: block;
  margin-bottom: 4px;
}

.result-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  text-align: center;
}
.result-main {
  font-family: var(--font-mono);
  font-size: 2.4rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.2;
}
.result-formula { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text3); margin-top: 4px; }

.info-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 500px) { .info-row { grid-template-columns: 1fr; } }
.info-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.info-val { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.info-key { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }

/* ── Line visualization ── */
.route-svg-wrap { display: flex; justify-content: center; padding: 1rem 0; }
.route-svg text { font-family: var(--font-mono); font-size: 10px; fill: var(--text2); }
.route-line { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5,4; fill: none; }
.route-point { fill: var(--accent); }
.route-point-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; opacity: 0.4; }

/* ── Preset city pairs ── */
.preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 6px; }
.preset-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  cursor: pointer;
  transition: all 0.12s;
}
.preset-btn:hover { border-color: var(--accent-border); background: var(--accent-dim); }
.preset-name { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text); font-weight: 500; }
.preset-dist { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text3); margin-top: 2px; }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Distanță Haversine</h1>
    <p>Distanța în linie dreaptă (great-circle) între două coordonate GPS</p>
  </div>

  <!-- Puncte -->
  <div class="points-grid" style="margin-bottom:var(--content-gap)">
    <div class="point-card">
      <div class="point-title"><span class="point-dot" style="background:#f06060"></span>Punct A</div>
      <div class="point-field">
        <label>Latitudine</label>
        <input class="input-calc" id="lat1" type="number" step="any" value="44.4268"
               style="--input-color:#f06060;font-size:1rem" oninput="compute()">
      </div>
      <div class="point-field">
        <label>Longitudine</label>
        <input class="input-calc" id="lon1" type="number" step="any" value="26.1025"
               style="--input-color:#f06060;font-size:1rem" oninput="compute()">
      </div>
    </div>
    <div class="point-card">
      <div class="point-title"><span class="point-dot"></span>Punct B</div>
      <div class="point-field">
        <label>Latitudine</label>
        <input class="input-calc" id="lat2" type="number" step="any" value="48.8566"
               style="--input-color:var(--accent);font-size:1rem" oninput="compute()">
      </div>
      <div class="point-field">
        <label>Longitudine</label>
        <input class="input-calc" id="lon2" type="number" step="any" value="2.3522"
               style="--input-color:var(--accent);font-size:1rem" oninput="compute()">
      </div>
    </div>
  </div>

  <!-- Vizualizare ── -->
  <div class="card" style="margin-bottom:var(--content-gap)">
    <div class="route-svg-wrap" id="route-svg-wrap"></div>
  </div>

  <!-- Rezultat -->
  <div class="result-card" style="margin-bottom:var(--content-gap)">
    <div class="result-main" id="result-main">—</div>
    <div class="result-formula" id="result-formula"></div>
  </div>

  <!-- Info -->
  <div class="info-row" style="margin-bottom:var(--content-gap)">
    <div class="info-card"><div class="info-val" id="info-miles">—</div><div class="info-key">mile</div></div>
    <div class="info-card"><div class="info-val" id="info-nm">—</div><div class="info-key">mile marine</div></div>
    <div class="info-card"><div class="info-val" id="info-azimuth">—</div><div class="info-key">azimut A→B</div></div>
  </div>

  <!-- Presetări -->
  <div class="card">
    <div class="field-label" style="margin-bottom:10px">Perechi de orașe (exemplu)</div>
    <div class="preset-grid" id="preset-grid"></div>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
const CITY_PAIRS = [
  { name: 'București → Paris', a: [44.4268, 26.1025], b: [48.8566, 2.3522] },
  { name: 'București → Roma', a: [44.4268, 26.1025], b: [41.9028, 12.4964] },
  { name: 'Londra → New York', a: [51.5074, -0.1278], b: [40.7128, -74.0060] },
  { name: 'Tokyo → Sydney', a: [35.6762, 139.6503], b: [-33.8688, 151.2093] },
  { name: 'București → Cluj-Napoca', a: [44.4268, 26.1025], b: [46.7712, 23.6236] },
];

function trim(n) { return parseFloat(n.toPrecision(6)).toString(); }
function toRad(deg) { return deg * Math.PI / 180; }
function toDeg(rad) { return rad * 180 / Math.PI; }

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371; // km
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function bearing(lat1, lon1, lat2, lon2) {
  const y = Math.sin(toRad(lon2-lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  let brng = toDeg(Math.atan2(y, x));
  return (brng + 360) % 360;
}

function compassDir(deg) {
  const dirs = ['N','NE','E','SE','S','SV','V','NV'];
  return dirs[Math.round(deg/45) % 8];
}

function compute() {
  const lat1 = parseFloat(document.getElementById('lat1').value);
  const lon1 = parseFloat(document.getElementById('lon1').value);
  const lat2 = parseFloat(document.getElementById('lat2').value);
  const lon2 = parseFloat(document.getElementById('lon2').value);

  const main = document.getElementById('result-main');
  const formula = document.getElementById('result-formula');

  if ([lat1,lon1,lat2,lon2].some(isNaN)) {
    main.textContent = '—'; formula.textContent = 'Completează toate cele 4 coordonate';
    document.getElementById('info-miles').textContent = '—';
    document.getElementById('info-nm').textContent = '—';
    document.getElementById('info-azimuth').textContent = '—';
    renderRoute(null);
    return;
  }

  const distKm = haversine(lat1, lon1, lat2, lon2);
  main.textContent = trim(distKm) + ' km';
  formula.textContent = `Haversine: R × 2×atan2(√a, √(1−a)), R=6371km`;

  document.getElementById('info-miles').textContent = trim(distKm * 0.621371) + ' mi';
  document.getElementById('info-nm').textContent = trim(distKm * 0.539957) + ' NM';

  const brng = bearing(lat1, lon1, lat2, lon2);
  document.getElementById('info-azimuth').textContent = trim(brng) + '° (' + compassDir(brng) + ')';

  renderRoute({ lat1, lon1, lat2, lon2, distKm, brng });
}

function renderRoute(data) {
  const wrap = document.getElementById('route-svg-wrap');
  const w = 300, h = 140;
  const ax = 60, ay = 100, bx = 240, by = 40;

  let svg = `<svg class="route-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  svg += `<line class="route-line" x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"/>`;

  svg += `<circle class="route-point-ring" cx="${ax}" cy="${ay}" r="10"/>`;
  svg += `<circle class="route-point" cx="${ax}" cy="${ay}" r="5" fill="#f06060"/>`;
  svg += `<text x="${ax}" y="${ay+22}" text-anchor="middle">A</text>`;

  svg += `<circle class="route-point-ring" cx="${bx}" cy="${by}" r="10"/>`;
  svg += `<circle class="route-point" cx="${bx}" cy="${by}" r="5"/>`;
  svg += `<text x="${bx}" y="${by-16}" text-anchor="middle">B</text>`;

  if (data) {
    const midX = (ax+bx)/2, midY = (ay+by)/2;
    svg += `<text x="${midX}" y="${midY-10}" text-anchor="middle" style="fill:var(--accent);font-weight:700">${trim(data.distKm)} km</text>`;
  }

  svg += `</svg>`;
  wrap.innerHTML = svg;
}

function buildPresets() {
  const grid = document.getElementById('preset-grid');
  CITY_PAIRS.forEach(p => {
    const dist = haversine(p.a[0], p.a[1], p.b[0], p.b[1]);
    const btn = document.createElement('div');
    btn.className = 'preset-btn';
    btn.innerHTML = `<div class="preset-name">${p.name}</div><div class="preset-dist">${trim(dist)} km</div>`;
    btn.onclick = () => {
      document.getElementById('lat1').value = p.a[0];
      document.getElementById('lon1').value = p.a[1];
      document.getElementById('lat2').value = p.b[0];
      document.getElementById('lon2').value = p.b[1];
      compute();
    };
    grid.appendChild(btn);
  });
}

buildPresets();
compute();
</script>

  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');

</script>

</body>
