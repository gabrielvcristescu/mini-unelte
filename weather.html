<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vreme Curentă — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #80e8b0;
  --accent-dim: rgba(96,160,240,0.10);
  --accent-border: rgba(96,160,240,0.28);
}

.search-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); }
.search-row input { flex: 1; }
.btn-primary {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 0 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  cursor: pointer;
}
.btn-primary:hover { filter: brightness(1.15); }
.btn-primary:disabled { opacity: 0.5; cursor: default; }

.location-btn {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  margin-bottom: var(--content-gap);
}
.location-btn:hover { border-color: var(--accent-border); color: var(--accent); }

.status-msg { text-align: center; font-family: var(--font-mono); font-size: 0.78rem; color: var(--text3); margin-bottom: var(--content-gap); }
.status-msg.error { color: #f06060; }

.weather-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  margin-bottom: var(--content-gap);
  display: none;
}
.weather-card.show { display: block; }
.weather-location { font-family: var(--font-sans); font-size: 1.1rem; font-weight: 700; color: var(--text); }
.weather-icon { font-size: 4rem; margin: 10px 0; }
.weather-temp { font-family: var(--font-mono); font-size: 2.8rem; font-weight: 700; color: var(--accent); }
.weather-desc { font-family: var(--font-mono); font-size: 0.85rem; color: var(--text2); margin-top: 4px; }

.details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: var(--content-gap); }
@media (max-width: 500px) { .details-grid { grid-template-columns: 1fr; } }
.detail-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; text-align: center; }
.detail-val { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 600; color: var(--text); }
.detail-key { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

.forecast-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.forecast-day { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; text-align: center; min-width: 80px; flex-shrink: 0; }
.forecast-date { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text3); }
.forecast-icon { font-size: 1.6rem; margin: 4px 0; }
.forecast-temps { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text2); }

.attribution { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text3); text-align: center; margin-top: var(--content-gap); }
.attribution a { color: var(--text2); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Vreme curentă</h1>
    <p>Date live Open-Meteo, fără cheie API</p>
  </div>

  <div class="search-row">
    <input class="input-calc" id="in-city" type="text" placeholder="Nume oraș..." value="București"
           style="--input-color:var(--accent);font-size:0.95rem">
    <button class="btn-primary" id="search-btn" onclick="searchCity()">Caută</button>
  </div>

  <button class="location-btn" onclick="useMyLocation()">📍 Folosește locația mea</button>

  <div class="status-msg" id="status-msg"></div>

  <div class="weather-card" id="weather-card">
    <div class="weather-location" id="weather-location"></div>
    <div class="weather-icon" id="weather-icon"></div>
    <div class="weather-temp" id="weather-temp"></div>
    <div class="weather-desc" id="weather-desc"></div>
  </div>

  <div class="details-grid" id="details-grid"></div>

  <div class="forecast-row" id="forecast-row"></div>

  <div class="attribution">Date furnizate de <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo.com</a> · Geocoding via OpenStreetMap</div>
</div>

<script>
// Cod WMO → emoji + descriere (subset comun, conform standardului Open-Meteo/WMO)
const WMO_CODES = {
  0: ['☀️','Cer senin'], 1: ['🌤️','Predominant senin'], 2: ['⛅','Parțial noros'], 3: ['☁️','Noros'],
  45: ['🌫️','Ceață'], 48: ['🌫️','Ceață cu chiciură'],
  51: ['🌦️','Burniță ușoară'], 53: ['🌦️','Burniță moderată'], 55: ['🌧️','Burniță densă'],
  61: ['🌧️','Ploaie ușoară'], 63: ['🌧️','Ploaie moderată'], 65: ['🌧️','Ploaie puternică'],
  71: ['🌨️','Ninsoare ușoară'], 73: ['🌨️','Ninsoare moderată'], 75: ['❄️','Ninsoare puternică'],
  77: ['🌨️','Grăunțe de zăpadă'],
  80: ['🌦️','Averse ușoare'], 81: ['🌧️','Averse moderate'], 82: ['⛈️','Averse violente'],
  85: ['🌨️','Averse de ninsoare'], 86: ['❄️','Averse de ninsoare puternice'],
  95: ['⛈️','Furtună'], 96: ['⛈️','Furtună cu grindină'], 99: ['⛈️','Furtună puternică cu grindină'],
};

function getWeatherIcon(code) { return (WMO_CODES[code] || ['❓','Necunoscut'])[0]; }
function getWeatherDesc(code) { return (WMO_CODES[code] || ['❓','Necunoscut'])[1]; }

async function geocodeCity(name) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name)}&format=json&limit=1`;
  const res = await fetch(url, { headers: { 'Accept-Language': 'ro' } });
  const data = await res.json();
  if (data.length === 0) throw new Error('Oraș negăsit');
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), name: data[0].display_name };
}

async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Eroare la obținerea datelor meteo');
  return res.json();
}

async function searchCity() {
  const city = document.getElementById('in-city').value.trim();
  if (!city) return;
  const statusEl = document.getElementById('status-msg');
  const btn = document.getElementById('search-btn');

  btn.disabled = true;
  statusEl.className = 'status-msg';
  statusEl.textContent = 'Se caută orașul...';
  document.getElementById('weather-card').classList.remove('show');

  try {
    const loc = await geocodeCity(city);
    statusEl.textContent = 'Se încarcă datele meteo...';
    const data = await fetchWeather(loc.lat, loc.lon);
    renderWeather(loc.name, data);
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = 'Eroare: ' + err.message;
    statusEl.className = 'status-msg error';
  } finally {
    btn.disabled = false;
  }
}

function useMyLocation() {
  const statusEl = document.getElementById('status-msg');
  if (!navigator.geolocation) {
    statusEl.textContent = 'Geolocalizarea nu e suportată de acest browser';
    statusEl.className = 'status-msg error';
    return;
  }

  statusEl.className = 'status-msg';
  statusEl.textContent = 'Se solicită locația...';

  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      statusEl.textContent = 'Se încarcă datele meteo...';
      const data = await fetchWeather(pos.coords.latitude, pos.coords.longitude);
      renderWeather(`${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}`, data);
      statusEl.textContent = '';
    } catch (err) {
      statusEl.textContent = 'Eroare: ' + err.message;
      statusEl.className = 'status-msg error';
    }
  }, err => {
    statusEl.textContent = 'Acces refuzat la locație: ' + err.message;
    statusEl.className = 'status-msg error';
  });
}

function renderWeather(locationName, data) {
  const cur = data.current;

  document.getElementById('weather-location').textContent = locationName.split(',').slice(0,2).join(', ');
  document.getElementById('weather-icon').textContent = getWeatherIcon(cur.weather_code);
  document.getElementById('weather-temp').textContent = Math.round(cur.temperature_2m) + '°C';
  document.getElementById('weather-desc').textContent = getWeatherDesc(cur.weather_code);
  document.getElementById('weather-card').classList.add('show');

  document.getElementById('details-grid').innerHTML = `
    <div class="detail-card"><div class="detail-val">${Math.round(cur.apparent_temperature)}°C</div><div class="detail-key">resimțită</div></div>
    <div class="detail-card"><div class="detail-val">${cur.relative_humidity_2m}%</div><div class="detail-key">umiditate</div></div>
    <div class="detail-card"><div class="detail-val">${Math.round(cur.wind_speed_10m)} km/h</div><div class="detail-key">vânt</div></div>
  `;

  const days = data.daily.time;
  const forecastHtml = days.map((date, i) => {
    const d = new Date(date);
    const dayName = d.toLocaleDateString('ro-RO', { weekday: 'short' });
    return `
      <div class="forecast-day">
        <div class="forecast-date">${dayName}</div>
        <div class="forecast-icon">${getWeatherIcon(data.daily.weather_code[i])}</div>
        <div class="forecast-temps">${Math.round(data.daily.temperature_2m_max[i])}° / ${Math.round(data.daily.temperature_2m_min[i])}°</div>
      </div>
    `;
  }).join('');
  document.getElementById('forecast-row').innerHTML = forecastHtml;
}

searchCity();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Vreme curentă</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
