<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diff Text — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #60a0f0;
  --accent-dim: rgba(96,160,240,0.10);
  --accent-border: rgba(96,160,240,0.28);
}

.mode-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); align-items: center; }
.mode-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.mode-btn.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }

.inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--content-gap); margin-bottom: var(--content-gap); }
@media (max-width: 700px) { .inputs-grid { grid-template-columns: 1fr; } }

.big-textarea {
  width: 100%;
  min-height: 160px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--text);
  outline: none;
  resize: vertical;
  line-height: 1.6;
}
.big-textarea:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-dim); }

.area-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.area-name { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: var(--content-gap); }
@media (max-width: 500px) { .stats-row { grid-template-columns: 1fr; } }
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.stat-val { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 600; }
.stat-val.added { color: #4af0b0; }
.stat-val.removed { color: #f06060; }
.stat-val.unchanged { color: var(--text2); }
.stat-key { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

.diff-output {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.82rem;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 500px;
  overflow-y: auto;
}
.diff-line { display: block; padding: 1px 6px; border-radius: 3px; }
.diff-added { background: rgba(74,240,176,0.1); color: #4af0b0; }
.diff-removed { background: rgba(240,96,96,0.1); color: #f06060; text-decoration: line-through; text-decoration-thickness: 1px; }
.diff-unchanged { color: var(--text2); }
.diff-marker { opacity: 0.6; margin-right: 6px; user-select: none; }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Diff text</h1>
    <p>Compară două blocuri de text, evidențiază diferențele</p>
  </div>

  <!-- Mod -->
  <div class="mode-row">
    <button class="mode-btn active" id="btn-lines" onclick="setMode('lines')">Pe linii</button>
    <button class="mode-btn" id="btn-words" onclick="setMode('words')">Pe cuvinte</button>
  </div>

  <!-- Input-uri -->
  <div class="inputs-grid">
    <div>
      <div class="area-label"><span class="area-name">Text original (A)</span></div>
      <textarea class="big-textarea" id="text-a" oninput="compute()">linia unu
linia doi
linia trei
linia patru</textarea>
    </div>
    <div>
      <div class="area-label"><span class="area-name">Text modificat (B)</span></div>
      <textarea class="big-textarea" id="text-b" oninput="compute()">linia unu
linia doi modificată
linia trei
linia cinci</textarea>
    </div>
  </div>

  <!-- Statistici -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val added" id="stat-added">—</div><div class="stat-key">adăugat</div></div>
    <div class="stat-card"><div class="stat-val removed" id="stat-removed">—</div><div class="stat-key">șters</div></div>
    <div class="stat-card"><div class="stat-val unchanged" id="stat-unchanged">—</div><div class="stat-key">neschimbat</div></div>
  </div>

  <!-- Rezultat diff -->
  <div class="diff-output" id="diff-output"></div>

</div>

<div class="toast" id="toast">
</div>

<script>
let mode = 'lines';

function setMode(m) {
  mode = m;
  document.getElementById('btn-lines').classList.toggle('active', m === 'lines');
  document.getElementById('btn-words').classList.toggle('active', m === 'words');
  compute();
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Algoritm LCS (Longest Common Subsequence) pentru diff — clasic, O(n*m)
function computeDiff(a, b) {
  const n = a.length, m = b.length;
  const dp = Array.from({length: n+1}, () => new Array(m+1).fill(0));

  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      if (a[i-1] === b[j-1]) dp[i][j] = dp[i-1][j-1] + 1;
      else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }

  const result = [];
  let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
      result.unshift({ type: 'unchanged', value: a[i-1] });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
      result.unshift({ type: 'added', value: b[j-1] });
      j--;
    } else {
      result.unshift({ type: 'removed', value: a[i-1] });
      i--;
    }
  }
  return result;
}

function compute() {
  const textA = document.getElementById('text-a').value;
  const textB = document.getElementById('text-b').value;

  const unitsA = mode === 'lines' ? textA.split('\n') : textA.split(/(\s+)/).filter(x => x !== '');
  const unitsB = mode === 'lines' ? textB.split('\n') : textB.split(/(\s+)/).filter(x => x !== '');

  // Protecție: LCS e O(n×m) — peste ~3000×3000 unități ar bloca browserul
  if (unitsA.length * unitsB.length > 9000000) {
    document.getElementById('diff-output').innerHTML =
      '<span style="color:#f06060">Text prea mare pentru comparație live (peste ~3000 linii/cuvinte per parte). Încearcă un fragment mai mic.</span>';
    document.getElementById('stat-added').textContent = '—';
    document.getElementById('stat-removed').textContent = '—';
    document.getElementById('stat-unchanged').textContent = '—';
    return;
  }

  const diff = computeDiff(unitsA, unitsB);

  let added = 0, removed = 0, unchanged = 0;
  let html = '';

  diff.forEach(d => {
    if (d.type === 'added') added++;
    else if (d.type === 'removed') removed++;
    else unchanged++;

    const cls = d.type === 'added' ? 'diff-added' : d.type === 'removed' ? 'diff-removed' : 'diff-unchanged';
    const marker = d.type === 'added' ? '+' : d.type === 'removed' ? '−' : ' ';

    if (mode === 'lines') {
      html += `<span class="diff-line ${cls}"><span class="diff-marker">${marker}</span>${escapeHtml(d.value) || '&nbsp;'}</span>\n`;
    } else {
      const displayVal = d.value.trim() === '' ? d.value : escapeHtml(d.value);
      html += `<span class="${cls}">${displayVal}</span>`;
    }
  });

  document.getElementById('diff-output').innerHTML = html || '<span style="color:var(--text3)">Introdu text în ambele câmpuri</span>';
  document.getElementById('stat-added').textContent = added;
  document.getElementById('stat-removed').textContent = removed;
  document.getElementById('stat-unchanged').textContent = unchanged;
}

compute();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Diff text</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
