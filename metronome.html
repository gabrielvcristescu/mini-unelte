<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metronom — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #d070f0;
  --accent-dim: rgba(208,112,240,0.10);
  --accent-border: rgba(208,112,240,0.28);
}

.bpm-display { text-align: center; margin-bottom: var(--content-gap); }
.bpm-val { font-family: var(--font-mono); font-size: 3.5rem; font-weight: 700; color: var(--accent); line-height: 1; }
.bpm-label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text3); margin-top: 4px; }

.bpm-controls { display: flex; align-items: center; gap: 12px; margin-bottom: var(--content-gap); }
.bpm-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  font-size: 1.2rem;
  cursor: pointer;
  transition: all 0.12s;
  flex-shrink: 0;
}
.bpm-btn:hover { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
.bpm-controls input[type=range] { flex: 1; accent-color: var(--accent); }

.visual-pulse {
  width: 100%;
  height: 80px;
  border-radius: var(--radius);
  background: var(--bg2);
  border: 1px solid var(--border);
  margin-bottom: var(--content-gap);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.05s;
}
.visual-pulse.beat { background: var(--accent-dim); border-color: var(--accent-border); }
.pulse-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--border2); transition: background 0.05s, transform 0.05s; }
.pulse-dot.active { background: var(--accent); transform: scale(1.3); }

.beats-row { display: flex; gap: 6px; justify-content: center; margin-bottom: var(--content-gap); }
.beat-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  transition: all 0.05s;
}
.beat-dot.active { background: var(--accent); border-color: var(--accent); transform: scale(1.2); }
.beat-dot.accent { border-color: var(--accent-border); }

.time-sig-row { display: flex; gap: 6px; justify-content: center; margin-bottom: var(--content-gap); }
.sig-btn {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 5px 12px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
}
.sig-btn.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }

.play-btn {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 0.9rem;
  font-weight: 600;
  padding: 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  cursor: pointer;
  transition: all 0.12s;
  margin-bottom: var(--content-gap);
}
.play-btn.playing { background: rgba(240,96,96,0.15); border-color: rgba(240,96,96,0.4); color: #f06060; }

.preset-row { display: flex; gap: 6px; flex-wrap: wrap; }
.preset-btn {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  padding: 5px 12px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
}
.preset-btn:hover { border-color: var(--accent-border); color: var(--accent); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Metronom</h1>
    <p>BPM configurabil, click sonor și vizual, accent pe timpul 1</p>
  </div>

  <div class="bpm-display">
    <div class="bpm-val" id="bpm-val">120</div>
    <div class="bpm-label">BPM</div>
  </div>

  <div class="bpm-controls">
    <button class="bpm-btn" onclick="adjustBpm(-1)">−</button>
    <input type="range" id="s-bpm" min="30" max="300" value="120" oninput="onBpmChange()">
    <button class="bpm-btn" onclick="adjustBpm(1)">+</button>
  </div>

  <div class="time-sig-row" id="time-sig-row"></div>

  <div class="visual-pulse" id="visual-pulse">
    <div class="pulse-dot" id="pulse-dot"></div>
  </div>

  <div class="beats-row" id="beats-row"></div>

  <button class="play-btn" id="play-btn" onclick="togglePlay()">▶ Start</button>

  <div class="preset-row" id="preset-row"></div>
</div>

<script>
const PRESETS = [
  { name: 'Largo (50)', bpm: 50 },
  { name: 'Andante (90)', bpm: 90 },
  { name: 'Moderato (110)', bpm: 110 },
  { name: 'Allegro (130)', bpm: 130 },
  { name: 'Presto (180)', bpm: 180 },
];

const TIME_SIGS = [2, 3, 4, 6];

let audioCtx = null;
let bpm = 120;
let timeSig = 4;
let isPlaying = false;
let currentBeat = 0;
let schedulerTimer = null;
let nextNoteTime = 0;

function buildTimeSigRow() {
  const wrap = document.getElementById('time-sig-row');
  TIME_SIGS.forEach(sig => {
    const btn = document.createElement('div');
    btn.className = 'sig-btn' + (sig===timeSig?' active':'');
    btn.textContent = sig + '/4';
    btn.onclick = () => {
      timeSig = sig;
      document.querySelectorAll('.sig-btn').forEach((b,i) => b.classList.toggle('active', TIME_SIGS[i]===sig));
      buildBeatsRow();
      currentBeat = 0;
    };
    wrap.appendChild(btn);
  });
}

function buildBeatsRow() {
  const wrap = document.getElementById('beats-row');
  wrap.innerHTML = '';
  for (let i = 0; i < timeSig; i++) {
    const dot = document.createElement('div');
    dot.className = 'beat-dot' + (i===0 ? ' accent' : '');
    wrap.appendChild(dot);
  }
}

function buildPresets() {
  const wrap = document.getElementById('preset-row');
  PRESETS.forEach(p => {
    const btn = document.createElement('div');
    btn.className = 'preset-btn';
    btn.textContent = p.name;
    btn.onclick = () => {
      bpm = p.bpm;
      document.getElementById('s-bpm').value = bpm;
      updateBpmDisplay();
    };
    wrap.appendChild(btn);
  });
}

function updateBpmDisplay() {
  document.getElementById('bpm-val').textContent = bpm;
}

function onBpmChange() {
  bpm = parseInt(document.getElementById('s-bpm').value);
  updateBpmDisplay();
}

function adjustBpm(delta) {
  bpm = Math.max(30, Math.min(300, bpm + delta));
  document.getElementById('s-bpm').value = bpm;
  updateBpmDisplay();
}

function playClick(isAccent) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = isAccent ? 1200 : 800;
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

function scheduler() {
  while (nextNoteTime < audioCtx.currentTime + 0.1) {
    const beatToPlay = currentBeat;
    const timeToPlay = nextNoteTime;

    playClick(beatToPlay === 0);

    // Programăm actualizarea vizuală sincronizată cu momentul exact al sunetului
    const delay = Math.max(0, (timeToPlay - audioCtx.currentTime) * 1000);
    setTimeout(() => flashBeat(beatToPlay), delay);

    nextNoteTime += 60 / bpm;
    currentBeat = (currentBeat + 1) % timeSig;
  }
  schedulerTimer = setTimeout(scheduler, 25);
}

function flashBeat(beatIndex) {
  const dots = document.querySelectorAll('.beat-dot');
  dots.forEach((d,i) => d.classList.toggle('active', i===beatIndex));

  const pulseDot = document.getElementById('pulse-dot');
  const visualPulse = document.getElementById('visual-pulse');
  pulseDot.classList.add('active');
  if (beatIndex === 0) visualPulse.classList.add('beat');
  setTimeout(() => {
    pulseDot.classList.remove('active');
    visualPulse.classList.remove('beat');
  }, 100);
}

function togglePlay() {
  if (isPlaying) stopMetronome(); else startMetronome();
}

function startMetronome() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  currentBeat = 0;
  nextNoteTime = audioCtx.currentTime + 0.05;
  scheduler();

  isPlaying = true;
  const btn = document.getElementById('play-btn');
  btn.textContent = '■ Stop';
  btn.classList.add('playing');
}

function stopMetronome() {
  clearTimeout(schedulerTimer);
  isPlaying = false;
  const btn = document.getElementById('play-btn');
  btn.textContent = '▶ Start';
  btn.classList.remove('playing');
  document.querySelectorAll('.beat-dot').forEach(d => d.classList.remove('active'));
}

buildTimeSigRow();
buildBeatsRow();
buildPresets();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Metronom</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
