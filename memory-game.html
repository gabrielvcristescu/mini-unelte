<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Game — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #f0a040;
  --accent-dim: rgba(240,160,64,0.10);
  --accent-border: rgba(240,160,64,0.28);
}

.diff-row { display: flex; gap: 8px; margin-bottom: var(--content-gap); }
.diff-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.diff-btn.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }

.stats-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--content-gap);
  font-family: var(--font-mono);
  font-size: 0.78rem;
}
.stat-item { display: flex; gap: 6px; align-items: center; }
.stat-label { color: var(--text3); }
.stat-val { color: var(--accent); font-weight: 700; }

.memory-grid {
  display: grid;
  gap: 8px;
  margin: 0 auto var(--content-gap);
}
.memory-grid.g4 { grid-template-columns: repeat(4, 1fr); max-width: 420px; }
.memory-grid.g6 { grid-template-columns: repeat(6, 1fr); max-width: 520px; }

.memory-card {
  aspect-ratio: 1;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.1rem;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, border-color 0.15s;
  user-select: none;
}
.memory-card:hover:not(.flipped):not(.matched) { border-color: var(--accent-border); }
.memory-card.flipped { background: var(--accent-dim); border-color: var(--accent-border); transform: scale(1.03); }
.memory-card.matched { background: rgba(74,240,176,0.1); border-color: rgba(74,240,176,0.3); opacity: 0.6; cursor: default; }
.memory-card.hidden-icon { color: transparent; }

.memory-grid.g6 .memory-card { font-size: 1.7rem; }

.win-card {
  background: var(--bg2);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius);
  padding: 30px 24px;
  text-align: center;
  display: none;
}
.win-card.show { display: block; }
.win-title { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 700; color: var(--accent); }
.win-stats { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text3); margin-top: 8px; }
.restart-btn {
  margin-top: 16px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  cursor: pointer;
}
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Memory Game</h1>
    <p>Găsește toate perechile — cronometrat</p>
  </div>

  <div class="diff-row">
    <button class="diff-btn active" id="diff-easy" onclick="setDifficulty('easy')">Ușor (4×4)</button>
    <button class="diff-btn" id="diff-hard" onclick="setDifficulty('hard')">Greu (6×6)</button>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><span class="stat-label">Timp</span> <span class="stat-val" id="stat-time">0:00</span></div>
    <div class="stat-item"><span class="stat-label">Mutări</span> <span class="stat-val" id="stat-moves">0</span></div>
    <div class="stat-item"><span class="stat-label">Perechi</span> <span class="stat-val" id="stat-pairs">0</span>/<span id="stat-total">8</span></div>
  </div>

  <div class="memory-grid g4" id="memory-grid"></div>

  <div class="win-card" id="win-card">
    <div class="win-title">🎉 Felicitări!</div>
    <div class="win-stats" id="win-stats"></div>
    <button class="restart-btn" onclick="startGame()">Joacă din nou</button>
  </div>
</div>

<script>
const ICONS = ['🎯','🎨','🎭','🎪','🎢','🎡','🎳','🎮','🎸','🎺','🎻','🎹','⚽','🏀','🏈','⚾','🎾','🏐','🏓','🏸'];

let difficulty = 'easy';
let cards = [];
let flipped = [];
let matched = [];
let moves = 0;
let timerInterval = null;
let seconds = 0;
let locked = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function setDifficulty(d) {
  difficulty = d;
  document.getElementById('diff-easy').classList.toggle('active', d==='easy');
  document.getElementById('diff-hard').classList.toggle('active', d==='hard');
  startGame();
}

function startGame() {
  clearInterval(timerInterval);
  seconds = 0;
  moves = 0;
  matched = [];
  flipped = [];
  locked = false;

  const pairCount = difficulty === 'easy' ? 8 : 18;
  const gridClass = difficulty === 'easy' ? 'g4' : 'g6';
  document.getElementById('memory-grid').className = 'memory-grid ' + gridClass;
  document.getElementById('stat-total').textContent = pairCount;

  const chosenIcons = shuffle(ICONS).slice(0, pairCount);
  cards = shuffle([...chosenIcons, ...chosenIcons]).map((icon, i) => ({ id: i, icon }));

  document.getElementById('win-card').classList.remove('show');
  updateStats();
  renderGrid();

  timerInterval = setInterval(() => {
    seconds++;
    updateTimeDisplay();
  }, 1000);
}

function renderGrid() {
  const grid = document.getElementById('memory-grid');
  grid.innerHTML = '';
  cards.forEach(card => {
    const el = document.createElement('div');
    el.className = 'memory-card hidden-icon';
    el.textContent = card.icon;
    el.dataset.id = card.id;
    el.onclick = () => flipCard(card.id, el);
    grid.appendChild(el);
  });
}

function flipCard(id, el) {
  if (locked) return;
  if (flipped.some(f => f.id === id)) return;
  if (matched.includes(id)) return;

  el.classList.remove('hidden-icon');
  el.classList.add('flipped');
  flipped.push({ id, el, icon: cards.find(c=>c.id===id).icon });

  if (flipped.length === 2) {
    moves++;
    updateStats();
    locked = true;

    if (flipped[0].icon === flipped[1].icon) {
      flipped.forEach(f => {
        f.el.classList.remove('flipped');
        f.el.classList.add('matched');
      });
      matched.push(flipped[0].id, flipped[1].id);
      flipped = [];
      locked = false;
      updateStats();

      if (matched.length === cards.length) {
        endGame();
      }
    } else {
      setTimeout(() => {
        flipped.forEach(f => {
          f.el.classList.remove('flipped');
          f.el.classList.add('hidden-icon');
        });
        flipped = [];
        locked = false;
      }, 800);
    }
  }
}

function updateStats() {
  document.getElementById('stat-moves').textContent = moves;
  document.getElementById('stat-pairs').textContent = matched.length / 2;
}

function updateTimeDisplay() {
  const m = Math.floor(seconds/60);
  const s = seconds%60;
  document.getElementById('stat-time').textContent = `${m}:${String(s).padStart(2,'0')}`;
}

function endGame() {
  clearInterval(timerInterval);
  document.getElementById('win-stats').textContent = `${moves} mutări · ${document.getElementById('stat-time').textContent} timp`;
  document.getElementById('win-card').classList.add('show');
}

startGame();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Memory game</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
