<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghicește Capitala — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #f0a040;
  --accent-dim: rgba(240,160,64,0.10);
  --accent-border: rgba(240,160,64,0.28);
}

.score-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--content-gap);
  font-family: var(--font-mono);
  font-size: 0.78rem;
}
.score-item { display: flex; gap: 6px; align-items: center; }
.score-label { color: var(--text3); }
.score-val { color: var(--accent); font-weight: 700; }

.question-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 24px;
  text-align: center;
  margin-bottom: var(--content-gap);
}
.question-label { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.question-country { font-family: var(--font-sans); font-size: 1.7rem; font-weight: 700; color: var(--text); }

.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: var(--content-gap); }
@media (max-width: 500px) { .options-grid { grid-template-columns: 1fr; } }
.option-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
}
.option-btn:hover:not(:disabled) { border-color: var(--accent-border); background: var(--accent-dim); }
.option-btn:disabled { cursor: default; }
.option-btn.correct { border-color: #4af0b0; background: rgba(74,240,176,0.12); color: #4af0b0; }
.option-btn.wrong { border-color: #f06060; background: rgba(240,96,96,0.12); color: #f06060; }

.next-btn {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
  padding: 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  cursor: pointer;
  transition: all 0.12s;
  display: none;
}
.next-btn.show { display: block; }
.next-btn:hover { filter: brightness(1.15); }

.final-card {
  background: var(--bg2);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius);
  padding: 30px 24px;
  text-align: center;
  display: none;
}
.final-card.show { display: block; }
.final-score { font-family: var(--font-mono); font-size: 2.2rem; font-weight: 700; color: var(--accent); }
.final-label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text3); margin-top: 6px; }
.restart-btn {
  margin-top: 16px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  cursor: pointer;
}
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Ghicește capitala</h1>
    <p>Quiz geografie — 10 întrebări, date locale</p>
  </div>

  <div class="score-bar">
    <div class="score-item"><span class="score-label">Întrebare</span> <span class="score-val" id="q-num">1</span><span class="score-label">/10</span></div>
    <div class="score-item"><span class="score-label">Scor</span> <span class="score-val" id="score-val">0</span></div>
  </div>

  <div id="quiz-area">
    <div class="question-card">
      <div class="question-label">Care este capitala...</div>
      <div class="question-country" id="question-country">—</div>
    </div>

    <div class="options-grid" id="options-grid"></div>

    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Următoarea întrebare →</button>
  </div>

  <div class="final-card" id="final-card">
    <div class="final-score" id="final-score">—</div>
    <div class="final-label">răspunsuri corecte din 10</div>
    <button class="restart-btn" onclick="startQuiz()">Joacă din nou</button>
  </div>
</div>

<script>
const COUNTRIES = [
  { country: 'România', capital: 'București' },
  { country: 'Franța', capital: 'Paris' },
  { country: 'Germania', capital: 'Berlin' },
  { country: 'Italia', capital: 'Roma' },
  { country: 'Spania', capital: 'Madrid' },
  { country: 'Portugalia', capital: 'Lisabona' },
  { country: 'Grecia', capital: 'Atena' },
  { country: 'Polonia', capital: 'Varșovia' },
  { country: 'Ungaria', capital: 'Budapesta' },
  { country: 'Bulgaria', capital: 'Sofia' },
  { country: 'Cehia', capital: 'Praga' },
  { country: 'Slovacia', capital: 'Bratislava' },
  { country: 'Austria', capital: 'Viena' },
  { country: 'Olanda', capital: 'Amsterdam' },
  { country: 'Belgia', capital: 'Bruxelles' },
  { country: 'Elveția', capital: 'Berna' },
  { country: 'Suedia', capital: 'Stockholm' },
  { country: 'Norvegia', capital: 'Oslo' },
  { country: 'Danemarca', capital: 'Copenhaga' },
  { country: 'Finlanda', capital: 'Helsinki' },
  { country: 'Marea Britanie', capital: 'Londra' },
  { country: 'Irlanda', capital: 'Dublin' },
  { country: 'Rusia', capital: 'Moscova' },
  { country: 'Ucraina', capital: 'Kiev' },
  { country: 'Turcia', capital: 'Ankara' },
  { country: 'Japonia', capital: 'Tokyo' },
  { country: 'China', capital: 'Beijing' },
  { country: 'India', capital: 'New Delhi' },
  { country: 'Coreea de Sud', capital: 'Seul' },
  { country: 'Australia', capital: 'Canberra' },
  { country: 'Canada', capital: 'Ottawa' },
  { country: 'Statele Unite', capital: 'Washington D.C.' },
  { country: 'Brazilia', capital: 'Brasília' },
  { country: 'Argentina', capital: 'Buenos Aires' },
  { country: 'Mexic', capital: 'Ciudad de México' },
  { country: 'Egipt', capital: 'Cairo' },
  { country: 'Africa de Sud', capital: 'Pretoria' },
  { country: 'Maroc', capital: 'Rabat' },
  { country: 'Israel', capital: 'Ierusalim' },
  { country: 'Serbia', capital: 'Belgrad' },
];

let quizOrder = [];
let currentQ = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startQuiz() {
  quizOrder = shuffle(COUNTRIES).slice(0, 10);
  currentQ = 0;
  score = 0;
  document.getElementById('final-card').classList.remove('show');
  document.getElementById('quiz-area').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = quizOrder[currentQ];
  document.getElementById('q-num').textContent = currentQ+1;
  document.getElementById('score-val').textContent = score;
  document.getElementById('question-country').textContent = q.country;
  document.getElementById('next-btn').classList.remove('show');

  // Generăm 3 opțiuni greșite din restul listei
  const wrongPool = COUNTRIES.filter(c => c.capital !== q.capital);
  const wrongs = shuffle(wrongPool).slice(0,3).map(c => c.capital);
  const options = shuffle([q.capital, ...wrongs]);

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(btn, opt, q.capital);
    grid.appendChild(btn);
  });
}

function selectAnswer(btn, selected, correct) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });

  if (selected === correct) score++;
  document.getElementById('score-val').textContent = score;
  document.getElementById('next-btn').classList.add('show');
  document.getElementById('next-btn').textContent = currentQ < 9 ? 'Următoarea întrebare →' : 'Vezi rezultatul final →';
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= 10) {
    showFinal();
  } else {
    renderQuestion();
  }
}

function showFinal() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('final-score').textContent = score + '/10';
  document.getElementById('final-card').classList.add('show');
}

startQuiz();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Ghicește capitala</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
