<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabel Adevăr Logic — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #c080f0;
  --accent-dim: rgba(224,112,160,0.10);
  --accent-border: rgba(224,112,160,0.28);
}

.field-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: var(--content-gap);
}
.field-name { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text2); font-weight: 500; margin-bottom: 8px; display: block; }
.expr-input { width: 100%; font-family: var(--font-mono); font-size: 1.1rem !important; }

.legend-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: var(--content-gap); font-family: var(--font-mono); font-size: 0.68rem; color: var(--text3); }
.legend-item { background: var(--bg3); padding: 3px 9px; border-radius: 5px; }

.error-msg {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: #f06060;
  background: rgba(240,96,96,0.06);
  border: 1px solid rgba(240,96,96,0.2);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: var(--content-gap);
  display: none;
}
.error-msg.show { display: block; }

.truth-table-wrap { overflow-x: auto; }
.truth-table { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.82rem; width: 100%; }
.truth-table th {
  background: var(--bg3);
  padding: 8px 14px;
  text-align: center;
  font-weight: 700;
  border-bottom: 2px solid var(--border2);
  white-space: nowrap;
}
.truth-table th.result-col { color: var(--accent); }
.truth-table td { padding: 6px 14px; text-align: center; border-bottom: 1px solid rgba(128,128,128,0.06); }
.truth-table td.val-true { color: #4af0b0; }
.truth-table td.val-false { color: #f06060; }
.truth-table tr:hover td { background: var(--bg3); }

.preset-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--content-gap); }
.preset-btn {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  padding: 5px 12px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
}
.preset-btn:hover { border-color: var(--accent-border); color: var(--accent); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Tabel adevăr logic</h1>
    <p>Expresie booleană → toate combinațiile posibile, evaluate automat</p>
  </div>

  <div class="field-card">
    <span class="field-name">Expresie (variabile: A, B, C, D — max 4)</span>
    <input class="input-calc expr-input" id="in-expr" type="text" value="(A AND B) OR NOT C"
           style="--input-color:var(--accent)" oninput="render()">
  </div>

  <div class="legend-row">
    <span class="legend-item">AND / &&</span>
    <span class="legend-item">OR / ||</span>
    <span class="legend-item">NOT / !</span>
    <span class="legend-item">XOR</span>
    <span class="legend-item">( )</span>
  </div>

  <div class="preset-row" id="preset-row"></div>

  <div class="error-msg" id="error-msg"></div>

  <div class="truth-table-wrap">
    <table class="truth-table" id="truth-table"></table>
  </div>
</div>

<script>
const PRESETS = [
  { name: 'AND', expr: 'A AND B' },
  { name: 'OR', expr: 'A OR B' },
  { name: 'NOT', expr: 'NOT A' },
  { name: 'XOR', expr: 'A XOR B' },
  { name: 'NAND', expr: 'NOT (A AND B)' },
  { name: 'NOR', expr: 'NOT (A OR B)' },
  { name: 'Implicație (A→B)', expr: 'NOT A OR B' },
  { name: 'Full adder (sumă)', expr: 'A XOR B XOR C' },
];

function buildPresets() {
  const wrap = document.getElementById('preset-row');
  PRESETS.forEach(p => {
    const btn = document.createElement('div');
    btn.className = 'preset-btn';
    btn.textContent = p.name;
    btn.onclick = () => {
      document.getElementById('in-expr').value = p.expr;
      render();
    };
    wrap.appendChild(btn);
  });
}

// Normalizăm expresia: cuvinte cheie și simboluri → operatori JS
function normalizeExpr(expr) {
  return expr
    .replace(/\bAND\b/gi, '&&')
    .replace(/\bOR\b/gi, '||')
    .replace(/\bNOT\b/gi, '!')
    .replace(/\bXOR\b/gi, '!==') // tratat special mai jos, XOR pe boolean = !==
    ;
}

function extractVariables(expr) {
  const matches = expr.toUpperCase().match(/\b[A-D]\b/g) || [];
  return [...new Set(matches)].sort();
}

function evaluateExpr(expr, values) {
  // Înlocuim variabilele cu valorile lor (true/false) — folosim word boundary ca să nu afectăm AND/OR/NOT
  let jsExpr = normalizeExpr(expr);
  Object.entries(values).forEach(([varName, val]) => {
    jsExpr = jsExpr.replace(new RegExp(`\\b${varName}\\b`, 'g'), val ? 'true' : 'false');
  });

  // eslint-disable-next-line no-new-func
  return Function(`"use strict"; return (${jsExpr});`)();
}

function render() {
  const exprRaw = document.getElementById('in-expr').value;
  const errorEl = document.getElementById('error-msg');
  const tableEl = document.getElementById('truth-table');

  if (!exprRaw.trim()) {
    tableEl.innerHTML = '';
    errorEl.classList.remove('show');
    return;
  }

  const variables = extractVariables(exprRaw);

  if (variables.length === 0) {
    errorEl.textContent = 'Nicio variabilă găsită (folosește A, B, C sau D)';
    errorEl.classList.add('show');
    tableEl.innerHTML = '';
    return;
  }
  if (variables.length > 4) {
    errorEl.textContent = 'Maxim 4 variabile suportate (2⁴=16 rânduri)';
    errorEl.classList.add('show');
    tableEl.innerHTML = '';
    return;
  }

  const rows = [];
  const combos = Math.pow(2, variables.length);
  let hasError = false;

  for (let i = 0; i < combos; i++) {
    const values = {};
    variables.forEach((v, idx) => {
      values[v] = !!((i >> (variables.length-1-idx)) & 1);
    });

    let result;
    try {
      result = evaluateExpr(exprRaw, values);
    } catch (err) {
      hasError = true;
      errorEl.textContent = 'Expresie invalidă: ' + err.message;
      errorEl.classList.add('show');
      break;
    }

    rows.push({ values, result });
  }

  if (hasError) { tableEl.innerHTML = ''; return; }
  errorEl.classList.remove('show');

  let html = '<thead><tr>';
  variables.forEach(v => html += `<th>${v}</th>`);
  html += `<th class="result-col">Rezultat</th></tr></thead><tbody>`;

  rows.forEach(row => {
    html += '<tr>';
    variables.forEach(v => {
      html += `<td class="${row.values[v]?'val-true':'val-false'}">${row.values[v]?'1':'0'}</td>`;
    });
    html += `<td class="${row.result?'val-true':'val-false'}">${row.result?'1':'0'}</td></tr>`;
  });
  html += '</tbody>';

  tableEl.innerHTML = html;
}

buildPresets();
render();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Tabel adevăr logic</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
