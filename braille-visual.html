<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Braille Vizual — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #e070a0;
  --accent-dim: rgba(96,192,208,0.10);
  --accent-border: rgba(96,192,208,0.28);
}

.big-textarea {
  width: 100%;
  min-height: 90px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.95rem;
  color: var(--text);
  outline: none;
  resize: vertical;
  margin-bottom: var(--content-gap);
}
.big-textarea:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-dim); }

.braille-output {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: var(--content-gap);
  min-height: 100px;
}

.braille-cell-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.braille-cell {
  display: inline-grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 3px;
  padding: 6px;
  background: var(--bg3);
  border-radius: 6px;
}
.braille-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--border2);
}
.braille-dot.on { background: var(--accent); }
.braille-cell-letter { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text3); }

.big-unicode-row {
  font-size: 2.2rem;
  line-height: 1.4;
  word-break: break-all;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: var(--content-gap);
  color: var(--accent);
}

.action-row { display: flex; gap: 8px; }
.action-btn {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 600;
  padding: 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  background: var(--accent-dim);
  color: var(--accent);
  cursor: pointer;
}
.action-btn:hover { filter: brightness(1.15); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Braille vizual</h1>
    <p>Text → celule Braille desenate, plus caractere Unicode Braille</p>
  </div>

  <textarea class="big-textarea" id="in-text" oninput="render()" placeholder="Scrie text aici...">MINI UNELTE 2026</textarea>

  <div class="braille-output" id="braille-output"></div>

  <div class="area-label" style="margin-bottom:6px">
    <span style="font-family:var(--font-mono);font-size:0.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em">Caractere Unicode Braille</span>
  </div>
  <div class="big-unicode-row" id="unicode-output"></div>

  <div class="action-row">
    <button class="action-btn" onclick="copyUnicode()">Copiază Unicode Braille</button>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
// Puncte Braille per literă (grad 1, standard englez) — poziții 1-6:
// 1 4
// 2 5
// 3 6
const BRAILLE_DOTS = {
  A:[1], B:[1,2], C:[1,4], D:[1,4,5], E:[1,5], F:[1,2,4], G:[1,2,4,5], H:[1,2,5],
  I:[2,4], J:[2,4,5], K:[1,3], L:[1,2,3], M:[1,3,4], N:[1,3,4,5], O:[1,3,5],
  P:[1,2,3,4], Q:[1,2,3,4,5], R:[1,2,3,5], S:[2,3,4], T:[2,3,4,5],
  U:[1,3,6], V:[1,2,3,6], W:[2,4,5,6], X:[1,3,4,6], Y:[1,3,4,5,6], Z:[1,3,5,6],
  '0':[2,4,5], '1':[1], '2':[1,2], '3':[1,4], '4':[1,4,5], '5':[1,5],
  '6':[1,2,4], '7':[1,2,4,5], '8':[1,2,5], '9':[2,4],
  ' ':[],
};

// Caractere Unicode Braille (U+2800 + bitmask din punctele active)
// Bit 0=punct1, 1=punct2, 2=punct3, 3=punct4, 4=punct5, 5=punct6
function dotsToUnicode(dots) {
  let code = 0x2800;
  dots.forEach(d => { code |= (1 << (d-1)); });
  return String.fromCodePoint(code);
}

function renderCell(letter) {
  const dots = BRAILLE_DOTS[letter.toUpperCase()] || [];
  const order = [1,4,2,5,3,6];
  const dotsHtml = order.map(pos => `<div class="braille-dot ${dots.includes(pos)?'on':''}"></div>`).join('');
  return `
    <div class="braille-cell-group">
      <div class="braille-cell">${dotsHtml}</div>
      <div class="braille-cell-letter">${letter === ' ' ? '␣' : letter.toUpperCase()}</div>
    </div>
  `;
}

function render() {
  const text = document.getElementById('in-text').value;
  const output = document.getElementById('braille-output');
  const unicodeOutput = document.getElementById('unicode-output');

  if (!text) {
    output.innerHTML = '';
    unicodeOutput.textContent = '';
    return;
  }

  output.innerHTML = [...text].map(ch => {
    if (!(ch.toUpperCase() in BRAILLE_DOTS)) return '';
    return renderCell(ch);
  }).join('');

  unicodeOutput.textContent = [...text].map(ch => {
    const dots = BRAILLE_DOTS[ch.toUpperCase()];
    if (dots === undefined) return ch; // caractere necunoscute rămân neschimbate
    return dotsToUnicode(dots);
  }).join('');
}

function copyUnicode() {
  const val = document.getElementById('unicode-output').textContent;
  if (!val) return;
  navigator.clipboard.writeText(val).then(() => showToast('Copiat!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

render();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Braille vizual</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
