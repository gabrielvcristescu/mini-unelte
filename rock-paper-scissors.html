<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piatră-Hârtie-Foarfecă — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #f0a040;
  --accent-dim: rgba(240,160,64,0.10);
  --accent-border: rgba(240,160,64,0.28);
}

.stats-bar {
  display: flex;
  justify-content: space-around;
  margin-bottom: var(--content-gap);
  font-family: var(--font-mono);
}
.stat-item { text-align: center; }
.stat-val { font-size: 1.4rem; font-weight: 700; }
.stat-val.win { color: #4af0b0; }
.stat-val.loss { color: #f06060; }
.stat-val.tie { color: var(--text3); }
.stat-key { font-size: 0.6rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }

.arena {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px 20px;
  margin-bottom: var(--content-gap);
}
.player-box { text-align: center; }
.player-label { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.player-choice { font-size: 4rem; line-height: 1; }
.vs-label { font-family: var(--font-mono); font-size: 0.9rem; color: var(--text3); font-weight: 700; }

.result-msg {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: var(--content-gap);
  min-height: 1.5em;
}
.result-msg.win { color: #4af0b0; }
.result-msg.loss { color: #f06060; }
.result-msg.tie { color: var(--text3); }

.choices-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: var(--content-gap); }
.choice-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  font-size: 2.5rem;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.choice-btn:hover { border-color: var(--accent-border); background: var(--accent-dim); transform: translateY(-2px); }
.choice-btn:active { transform: translateY(0); }

.history-list { display: flex; gap: 5px; flex-wrap: wrap; }
.history-chip {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  border: 2px solid;
}
.history-chip.win { border-color: #4af0b0; background: rgba(74,240,176,0.1); }
.history-chip.loss { border-color: #f06060; background: rgba(240,96,96,0.1); }
.history-chip.tie { border-color: var(--text3); background: var(--bg3); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Piatră-Hârtie-Foarfecă</h1>
    <p>Versus calculator, cu statistici</p>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><div class="stat-val win" id="stat-wins">0</div><div class="stat-key">victorii</div></div>
    <div class="stat-item"><div class="stat-val loss" id="stat-losses">0</div><div class="stat-key">înfrângeri</div></div>
    <div class="stat-item"><div class="stat-val tie" id="stat-ties">0</div><div class="stat-key">egaluri</div></div>
  </div>

  <div class="arena">
    <div class="player-box">
      <div class="player-label">Tu</div>
      <div class="player-choice" id="player-choice">❓</div>
    </div>
    <div class="vs-label">VS</div>
    <div class="player-box">
      <div class="player-label">Calculator</div>
      <div class="player-choice" id="cpu-choice">❓</div>
    </div>
  </div>

  <div class="result-msg" id="result-msg">Alege o opțiune pentru a începe</div>

  <div class="choices-row">
    <div class="choice-btn" onclick="play('rock')">🪨</div>
    <div class="choice-btn" onclick="play('paper')">📄</div>
    <div class="choice-btn" onclick="play('scissors')">✂️</div>
  </div>

  <div class="card">
    <div class="field-label" style="margin-bottom:8px">Istoric ultimele runde</div>
    <div class="history-list" id="history-list"></div>
  </div>
</div>

<script>
const CHOICES = { rock: '🪨', paper: '📄', scissors: '✂️' };
const NAMES = { rock: 'Piatră', paper: 'Hârtie', scissors: 'Foarfecă' };
const BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

let wins = 0, losses = 0, ties = 0;
let history = [];

function play(playerChoice) {
  const keys = Object.keys(CHOICES);
  const cpuChoice = keys[Math.floor(Math.random()*3)];

  document.getElementById('player-choice').textContent = CHOICES[playerChoice];
  document.getElementById('cpu-choice').textContent = CHOICES[cpuChoice];

  let result, msg;
  if (playerChoice === cpuChoice) {
    result = 'tie'; ties++;
    msg = `Egalitate — amândoi ați ales ${NAMES[playerChoice]}`;
  } else if (BEATS[playerChoice] === cpuChoice) {
    result = 'win'; wins++;
    msg = `Ai câștigat! ${NAMES[playerChoice]} bate ${NAMES[cpuChoice]}`;
  } else {
    result = 'loss'; losses++;
    msg = `Ai pierdut. ${NAMES[cpuChoice]} bate ${NAMES[playerChoice]}`;
  }

  const resultEl = document.getElementById('result-msg');
  resultEl.className = 'result-msg ' + result;
  resultEl.textContent = msg;

  document.getElementById('stat-wins').textContent = wins;
  document.getElementById('stat-losses').textContent = losses;
  document.getElementById('stat-ties').textContent = ties;

  history.unshift({ result, icon: CHOICES[playerChoice] });
  history = history.slice(0, 20);
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = history.map(h => `<div class="history-chip ${h.result}">${h.icon}</div>`).join('');
}
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Piatra-hârtia-foarfeca</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
