<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Latență Audio — Mini Unelte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="prism.css">
<script src="theme.js"></script>
<style>
:root {
  --accent: #70d0f0;
  --accent-dim: rgba(208,112,240,0.10);
  --accent-border: rgba(208,112,240,0.28);
}

.fields-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--content-gap);
}
@media (max-width: 500px) { .fields-grid { grid-template-columns: 1fr; } }

.field-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.field-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.field-name { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text2); font-weight: 500; }
.field-unit {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--text3);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
}

/* ── Buffer size quick-select ── */
.buffer-presets { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.buffer-btn {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  padding: 3px 9px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.12s;
}
.buffer-btn:hover { border-color: var(--accent-border); }
.buffer-btn.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }

/* ── Result ── */
.result-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  text-align: center;
}
.result-main {
  font-family: var(--font-mono);
  font-size: 2.4rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.2;
}
.result-formula { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text3); margin-top: 4px; }

.info-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 500px) { .info-row { grid-template-columns: 1fr; } }
.info-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.info-val { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.info-key { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }

/* ── Latency perception scale ── */
.scale-wrap { padding: 0.5rem 0; }
.scale-bar {
  position: relative;
  height: 8px;
  background: linear-gradient(90deg, #4af0b0, #f0c040, #f06060);
  border-radius: 4px;
  margin-bottom: 6px;
}
.scale-marker {
  position: absolute;
  top: -4px;
  width: 3px;
  height: 16px;
  background: var(--text);
  border-radius: 2px;
  transform: translateX(-50%);
  transition: left 0.2s ease;
}
.scale-labels {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--text3);
}
.scale-note {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text2);
  margin-top: 10px;
  text-align: center;
}

/* ── Ref table ── */
.ref-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.72rem; }
.ref-table th { text-align: left; color: var(--text3); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 5px 10px; border-bottom: 1px solid var(--border); }
.ref-table th:not(:first-child) { text-align: center; }
.ref-table td { padding: 4px 10px; border-bottom: 1px solid rgba(128,128,128,0.05); color: var(--text2); }
.ref-table td:not(:first-child) { text-align: center; }
.ref-table tr:hover td { background: var(--bg3); }
</style>
<style id="tool-about-style">
.tool-about-note {
  margin-top: clamp(1.5rem, 4vw, 2.5rem);
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg2);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  line-height: 1.55;
  width: 100%;
}
.tool-about-note strong {
  color: var(--text2);
  font-weight: 600;
}
</style>
</head>
<body data-show-source="true">

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()"></button>

<div class="tool-page">

  <div class="tool-header">
    <a class="back" href="index.html">← index</a>
    <h1>Calculator latență audio</h1>
    <p>Buffer size + sample rate → latență în milisecunde</p>
  </div>

  <!-- Câmpuri -->
  <div class="fields-grid" style="margin-bottom:var(--content-gap)">
    <div class="field-card">
      <div class="field-top"><span class="field-name">Buffer size</span><span class="field-unit">samples</span></div>
      <input class="input-calc" id="in-buffer" type="number" min="1" step="1" value="256"
             style="--input-color:var(--accent);font-size:1.1rem" oninput="compute()">
      <div class="buffer-presets" id="buffer-presets"></div>
    </div>
    <div class="field-card">
      <div class="field-top"><span class="field-name">Sample rate</span><span class="field-unit">Hz</span></div>
      <input class="input-calc" id="in-samplerate" type="number" min="1" step="1" value="48000"
             style="--input-color:var(--accent);font-size:1.1rem" oninput="compute()">
      <div class="buffer-presets" id="samplerate-presets"></div>
    </div>
  </div>

  <!-- Rezultat -->
  <div class="result-card" style="margin-bottom:var(--content-gap)">
    <div class="result-main" id="result-main">—</div>
    <div class="result-formula" id="result-formula"></div>
  </div>

  <!-- Scală percepție -->
  <div class="card" style="margin-bottom:var(--content-gap)">
    <div class="field-name" style="margin-bottom:10px">Percepție umană a latenței</div>
    <div class="scale-wrap">
      <div class="scale-bar">
        <div class="scale-marker" id="scale-marker" style="left:0%"></div>
      </div>
      <div class="scale-labels">
        <span>0ms</span>
        <span>10ms</span>
        <span>20ms</span>
        <span>30ms</span>
        <span>40ms+</span>
      </div>
    </div>
    <div class="scale-note" id="scale-note"></div>
  </div>

  <!-- Info -->
  <div class="info-row" style="margin-bottom:var(--content-gap)">
    <div class="info-card"><div class="info-val" id="info-roundtrip">—</div><div class="info-key">round-trip (×2)</div></div>
    <div class="info-card"><div class="info-val" id="info-bufferms">—</div><div class="info-key">1 buffer = </div></div>
    <div class="info-card"><div class="info-val" id="info-buffersec">—</div><div class="info-key">buffere/secundă</div></div>
  </div>

  <!-- Tabel comparativ -->
  <div class="card">
    <div class="field-name" style="margin-bottom:10px">Latență la sample rate-uri comune</div>
    <table class="ref-table" id="ref-table"></table>
  </div>

</div>

<div class="toast" id="toast">
</div>

<script>
const BUFFER_SIZES = [32, 64, 128, 256, 512, 1024, 2048];
const SAMPLE_RATES = [8000, 16000, 22050, 44100, 48000, 96000, 192000];

function trim(n) { return parseFloat(n.toPrecision(5)).toString(); }

function currentBuffer() { return parseFloat(document.getElementById('in-buffer').value); }
function currentRate() { return parseFloat(document.getElementById('in-samplerate').value); }

function computeLatencyMs(buffer, rate) {
  return (buffer / rate) * 1000;
}

function buildPresets() {
  const bufWrap = document.getElementById('buffer-presets');
  BUFFER_SIZES.forEach(b => {
    const btn = document.createElement('div');
    btn.className = 'buffer-btn';
    btn.textContent = b;
    btn.onclick = () => { document.getElementById('in-buffer').value = b; compute(); };
    btn.dataset.val = b;
    bufWrap.appendChild(btn);
  });

  const rateWrap = document.getElementById('samplerate-presets');
  SAMPLE_RATES.forEach(r => {
    const btn = document.createElement('div');
    btn.className = 'buffer-btn';
    btn.textContent = r % 1000 === 0 ? (r/1000) + 'k' : trim(r/1000) + 'k';
    btn.onclick = () => { document.getElementById('in-samplerate').value = r; compute(); };
    btn.dataset.val = r;
    rateWrap.appendChild(btn);
  });
}

function updatePresetActive() {
  const buf = currentBuffer(), rate = currentRate();
  document.querySelectorAll('#buffer-presets .buffer-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.val) === buf);
  });
  document.querySelectorAll('#samplerate-presets .buffer-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.val) === rate);
  });
}

function compute() {
  const buffer = currentBuffer();
  const rate = currentRate();
  const main = document.getElementById('result-main');
  const formula = document.getElementById('result-formula');

  updatePresetActive();

  if (isNaN(buffer) || isNaN(rate) || buffer <= 0 || rate <= 0) {
    main.textContent = '—'; formula.textContent = 'Completează ambele câmpuri';
    document.getElementById('info-roundtrip').textContent = '—';
    document.getElementById('info-bufferms').textContent = '—';
    document.getElementById('info-buffersec').textContent = '—';
    document.getElementById('scale-marker').style.left = '0%';
    document.getElementById('scale-note').textContent = '';
    return;
  }

  const latencyMs = computeLatencyMs(buffer, rate);
  main.textContent = trim(latencyMs) + ' ms';
  formula.textContent = `Latență = (buffer / sample rate) × 1000 = (${buffer} / ${rate}Hz) × 1000`;

  document.getElementById('info-roundtrip').textContent = trim(latencyMs*2) + ' ms';
  document.getElementById('info-bufferms').textContent = trim(latencyMs) + ' ms';
  document.getElementById('info-buffersec').textContent = trim(rate/buffer) + ' /s';

  // Scală: 0-40ms mapat pe 0-100%
  const pct = Math.min(100, (latencyMs / 40) * 100);
  document.getElementById('scale-marker').style.left = pct + '%';

  let note;
  if (latencyMs < 5) note = 'Excelent — imperceptibil, potrivit pentru monitorizare live la înregistrare.';
  else if (latencyMs < 10) note = 'Foarte bun — greu de perceput, potrivit pentru majoritatea aplicațiilor live.';
  else if (latencyMs < 20) note = 'Acceptabil — unii muzicieni pot sesiza o ușoară întârziere la cântat live.';
  else if (latencyMs < 30) note = 'Perceptibil — poate deranja la monitorizare live, ok pentru playback simplu.';
  else note = 'Ridicat — întârziere clar sesizabilă, evită pentru înregistrare/monitorizare live.';
  document.getElementById('scale-note').textContent = note;

  buildRefTable(buffer);
}

function buildRefTable(buffer) {
  const table = document.getElementById('ref-table');
  table.innerHTML = `<thead><tr><th>Sample rate</th><th>Latență (1 buffer)</th><th>Round-trip (×2)</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  SAMPLE_RATES.forEach(r => {
    const lat = computeLatencyMs(buffer, r);
    const label = r % 1000 === 0 ? (r/1000) + 'kHz' : trim(r/1000) + 'kHz';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${label}</td><td>${trim(lat)} ms</td><td>${trim(lat*2)} ms</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

buildPresets();
compute();
</script>
<script src="prism.js"></script>
<script src="site.js"></script>
<script>
(() => {
  const page = document.querySelector('.tool-page');
  if (!page) return;
  const note = document.createElement('div');
  note.className = 'tool-about-note';
  note.innerHTML = '<strong>Calculator latență audio</strong> face parte din colecția <strong>Mini Unelte</strong>, selectată, testată și integrată de <strong>Gabriel Valentin Cristescu</strong>. Implementarea a fost realizată cu asistență AI.';
  page.appendChild(note);
})();
</script>

<script>
(() => {
  const page = document.querySelector('.tool-page');
  const note = document.querySelector('.tool-about-note');
  if (page && note) page.appendChild(note);
})();
</script>

</body>
</html>
