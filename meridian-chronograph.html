<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meridian Chronograph</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Jost:wght@400;500&display=swap">
<style>
/* Concept: ceasul ocupă cât mai mult din ecran, panoul de comenzi stă în dreapta (landscape) sau dedesubt (portrait). */
:root{
  --bg:#E8E9EB; --fg:#1B1C20; --muted:#686B73; --line:#C4C6CC; --focus:#2F6BFF;
  --font-ui:'Jost','Century Gothic','Avenir Next',system-ui,sans-serif;
  --font-dial:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --gap:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141518;--fg:#ECEDEF;--muted:#9A9DA6;--line:#363840;--focus:#7AA2FF;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#141518;--fg:#ECEDEF;--muted:#9A9DA6;--line:#363840;--focus:#7AA2FF;color-scheme:dark}

html,body{height:100%}
html{box-sizing:border-box;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
:root[data-theme="light"]{color-scheme:light}
.meridian-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px;margin:0 auto 8px;max-width:1100px}
.meridian-nav h1{font:500 clamp(.88rem,2vw,1.1rem) var(--font-ui);margin:0}
.meridian-nav a,.meridian-nav button{font:500 .78rem var(--font-ui);color:var(--fg);white-space:nowrap}
.meridian-nav a{text-underline-offset:.2em}
.meridian-nav button{padding:5px 7px;background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer}

body{
  box-sizing:border-box;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
}

/* Portrait: ceasul sus, comenzile dedesubt */
.layout{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:680px;margin:0 auto}
.stage{width:100%;min-width:0}
.watch{
  display:block;width:100%;height:auto;max-height:92vh;
  filter:drop-shadow(0 22px 22px rgba(0,0,0,.26));
  --dial:#1F4A3D;--ink:#E9E4D3;--sub:#173A2F;--subRing:rgba(255,255,255,.1);--subInk:#E4DFCF;--sh:#E9E4D3;
  --mk1:#F3F1EA;--mk2:#A9AEB3;--hl:#F4F5F7;--hr:#8E939B;--secs:#E2623A;--strap:#5A3622;--stitch:#C9A27A;
}
.panel{width:100%;max-width:560px;display:flex;flex-direction:column;gap:var(--gap);min-width:0}

/* Landscape (desktop și telefon): ceasul în stânga, panoul în dreapta */
@media (orientation:landscape) and (min-width:640px){
  .layout{flex-direction:row;align-items:stretch;justify-content:center;max-width:none;height:calc(100% - 44px);gap:clamp(12px,3vw,48px)}
  .stage{flex:0 1 auto;width:auto;height:100%;aspect-ratio:var(--ar)}
  .watch{height:100%;max-height:none}
  .panel{flex:0 0 clamp(300px,31vw,390px);width:auto;max-width:none;max-height:100%;overflow-y:auto}
  .panel>:first-child{margin-top:auto}
  .panel>:last-child{margin-bottom:auto}
}
@media (max-height:560px){
  :root{--gap:10px}
  .val{font-size:24px!important} .val.big{font-size:28px!important}
  button.txt,.seg button{padding-block:8px!important}
  .chip{width:28px;height:28px}
  .hint{display:none}
}
/* Telefon în landscape: panoul pe două coloane, ca să încapă pe înălțime */
@media (orientation:landscape) and (min-width:640px) and (max-height:560px){
  .panel{flex-basis:clamp(420px,62vw,620px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"colors clock" "colors state" "voice modes";gap:12px 20px;align-content:center}
  .panel>.blk,.panel>.blk+.blk{border-top:0;padding-top:0;margin:0}
  .b-colors{grid-area:colors} .b-clock{grid-area:clock} .b-state{grid-area:state} .b-modes{grid-area:modes} .b-voice{grid-area:voice}
}

.f-dial{fill:var(--dial)} .f-ink{fill:var(--ink)} .s-ink{stroke:var(--ink)}
.f-sub{fill:var(--sub)} .f-subink{fill:var(--subInk)} .s-subink{stroke:var(--subInk)}
.f-sh{fill:var(--sh)} .f-secs{fill:var(--secs)} .s-secs{stroke:var(--secs)}
.f-mk1{fill:var(--mk1)} .f-mk2{fill:var(--mk2)} .f-hl{fill:var(--hl)} .f-hr{fill:var(--hr)}
.f-strap{fill:var(--strap)} .s-stitch{stroke:var(--stitch)}
.f-bez{fill:#23262B} .s-bez{stroke:#23262B}
.layout{--phase:#E2623A;--ar:462/640}
.f-phase{fill:var(--phase)} .s-phase{stroke:var(--phase)}
.k-work{fill:var(--cw)} .k-short{fill:var(--cs)} .k-long{fill:var(--cl)}
.pomo #state::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--phase);margin-right:8px}
.num{font-family:var(--font-dial);font-weight:500;text-anchor:middle}
.brand{font-family:var(--font-ui);font-weight:500;text-anchor:middle}
.pusher{cursor:pointer;outline:none;transition:transform .08s ease-out}
.pusher.pressed{transform:translateX(-5px)}
.pusher:focus-visible .cap{stroke:var(--focus);stroke-width:2}
@media (prefers-reduced-motion:reduce){.pusher{transition:none}}

/* Panou */
.blk{display:flex;flex-direction:column;gap:12px}
.blk+.blk{border-top:1px solid var(--line);padding-top:var(--gap)}
.lbl{margin:0;font:500 13px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.line{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.val{font:500 30px/1.1 var(--font-ui);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.val.big{font-size:38px}
.chips{display:flex;flex-wrap:wrap;gap:14px;padding:4px}
.chip{width:34px;height:34px;padding:0;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.3);cursor:pointer}
.chip[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.row.eq>*{flex:1 1 0}
button.txt{font:500 15px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);background:transparent;border:1px solid var(--line);padding:12px 18px;border-radius:4px;cursor:pointer}
button.txt:hover:not(:disabled){border-color:var(--fg)}
button.txt:disabled{opacity:.38;cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;font:500 15px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;padding:12px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.pomo-set{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}
.pomo-set label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);min-width:0}
.pomo-set input{width:100%;box-sizing:border-box;font:500 17px var(--font-ui);padding:8px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--fg);font-variant-numeric:tabular-nums}
.pomo-set input:disabled{opacity:.45}
.pomo-set span{font-size:14px;color:var(--muted);padding-bottom:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--fg);cursor:pointer}
.chk input{width:18px;height:18px;margin:0}
.note{font-size:13px;color:var(--muted);margin:0}
.note:empty{display:none}
.hint{font-size:13px;line-height:1.5;color:var(--muted);margin:0}
</style>
</head>
<body>
<header class="meridian-nav">
  <a href="index.html#edu">← Educaționale</a>
  <h1>Meridian Chronograph</h1>
  <button id="theme-btn" type="button" onclick="toggleTheme()" aria-label="Schimbă tema"></button>
</header>

<main class="layout">
<div class="stage">
<svg class="watch" id="watch" viewBox="30 60 462 640" role="group" aria-label="Ceas analogic cu cronograf, ora locală în timp real">
<defs>
  <linearGradient id="caseG" gradientUnits="userSpaceOnUse" x1="-200" y1="-220" x2="210" y2="230">
    <stop offset="0" stop-color="#F7F8FA"/><stop offset=".22" stop-color="#A6ABB3"/><stop offset=".45" stop-color="#EDEFF1"/><stop offset=".7" stop-color="#7A7F88"/><stop offset="1" stop-color="#D9DCE0"/>
  </linearGradient>
  <linearGradient id="bezG" gradientUnits="userSpaceOnUse" x1="-180" y1="-180" x2="180" y2="180">
    <stop offset="0" stop-color="#E9EBEE"/><stop offset=".35" stop-color="#BFC3C9"/><stop offset=".6" stop-color="#E4E6E9"/><stop offset="1" stop-color="#A3A8B0"/>
  </linearGradient>
  <linearGradient id="chamG" gradientUnits="userSpaceOnUse" x1="-170" y1="-170" x2="170" y2="170">
    <stop offset="0" stop-color="#5E626A"/><stop offset="1" stop-color="#F2F3F5"/>
  </linearGradient>
  <linearGradient id="lugG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F2F3F5"/><stop offset=".5" stop-color="#9DA2AA"/><stop offset="1" stop-color="#E3E5E8"/>
  </linearGradient>
  <linearGradient id="capG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F5F6F8"/><stop offset=".45" stop-color="#9EA3AB"/><stop offset="1" stop-color="#CDD0D5"/>
  </linearGradient>
  <linearGradient id="strapShade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".42"/><stop offset=".16" stop-color="#000" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset=".84" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/>
  </linearGradient>
  <linearGradient id="fadeG" gradientUnits="userSpaceOnUse" x1="0" y1="-320" x2="0" y2="320">
    <stop offset="0" stop-color="#000"/><stop offset=".1" stop-color="#fff"/><stop offset=".9" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
  </linearGradient>
  <mask id="fade" maskUnits="userSpaceOnUse" x="-130" y="-380" width="260" height="760">
    <rect x="-130" y="-380" width="260" height="760" fill="url(#fadeG)"/>
  </mask>
  <radialGradient id="dialLight" gradientUnits="userSpaceOnUse" cx="-60" cy="-80" r="260">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="dialShade" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="170">
    <stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </radialGradient>
  <radialGradient id="domeG" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#B7BBC2"/><stop offset="1" stop-color="#6D727A"/>
  </radialGradient>
  <filter id="hs" filterUnits="userSpaceOnUse" x="-200" y="-200" width="400" height="400">
    <feDropShadow dx="1.4" dy="2.6" stdDeviation="1.8" flood-color="#000" flood-opacity=".32"/>
  </filter>
</defs>

<g transform="translate(260,380)">
  <g id="straps" mask="url(#fade)"></g>  <g id="lugs"></g>

  <!-- Coroană -->
  <rect x="200" y="-15" width="24" height="30" rx="4" fill="url(#capG)" stroke="rgba(0,0,0,.3)" stroke-width=".6"/>
  <g stroke="rgba(0,0,0,.4)" stroke-width="1">
    <line x1="205.5" y1="-13" x2="205.5" y2="13"/><line x1="209" y1="-13" x2="209" y2="13"/><line x1="212.5" y1="-13" x2="212.5" y2="13"/><line x1="216" y1="-13" x2="216" y2="13"/><line x1="219.5" y1="-13" x2="219.5" y2="13"/>
  </g>
  <!-- Butoane -->
  <g transform="rotate(-32)">
    <g class="pusher" id="pTop" role="button" tabindex="0" aria-label="Pornește sau oprește"><title>Pornește / oprește (Spațiu)</title>
      <rect x="200" y="-7" width="14" height="14" fill="#7A7F88"/>
      <rect class="cap" x="212" y="-12" width="22" height="24" rx="4" fill="url(#capG)" stroke="rgba(0,0,0,.3)" stroke-width=".6"/>
      <rect x="190" y="-26" width="54" height="52" fill="transparent"/>
    </g>
  </g>
  <g transform="rotate(32)">
    <g class="pusher" id="pBot" role="button" tabindex="0" aria-label="Resetează"><title>Resetează la zero (R)</title>
      <rect x="200" y="-7" width="14" height="14" fill="#7A7F88"/>
      <rect class="cap" x="212" y="-12" width="22" height="24" rx="4" fill="url(#capG)" stroke="rgba(0,0,0,.3)" stroke-width=".6"/>
      <rect x="190" y="-26" width="54" height="52" fill="transparent"/>
    </g>
  </g>

  <!-- Carcasă și rama tahimetrică -->
  <circle r="208" fill="url(#caseG)" stroke="rgba(0,0,0,.3)" stroke-width=".8"/>
  <circle r="205" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1"/>
  <circle r="200" fill="url(#bezG)" stroke="rgba(0,0,0,.25)" stroke-width=".8"/>
  <circle r="176" fill="url(#chamG)" stroke="rgba(0,0,0,.3)" stroke-width=".8"/>
  <g id="bezel"></g>
  <g id="face"></g>
</g>
</svg>
</div>

<aside class="panel" aria-label="Comenzi">
  <section class="blk b-colors">
    <div class="line"><h2 class="lbl">Culori</h2><label class="chk" title="Arată sau ascunde cureaua. Fără curea, ceasul se poate mări"><input type="checkbox" id="strapChk" checked> Curea</label></div>
    <div class="chips" id="swatches" role="group" aria-label="Culoare cadran"></div>
  </section>

  <section class="blk b-clock">
    <div class="line"><h2 class="lbl">Ora curentă</h2><div class="val" id="clock">00:00:00</div></div>
  </section>

  <section class="blk b-state">
    <div class="line"><h2 class="lbl" id="state">Oprit</h2><div class="val big" id="lap">00:00,00</div></div>
    <div class="row eq">
      <button class="txt" id="bStart" type="button" title="Pornește / oprește (Spațiu)">Start</button>
      <button class="txt" id="bReset" type="button" title="Resetează la zero (R)" disabled>Resetare</button>
    </div>
  </section>

  <section class="blk b-modes">
    <div class="seg" role="group" aria-label="Mod">
      <button type="button" id="bModeC" aria-pressed="true" title="Cronometru, cu sutimi de secundă">Cronograf</button>
      <button type="button" id="bModeP" aria-pressed="false" title="Sesiuni de lucru și pauze">Pomodoro</button>
    </div>
    <div class="pomo-set">
      <label for="iWork" title="Durata unei sesiuni de lucru, în minute">Lucru<input id="iWork" type="number" min="1" max="30" value="25" inputmode="numeric"></label>
      <label for="iShort" title="Durata pauzei scurte, în minute">Pauză<input id="iShort" type="number" min="1" max="30" value="5" inputmode="numeric"></label>
      <label for="iLong" title="Durata pauzei lungi, după patru sesiuni, în minute">Pauză lungă<input id="iLong" type="number" min="1" max="30" value="15" inputmode="numeric"></label>
      <span>minute</span>
    </div>
  </section>

  <section class="blk b-voice">
    <div class="row">
      <button class="txt" id="bSay" type="button" title="Spune ora curentă (T)">Spune ora</button>
      <label class="chk" title="Anunță ora fixă și fazele Pomodoro"><input type="checkbox" id="auto"> Voce automată</label>
      <label class="chk" title="Notificare de browser la schimbarea fazei Pomodoro, când pagina nu e în fața ta"><input type="checkbox" id="notif"> Notificări</label>
    </div>
    <p class="note" id="voiceNote" aria-live="polite"></p>
    <p class="hint">Tastatură: Spațiu pornește și oprește, R resetează, T spune ora. Atinge cadranul ca să auzi ora.</p>
  </section>
</aside>
</main>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var $=function(id){return document.getElementById(id)};
  function el(n,a,p){var e=document.createElementNS(NS,n);if(a)for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
  var rad=function(d){return d*Math.PI/180};
  var pt=function(r,d){return [+(r*Math.sin(rad(d))).toFixed(2),+(-r*Math.cos(rad(d))).toFixed(2)]};
  var p2=function(n){return String(n).padStart(2,'0')};
  var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Curea din piele și urechi ---------- */
  var straps=$('straps'),lugs=$('lugs');
  [-1,1].forEach(function(s){
    var pts=[[-94,150*s],[94,150*s],[94,400*s],[-94,400*s]].map(function(p){return p.join(',')}).join(' ');
    el('polygon',{points:pts,class:'f-strap'},straps);
    el('polygon',{points:pts,fill:'url(#strapShade)'},straps);
    [-1,1].forEach(function(x){
      el('line',{x1:x*83,y1:150*s,x2:x*83,y2:400*s,'stroke-width':1.5,'stroke-dasharray':'7 5',class:'s-stitch'},straps);
    });
  });
  [-1,1].forEach(function(sx){[-1,1].forEach(function(sy){
    var g=el('g',{transform:'scale('+sx+','+sy+')'},lugs);
    el('path',{d:'M-126,-140 L-126,-208 Q-126,-231.5 -104,-234 L-93,-234 L-93,-140 Z',fill:'url(#lugG)',stroke:'rgba(0,0,0,.35)','stroke-width':.8},g);
    el('path',{d:'M-120,-150 L-120,-207 Q-120,-224.5 -104,-228.5',fill:'none',stroke:'#fff','stroke-opacity':.55,'stroke-width':1.1},g);  });});

  /* ---------- Utilitare cadran ---------- */
  function ticks(g,n,r0,rm,rM,every,cls,wm,wM){
    for(var i=0;i<n;i++){
      var d=i*360/n,M=i%every===0,a=pt(r0,d),b=pt(M?rM:rm,d);
      el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],'stroke-width':M?wM:wm,class:cls},g);
    }
  }
  function label(g,txt,r,d,size,cls,rot,weight){
    var p=pt(r,d),t=el('text',{x:p[0],y:p[1],dy:'.36em','font-size':size,class:'num '+cls},g);
    if(rot)t.setAttribute('transform','rotate('+rot+' '+p[0]+' '+p[1]+')');
    if(weight)t.style.fontWeight=weight;
    t.textContent=txt;return t;
  }
  function baton(g,x,hw,y0,y1){
    el('polygon',{points:(x-hw)+','+y0+' '+x+','+y0+' '+x+','+y1+' '+(x-hw*.85)+','+y1,class:'f-mk1',stroke:'rgba(0,0,0,.25)','stroke-width':.4},g);
    el('polygon',{points:x+','+y0+' '+(x+hw)+','+y0+' '+(x+hw*.85)+','+y1+' '+x+','+y1,class:'f-mk2',stroke:'rgba(0,0,0,.25)','stroke-width':.4},g);
  }
  function dauphine(g,len,tail,w){
    var sy=-Math.min(18,len*.16),h=el('g',null,g);
    var tip='0,'+(-len),L=(-w)+','+sy,R=w+','+sy,TL=(-w*.45)+','+tail,TR=(w*.45)+','+tail,B='0,'+tail;
    el('polygon',{points:[tip,L,TL,B].join(' '),class:'f-hl',stroke:'rgba(0,0,0,.35)','stroke-width':.5},h);
    el('polygon',{points:[tip,B,TR,R].join(' '),class:'f-hr',stroke:'rgba(0,0,0,.35)','stroke-width':.5},h);
    return h;
  }
  function arrow(g,len,tail,cls){
    var h=el('g',null,g),b=len-12,sw=1.3,hw=3.8;
    el('polygon',{points:(-sw)+','+tail+' '+(-sw)+','+(-b)+' '+(-hw)+','+(-b)+' 0,'+(-len)+' '+hw+','+(-b)+' '+sw+','+(-b)+' '+sw+','+tail,class:cls},h);
    el('circle',{r:3.8,class:cls},h);
    el('circle',{r:1.3,class:'f-sub'},h);
    return h;
  }

  /* ---------- Rama tahimetrică ---------- */
  var bz=$('bezel');
  [60,65,70,75,80,90,100,110,120,130,140,150,160,180,200,220,250,300,350,400,500].forEach(function(v){
    var ang=v===60?0:21600/v,a=pt(177,ang),b=pt(181,ang);
    el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],'stroke-width':.9,class:'s-bez'},bz);
    label(bz,String(v),190,ang,v>=250?11:12,'f-bez',(ang>90&&ang<270)?ang-180:ang);
  });
  var kt=label(bz,'KM/H',190,22,8.5,'f-bez',22);kt.style.letterSpacing='1.4px';
  /* ---------- Marcaje Pomodoro: lucru + pauză în continuare, cu urma timpului scurs ---------- */
  // Arc între a0 și a1 (grade, în sensul acelor de ceasornic); cu r0=0 devine sector
  function arcPath(a0,a1,r0,r1){
    var th=a1-a0;

    }
    bModeC.setAttribute('aria-pressed',mode==='chrono'?'true':'false');
    bModeP.setAttribute('aria-pressed',mode==='pomo'?'true':'false');
    [iWork,iShort,iLong].forEach(function(i){i.disabled=pm.running});
    applyPhase();
    schedulePomo();
  }
  function toggle(){audio();if(mode==='chrono')chronoToggle();else pomoToggle();ui()}
  function reset(){if(mode==='chrono')chronoReset();else pomoReset();ui()}
  // Modurile se exclud: la schimbare, cronometrul sau Pomodoro care rula se oprește și își păstrează starea.
  function setMode(m){
    if(m===mode)return;
    var now=performance.now();
    if(ch.running){ch.acc+=now-ch.t0;ch.running=false}
    if(pm.running){pm.acc+=now-pm.t0;pm.running=false}
    mode=m;lastLap='';ui();
  }
  bStart.addEventListener('click',toggle);
  bReset.addEventListener('click',reset);
  bModeC.addEventListener('click',function(){setMode('chrono')});
  bModeP.addEventListener('click',function(){setMode('pomo')});
  $('bSay').addEventListener('click',function(){speak(timePhrase(new Date()))});
  face.style.cursor='pointer';
  face.addEventListener('click',function(){speak(timePhrase(new Date()))});

  var pTop=$('pTop'),pBot=$('pBot');
  function flash(g){g.classList.add('pressed');setTimeout(function(){g.classList.remove('pressed')},130)}
  function bindPusher(g,action){
    g.addEventListener('pointerdown',function(){g.classList.add('pressed')});
    ['pointerup','pointerleave','pointercancel'].forEach(function(t){g.addEventListener(t,function(){g.classList.remove('pressed')})});
    g.addEventListener('click',action);
    g.addEventListener('keydown',function(e){if(e.code==='Enter'){e.preventDefault();flash(g);action()}});
  }
  bindPusher(pTop,toggle);bindPusher(pBot,reset);

  // Lasă controalele native să își păstreze acțiunile de la tastatură.
  function usesNativeKeys(e){return e.target.closest?.('a,button,input,select,textarea,[contenteditable]')}

  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey||usesNativeKeys(e))return;
    if(e.code==='Space'){e.preventDefault();e.stopPropagation();if(!e.repeat){flash(pTop);toggle()}}
    else if(e.code==='KeyR'){if(!e.repeat){flash(pBot);reset()}}
    else if(e.code==='KeyT'){if(!e.repeat)speak(timePhrase(new Date()))}
  },true);
  document.addEventListener('keyup',function(e){
    if(e.code==='Space'&&!usesNativeKeys(e)){e.preventDefault();e.stopPropagation()}
  },true);

  // Avertizare la închiderea paginii cât timp rulează cronometrul sau Pomodoro.
  window.addEventListener('beforeunload',function(e){
    if(ch.running||pm.running){e.preventDefault();e.returnValue='';return ''}
  });

  /* ---------- Mișcare ---------- */
  var rot=function(g,a){g.setAttribute('transform','rotate('+a.toFixed(2)+')')};
  var eb=function(t){var c1=1.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
  var lastLap='',lastDay=-1,lastHr=-1,lastClock='';
  function frame(){
    var d=new Date(),ms=d.getMilliseconds(),s=d.getSeconds(),m=d.getMinutes(),h=d.getHours()%12;
    var secF=s+ms/1000,minF=m+secF/60,hrF=h+minF/60;
    rot(hHour,hrF*30);rot(hMin,minF*6);

    var f=ms/1000,kk=Math.min(f/.16,1);
    rot(hSubSec,(s+(reduced?f:(kk<1?eb(kk):1)))*6);

    var now=performance.now(),a,lap;
    if(mode==='pomo'){
      var D=pDur(),e=Math.min(pEl(now),D),rem=D-e,eMin=e/60000;
      // Perechea lucru + pauză se desenează o singură dată, cu pauza în continuarea lucrului
      var W=mins(iWork,25),kB=pm.phase==='work'?((pm.done+1>=4)?'long':'short'):pm.phase;
      var B=kB==='long'?mins(iLong,15):mins(iShort,5);
      var tB=pm.phase==='work'?eMin:W+eMin;
      var segsB=[{k:'work',a:0,b:W},{k:kB,a:W,b:W+B}];
      // Subcadranul are scara de 30 de minute; dacă perechea nu încape, arată doar faza curentă
      var fits=W+B<=30;
      var segsS=fits?segsB:[{k:pm.phase,a:0,b:D/60000}],tS=fits?tB:eMin;
      a=[(e%60000)/60000*360,tS*12,pm.done*90];
      lap=fmtRem(rem);
      drawMarks(segsB,tB,segsS,tS);
    }else{
      if(ch.anim){
        var t=Math.min((now-ch.anim.t0)/420,1),r=1-Math.pow(1-t,3);
        a=[ch.anim.a[0]*(1-r),ch.anim.a[1]*(1-r),ch.anim.a[2]*(1-r)];
        if(t>=1)ch.anim=null;
      }else a=angles(elapsed(now));
      lap=fmt(ch.anim?0:elapsed(now));
      clearMarks();
    }
    rot(hChr,a[0]);rot(hSubMin,a[1]);rot(hSubHr,a[2]);
    if(lap!==lastLap){elLap.textContent=lap;lastLap=lap}
    var ck=p2(d.getHours())+':'+p2(m)+':'+p2(s);
    if(ck!==lastClock){elClock.textContent=ck;lastClock=ck}
    if(d.getDate()!==lastDay){lastDay=d.getDate();dateTxt.textContent=String(lastDay)}
    requestAnimationFrame(frame);
  }
  ui();
  requestAnimationFrame(frame);
  // Verificări care trebuie să meargă și când fila e în fundal
  setInterval(function(){
    pomoTick();
    var d=new Date(),key=d.getDate()*24+d.getHours();
    if(auto.checked&&d.getMinutes()===0&&d.getSeconds()<3&&lastHr!==key){lastHr=key;speak(timePhrase(d))}
  },250);
})();
</script>

</body></html>
