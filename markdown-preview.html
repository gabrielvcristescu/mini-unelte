.mini-btn:hover { border-color: var(--accent-border); color: var(--accent); }

.md-textarea {

  min-height: 480px;

.md-textarea:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-dim); }

.md-preview {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  min-height: 480px;
  max-height: 480px;
  overflow-y: auto;
  font-family: var(--font-sans);
  color: var(--text);
  line-height: 1.7;
}
.md-preview h1, .md-preview h2, .md-preview h3 { font-family: var(--font-sans); font-weight: 700; margin: 1em 0 0.4em; line-height: 1.3; }
.md-preview h1 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.md-preview h2 { font-size: 1.25rem; }
.md-preview h3 { font-size: 1.05rem; }
.md-preview p { margin: 0.6em 0; }
.md-preview ul, .md-preview ol { margin: 0.6em 0; padding-left: 1.5em; }
.md-preview li { margin: 0.2em 0; }
.md-preview code {

  border-radius: 8px;
  padding: 12px 14px;
  overflow-x: auto;
  margin: 0.8em 0;

.md-preview pre code { background: none; padding: 0; color: var(--text2); }
.md-preview blockquote {
  border-left: 3px solid var(--accent-border);
  padding-left: 14px;
  margin: 0.8em 0;
  color: var(--text2);
  font-style: italic;
}
.md-preview a { color: var(--accent); text-decoration: none; }
.md-preview a:hover { text-decoration: underline; }
.md-preview hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }

      </div>
      <textarea class="md-textarea" id="md-input" oninput="render()" spellcheck="false"># Titlu principal

<script>
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Parser Markdown simplu — acoperă cazurile comune, nu e CommonMark complet
function parseMarkdown(md) {
  // Extragem blocurile de cod întâi, ca să nu fie afectate de alte reguli
  const codeBlocks = [];
  md = md.replace(/```([\s\S]*?)```/g, (m, code) => {
    codeBlocks.push(code.replace(/^\n/, '').replace(/\n$/, ''));
    return `\x00CODEBLOCK${codeBlocks.length-1}\x00`;
  });

  const lines = md.split('\n');
  let html = '';
  let inList = null; // 'ul' sau 'ol'
  let inTable = false;
  let tableRows = [];

  function closeList() {
    if (inList) { html += `</${inList}>`; inList = null; }
  }

  function inlineFormat(text) {
    text = escapeHtml(text);
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return text;
  }

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    // Tabel
    if (/^\|.*\|$/.test(line.trim())) {
      if (!inTable) { inTable = true; tableRows = []; }
      tableRows.push(line.trim());
      const nextLine = lines[i+1];
      if (!nextLine || !/^\|.*\|$/.test(nextLine.trim())) {
        // Terminăm tabelul
        html += renderTable(tableRows);
        inTable = false;
      }
      continue;
    }

    // Heading
    const headingMatch = line.match(/^(#{1,3})\s+(.*)$/);
    if (headingMatch) {
      closeList();
      const level = headingMatch[1].length;
      html += `<h${level}>${inlineFormat(headingMatch[2])}</h${level}>`;
      continue;
    }

    // Linie orizontală
    if (/^---+$/.test(line.trim())) {
      closeList();
      html += '<hr>';
      continue;
    }

    // Blockquote
    const quoteMatch = line.match(/^>\s?(.*)$/);
    if (quoteMatch) {
      closeList();
      html += `<blockquote>${inlineFormat(quoteMatch[1])}</blockquote>`;
      continue;
    }

    // Listă neordonată (cu suport indentare simplă pentru sub-listă)
    const ulMatch = line.match(/^(\s*)[-*]\s+(.*)$/);
    if (ulMatch) {
      if (inList !== 'ul') { closeList(); html += '<ul>'; inList = 'ul'; }
      html += `<li>${inlineFormat(ulMatch[2])}</li>`;
      continue;
    }

    // Listă ordonată
    const olMatch = line.match(/^\s*\d+\.\s+(.*)$/);
    if (olMatch) {
      if (inList !== 'ol') { closeList(); html += '<ol>'; inList = 'ol'; }
      html += `<li>${inlineFormat(olMatch[1])}</li>`;
      continue;
    }

    closeList();

    // Cod block placeholder
    const codeMatch = line.match(/\x00CODEBLOCK(\d+)\x00/);
    if (codeMatch) {
      html += `<pre><code>${escapeHtml(codeBlocks[parseInt(codeMatch[1])])}</code></pre>`;
      continue;
    }

    // Paragraf normal (linie ne-goală)
    if (line.trim() !== '') {
      html += `<p>${inlineFormat(line)}</p>`;
    }
  }
  closeList();

  return html;
}

function renderTable(rows) {
  if (rows.length < 2) return '';
  const parseRow = r => r.slice(1,-1).split('|').map(c => c.trim());
  const header = parseRow(rows[0]);
  const bodyRows = rows.slice(2).map(parseRow); // rows[1] e linia separator ---|---

  let html = '<table><thead><tr>';
  header.forEach(h => html += `<th>${escapeHtml(h)}</th>`);
  html += '</tr></thead><tbody>';
  bodyRows.forEach(row => {
    html += '<tr>';
    row.forEach(c => html += `<td>${escapeHtml(c)}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

function render() {
  const md = document.getElementById('md-input').value;
  document.getElementById('md-preview').innerHTML = parseMarkdown(md);
}

function clearInput() {
  document.getElementById('md-input').value = '';
  render();
}

function pasteInto() {
  navigator.clipboard.readText().then(text => {
    document.getElementById('md-input').value = text;
    render();
  }).catch(() => showToast('Nu s-a putut accesa clipboard-ul'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

render();
</script>
